<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11 · Completed setup topology — UX walkthrough</title>
  <style>
    :root{color-scheme:light dark;--page:#ececef;--paper:#fff;--panel:#f5f5f7;--ink:#252529;--muted:#6d6d74;--line:#d5d5da;--accent:#2769b5;--ok:#367b4d;--warn:#a76222;--shadow:0 22px 60px rgb(20 20 28/.14)}
    [data-theme=dark]{--page:#111113;--paper:#1c1c1f;--panel:#26262a;--ink:#f1f1f3;--muted:#aaaab1;--line:#3c3c41;--accent:#75adf4;--ok:#69be7e;--warn:#e6a55e;--shadow:0 24px 70px rgb(0 0 0/.45)}
    @media(prefers-color-scheme:dark){html[data-theme=auto]{--page:#111113;--paper:#1c1c1f;--panel:#26262a;--ink:#f1f1f3;--muted:#aaaab1;--line:#3c3c41;--accent:#75adf4;--ok:#69be7e;--warn:#e6a55e;--shadow:0 24px 70px rgb(0 0 0/.45)}}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(16px)}
    header strong{white-space:nowrap}.toc{display:flex;gap:5px}.toc a,.theme{border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit}.toc a.active{border-color:var(--accent);color:var(--accent)}.theme{margin-left:auto}
    main{width:min(1240px,calc(100% - 30px));margin:34px auto 70px}.intro{max-width:850px;margin-bottom:28px}.kicker,.eyebrow{font-size:11px;font-weight:750;letter-spacing:.08em;color:var(--accent)}h1{font-size:42px;line-height:1.04;letter-spacing:-.04em;margin:7px 0 10px}.intro p{font-size:17px;color:var(--muted);margin:0}.head{display:flex;gap:10px;align-items:baseline;margin-bottom:13px}.head span{color:var(--muted);font:700 11px/1 ui-monospace,monospace}.head h2{font-size:22px;margin:0}
    .registers{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:20px;align-items:start}.window{overflow:hidden;min-height:690px;border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:var(--shadow)}.titlebar{height:46px;display:flex;align-items:center;gap:7px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:650}.dot{width:11px;height:11px;border:1px solid var(--line);border-radius:50%}.titlebar span{margin-left:9px}
    .content{padding:30px 36px}.content h3{font-size:30px;letter-spacing:-.03em;margin:6px 0 7px}.lead{max-width:760px;color:var(--muted);margin:0 0 20px}.banner,.section,.component,.category{border:1px solid var(--line);border-radius:11px;background:var(--paper)}.banner{padding:16px;margin-bottom:18px;border-left:4px solid var(--accent)}.banner h4,.banner p{margin:0}.banner p{margin-top:4px;color:var(--muted)}
    .section{padding:17px;margin-top:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h4{font-size:18px;margin:0}.stack{display:grid;gap:9px}.component{padding:13px}.component-head,.tier,.category{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.component-head{align-items:center}.component-head strong{font-size:16px}.status{font-size:12px;font-weight:700;color:var(--muted)}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
    .tiers{margin-top:10px;border-top:1px solid var(--line)}.tier{padding:9px 0;border-bottom:1px solid var(--line)}.tier:last-child{border-bottom:0;padding-bottom:0}.tier b{font-size:12px}.tier small{display:block;color:var(--muted);margin-top:2px}.tier .status{text-align:right}.category{align-items:center;padding:12px;background:var(--panel);color:var(--ink);text-decoration:none}.category strong,.category small{display:block}.category small{color:var(--muted);margin-top:2px}.count{font-size:20px;font-weight:750}
    button{min-height:34px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);padding:7px 11px;font:inherit}.primary{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:650}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.comment{border-left:2px solid var(--accent);padding-left:15px}.comment h4{margin:0 0 6px;font-size:12px;text-transform:uppercase}.comment li{color:var(--muted)}.pager{display:flex;justify-content:space-between;margin-top:14px}.pager a{color:var(--accent);text-decoration:none}
    @media(max-width:900px){.registers{grid-template-columns:1fr}}@media(max-width:650px){.toc{display:none}.content{padding:23px}h1{font-size:34px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
<header><strong>Completed setup topology · UX</strong><nav class="toc" id="toc"></nav><button class="theme" id="theme">Theme: system</button></header>
<main>
  <div class="intro"><span class="kicker">UX WALKTHROUGH · OWNER-APPROVED DIRECTION</span><h1>Make “ready” explain the whole ecosystem.</h1><p>Machine usability, four-tier component truth, and project aftercare remain distinct and actionable after onboarding.</p></div>
  <div class="head"><span id="number"></span><h2 id="title"></h2></div>
  <div class="registers"><div class="window" id="window" tabindex="-1"></div><aside class="comment" id="comment"></aside></div>
  <nav class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></nav>
</main>
<script>
const shell=body=>`<div class="titlebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>Copilot Control Tower</span></div><div class="content">${body}</div>`;
const tier=(name,state,detail,kind="")=>`<div class="tier"><div><b>${name}</b><small>${detail}</small></div><span class="status ${kind}">${state}</span></div>`;
const component=(name,state,kind,tiers)=>`<div class="component"><div class="component-head"><strong>${name}</strong><span class="status ${kind}">${state} ›</span></div>${tiers?`<div class="tiers">${tiers}</div>`:""}</div>`;
const category=(count,title,detail,to)=>`<a class="category" href="#s${to}"><div><strong>${title}</strong><small>${detail}</small></div><span class="count">${count} ›</span></a>`;
const screens=[
 {title:"A usable Mac is not falsely called complete",comment:"Two honest states",notes:["The headline says the copilots work.","Personal incompleteness is equally visible.","The primary action finishes only the missing Personal setup."],body:shell(`<span class="eyebrow">YOUR SETUP</span><h3>Your copilots work, but Personal setup is incomplete</h3><p class="lead">Claude and Codex are ready to use. Knowledge Personal and CLI Personal still need setup.</p><div class="banner"><h4>2 of 4 Personal components are ready</h4><p>Finish them now or return here later. Nothing is created just by opening this window.</p><div class="footer"><button class="primary">Finish Personal Setup</button></div></div><div class="section"><div class="section-title"><h4>Your copilots</h4><span class="status warn">2 need setup</span></div><div class="stack">${component("Knowledge Copilot","Needs setup","warn","")}${component("CLI Copilot","Needs setup","warn","")}${component("Claude Copilot","Ready","ok","")}${component("Codex Copilot","Ready","ok","")}</div></div>`)},
 {title:"Every component exposes the same four tiers",comment:"Stable topology",notes:["Rows never disappear when evidence is missing.","Personal is the tier name; private is storage detail.","Department is explicit even when not joined."],body:shell(`<span class="eyebrow">YOUR COPILOTS</span><h3>Knowledge Copilot</h3><p class="lead">See where this component comes from and which parts are active for you.</p><div class="section"><div class="stack">${component("Knowledge Copilot","Needs setup","warn",tier("Foundation","Ready","Core Knowledge Copilot setup","ok")+tier("Organization","Ready","Everyone Needs A Copilot","ok")+tier("Department","Not joined","No department layer is active")+tier("Personal","Needs setup","A private GitHub repository only you can access","warn"))}${component("CLI Copilot","Needs setup","warn","")}${component("Claude Copilot","Ready","ok","")}${component("Codex Copilot","Ready","ok","")}</div></div><div class="footer"><button class="primary">Finish Personal Setup</button></div>`)},
 {title:"A complete result earns a quieter headline",comment:"Completion is evidence-bound",notes:["All four Personal rows must be ready.","Repository slugs stay behind technical disclosure.","Department may remain not joined without blocking Personal completion."],body:shell(`<span class="eyebrow">YOUR SETUP</span><h3>Your ecosystem is ready</h3><p class="lead">Knowledge, CLI, Claude, and Codex have their Foundation, Organization, and Personal setup. You can join a department whenever one is available.</p><div class="section"><div class="section-title"><h4>Your copilots</h4><span class="status ok">4 ready</span></div><div class="stack">${component("Knowledge Copilot","Ready","ok","")}${component("CLI Copilot","Ready","ok","")}${component("Claude Copilot","Ready","ok","")}${component("Codex Copilot","Ready","ok","")}</div></div><div class="section"><div class="section-title"><h4>Your connections</h4><span class="status ok">GitHub ready</span></div><p class="lead">Signed in as pablitoalejo.</p></div>`)},
 {title:"Projects retain the Step 7 classification model",comment:"No second reduced list",notes:["The same helper summary is used.","Every non-empty category is clickable.","Generic “need review” is removed."],body:shell(`<span class="eyebrow">YOUR PROJECTS</span><h3>53 projects found</h3><p class="lead">17 are ready. 17 need guided setup. Control Tower couldn’t confirm 19.</p><div class="stack">${category(17,"Ready","No action needed",5)}${category(17,"Need guided setup","A coding assistant can complete these",5)}${category(19,"Couldn’t confirm","Review the exact evidence",5)}</div><div class="banner" style="margin-top:14px"><h4>Come back whenever you want</h4><p>Finish one or two projects now, or return later. Every unfinished route remains available here.</p></div>`)},
 {title:"A category opens the existing Step 7 experience",comment:"One shared aftercare surface",notes:["Settings does not reimplement guided actions.","Detected, Required, Preserve, and Do not change remain intact.","Assistant launch and independent verification use the existing flow."],body:shell(`<span class="eyebrow">NEEDS GUIDED SETUP</span><h3>admin-server needs a coding assistant</h3><p class="lead">This is the same project detail used during setup. Control Tower will preserve the project’s instructions while the missing connections are added.</p><div class="banner"><h4>What happens next</h4><p>Run the reviewed plan in Codex or Claude Code. Control Tower verifies the result independently afterward.</p><div class="footer"><button class="primary">Run guided setup</button></div></div><div class="section">${tier("Detected","1 instruction · 16 agents · 14 commands","")}${tier("Required","Claude marker and Codex integration","")}${tier("Preserve","CLAUDE.md, agents, and commands","")}${tier("Do not change","Project-owned capabilities","")}</div><div class="footer"><button>Back to project results</button><button class="primary">Run guided setup</button></div>`)}
];
const toc=document.querySelector("#toc");toc.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,"0")}</a>`).join("");
const numberNode=document.querySelector("#number"),titleNode=document.querySelector("#title"),mock=document.querySelector("#window"),commentNode=document.querySelector("#comment"),prevNode=document.querySelector("#prev"),nextNode=document.querySelector("#next"),themeNode=document.querySelector("#theme");
function render(){const n=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[n-1];numberNode.textContent=String(n).padStart(2,"0");titleNode.textContent=s.title;mock.innerHTML=s.body;commentNode.innerHTML=`<h4>${s.comment}</h4><ul>${s.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`;prevNode.href=`#s${Math.max(1,n-1)}`;prevNode.style.visibility=n===1?"hidden":"visible";nextNode.href=n===screens.length?"#s1":`#s${n+1}`;nextNode.textContent=n===screens.length?"Restart ↺":"Next →";[...toc.children].forEach((a,i)=>a.classList.toggle("active",i===n-1));}
addEventListener("hashchange",render);const themes=["auto","light","dark"];themeNode.onclick=()=>{const root=document.documentElement,n=themes[(themes.indexOf(root.dataset.theme)+1)%3];root.dataset.theme=n;themeNode.textContent=`Theme: ${n==="auto"?"system":n}`};render();
</script>
</body>
</html>
