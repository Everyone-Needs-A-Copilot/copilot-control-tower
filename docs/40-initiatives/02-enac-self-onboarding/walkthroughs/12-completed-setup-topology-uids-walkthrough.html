<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>12 · Completed setup topology — UI walkthrough</title>
  <style>
    :root{color-scheme:light dark;--canvas:#e9e9ec;--window:#fbfbfc;--card:#fff;--subtle:#f3f3f5;--text:#202024;--secondary:#68686f;--tertiary:#8d8d94;--separator:#d9d9dd;--blue:#0878ed;--green:#35a853;--orange:#d17b23;--shadow:0 30px 90px rgb(16 16 24/.18)}
    [data-theme=dark]{--canvas:#101012;--window:#1b1b1d;--card:#202023;--subtle:#27272b;--text:#f2f2f4;--secondary:#aaaab1;--tertiary:#7c7c84;--separator:#38383d;--blue:#0a84ff;--green:#55c96f;--orange:#f3a04b;--shadow:0 32px 100px rgb(0 0 0/.55)}
    @media(prefers-color-scheme:dark){html[data-theme=auto]{--canvas:#101012;--window:#1b1b1d;--card:#202023;--subtle:#27272b;--text:#f2f2f4;--secondary:#aaaab1;--tertiary:#7c7c84;--separator:#38383d;--blue:#0a84ff;--green:#55c96f;--orange:#f3a04b;--shadow:0 32px 100px rgb(0 0 0/.55)}}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--separator);background:color-mix(in srgb,var(--canvas) 90%,transparent);backdrop-filter:blur(18px)}header strong{white-space:nowrap}.toc{display:flex;gap:5px}.toc a,.theme{border:1px solid var(--separator);border-radius:7px;background:var(--card);color:var(--text);padding:6px 9px;text-decoration:none;font:inherit}.toc a.active{border-color:var(--blue);color:var(--blue)}.theme{margin-left:auto}
    main{width:min(1260px,calc(100% - 30px));margin:34px auto 70px}.intro{max-width:860px;margin-bottom:28px}.kicker,.eyebrow{font-size:11px;font-weight:760;letter-spacing:.08em;color:var(--blue)}h1{font-size:42px;line-height:1.03;letter-spacing:-.04em;margin:7px 0 11px}.intro p{font-size:17px;color:var(--secondary);margin:0}.head{display:flex;gap:10px;align-items:baseline;margin-bottom:13px}.head span{color:var(--tertiary);font:700 11px/1 ui-monospace,monospace}.head h2{font-size:22px;margin:0}
    .registers{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px;align-items:start}.window{overflow:hidden;min-height:700px;border:1px solid var(--separator);border-radius:20px;background:var(--window);box-shadow:var(--shadow)}.titlebar{height:54px;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid var(--separator);font-weight:680}.dot{width:13px;height:13px;border-radius:50%}.dot:nth-child(1){background:#ff5f57}.dot:nth-child(2){background:#febc2e}.dot:nth-child(3){background:#28c840}.titlebar span{margin-left:10px}
    .content{padding:34px 42px}.content h3{font-size:32px;letter-spacing:-.035em;margin:6px 0 8px}.lead{max-width:760px;color:var(--secondary);margin:0 0 22px}.banner,.section,.component,.category{border:1px solid var(--separator);border-radius:12px;background:var(--card)}.banner{padding:17px 18px;margin-bottom:18px;border-left:4px solid var(--blue)}.banner h4,.banner p{margin:0}.banner p{margin-top:5px;color:var(--secondary)}
    .section{padding:18px;margin-top:15px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h4{font-size:19px;margin:0}.stack{display:grid;gap:10px}.component{padding:14px 15px}.component-head,.tier,.category{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.component-head{align-items:center}.component-head strong{font-size:16px}.status{font-size:12px;font-weight:720;color:var(--secondary)}.status.ok{color:var(--green)}.status.warn{color:var(--orange)}
    .tiers{margin-top:11px;border-top:1px solid var(--separator)}.tier{padding:10px 0;border-bottom:1px solid var(--separator)}.tier:last-child{border-bottom:0;padding-bottom:0}.tier b{font-size:12px}.tier small{display:block;color:var(--secondary);margin-top:2px}.tier .status{text-align:right}.category{align-items:center;padding:13px 14px;background:var(--subtle);color:var(--text);text-decoration:none;transition:background .12s}.category:hover{background:color-mix(in srgb,var(--blue) 8%,var(--subtle))}.category strong,.category small{display:block}.category small{color:var(--secondary);margin-top:2px}.count{font-size:20px;font-weight:750}
    button{min-height:35px;border:1px solid var(--separator);border-radius:8px;background:var(--card);color:var(--text);padding:7px 12px;font:inherit}.primary{border-color:var(--blue);background:var(--blue);color:white;font-weight:660}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.comment{border-left:2px solid var(--blue);padding-left:15px}.comment h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}.comment li{color:var(--secondary)}.pager{display:flex;justify-content:space-between;margin-top:14px}.pager a{color:var(--blue);text-decoration:none}
    @media(max-width:920px){.registers{grid-template-columns:1fr}}@media(max-width:680px){.toc{display:none}.content{padding:24px}.content h3{font-size:28px}h1{font-size:34px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.category{transition:none}}
  </style>
</head>
<body>
<header><strong>Completed setup topology · UI</strong><nav class="toc" id="toc"></nav><button class="theme" id="theme">Theme: system</button></header>
<main>
  <div class="intro"><span class="kicker">UI WALKTHROUGH · IMPLEMENTATION FIDELITY</span><h1>A quiet, native map of what is actually ready.</h1><p>Stable four-tier geometry, earned status color, and the same project aftercare hierarchy used during setup.</p></div>
  <div class="head"><span id="number"></span><h2 id="title"></h2></div>
  <div class="registers"><div class="window" id="window" tabindex="-1"></div><aside class="comment" id="comment"></aside></div>
  <nav class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></nav>
</main>
<script>
const shell=body=>`<div class="titlebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>Copilot Control Tower</span></div><div class="content">${body}</div>`;
const tier=(name,state,detail,kind="")=>`<div class="tier"><div><b>${name}</b><small>${detail}</small></div><span class="status ${kind}">${state}</span></div>`;
const component=(name,state,kind,tiers)=>`<div class="component"><div class="component-head"><strong>${name}</strong><span class="status ${kind}">${state} ›</span></div>${tiers?`<div class="tiers">${tiers}</div>`:""}</div>`;
const category=(count,title,detail,to)=>`<a class="category" href="#s${to}"><div><strong>${title}</strong><small>${detail}</small></div><span class="count">${count} ›</span></a>`;
const screens=[
 {title:"Incomplete Personal setup is the first thing you see",comment:"Priority through scale",notes:["The incomplete headline outranks secondary sections.","Blue belongs to the one safe next action.","Orange is reserved for evidence-backed incompleteness."],body:shell(`<span class="eyebrow">YOUR SETUP</span><h3>Your copilots work, but Personal setup is incomplete</h3><p class="lead">Claude and Codex are ready to use. Knowledge Personal and CLI Personal still need setup.</p><div class="banner"><h4>2 of 4 Personal components are ready</h4><p>Finish them now or return here later. Nothing is created just by opening this window.</p><div class="footer"><button class="primary">Finish Personal Setup</button></div></div><div class="section"><div class="section-title"><h4>Your copilots</h4><span class="status warn">2 need setup</span></div><div class="stack">${component("Knowledge Copilot","Needs setup","warn","")}${component("CLI Copilot","Needs setup","warn","")}${component("Claude Copilot","Ready","ok","")}${component("Codex Copilot","Ready","ok","")}</div></div>`)},
 {title:"Expanded cards preserve a stable four-row rhythm",comment:"Topology is the component",notes:["Component cards use identical geometry.","Details wrap under the tier label.","Technical privacy language stays visually subordinate."],body:shell(`<span class="eyebrow">YOUR COPILOTS</span><h3>Knowledge Copilot</h3><p class="lead">See where this component comes from and which parts are active for you.</p><div class="section"><div class="stack">${component("Knowledge Copilot","Needs setup","warn",tier("Foundation","Ready","Core Knowledge Copilot setup","ok")+tier("Organization","Ready","Everyone Needs A Copilot","ok")+tier("Department","Not joined","No department layer is active")+tier("Personal","Needs setup","Stored in a private GitHub repository only you can access","warn"))}${component("CLI Copilot","Needs setup","warn","")}${component("Claude Copilot","Ready","ok","")}${component("Codex Copilot","Ready","ok","")}</div></div><div class="footer"><button class="primary">Finish Personal Setup</button></div>`)},
 {title:"Complete setup becomes quiet, not celebratory",comment:"Earned green",notes:["Green appears only on helper-proven Ready states.","No oversized success illustration competes with the information.","Department remains visible as an optional tier."],body:shell(`<span class="eyebrow">YOUR SETUP</span><h3>Your ecosystem is ready</h3><p class="lead">Knowledge, CLI, Claude, and Codex have their Foundation, Organization, and Personal setup. You can join a department whenever one is available.</p><div class="section"><div class="section-title"><h4>Your copilots</h4><span class="status ok">4 ready</span></div><div class="stack">${component("Knowledge Copilot","Ready","ok","")}${component("CLI Copilot","Ready","ok","")}${component("Claude Copilot","Ready","ok","")}${component("Codex Copilot","Ready","ok","")}</div></div><div class="section"><div class="section-title"><h4>Your connections</h4><span class="status ok">Ready</span></div><p class="lead">GitHub · Signed in as pablitoalejo.</p></div>`)},
 {title:"Project categories replace the massive report",comment:"Scannable aftercare",notes:["Cards match the setup classification hierarchy.","Counts align for rapid comparison.","The continue-later promise remains adjacent to the work."],body:shell(`<span class="eyebrow">YOUR PROJECTS</span><h3>53 projects found</h3><p class="lead">17 are ready. 17 need guided setup. Control Tower couldn’t confirm 19.</p><div class="stack">${category(17,"Ready","No action needed",5)}${category(17,"Need guided setup","A coding assistant can complete these",5)}${category(19,"Couldn’t confirm","Review the exact evidence",5)}</div><div class="banner" style="margin-top:15px"><h4>Come back whenever you want</h4><p>Finish one or two projects now, or return later. Every unfinished route remains available here.</p></div>`)},
 {title:"The destination is visually identical to Step 7",comment:"No design drift",notes:["Action-first guidance keeps the reviewed hierarchy.","Evidence rows use the existing setup geometry.","The primary action launches a visible assistant session."],body:shell(`<span class="eyebrow">NEEDS GUIDED SETUP</span><h3>admin-server needs a coding assistant</h3><p class="lead">This is the same project detail used during setup. Control Tower will preserve the project’s instructions while the missing connections are added.</p><div class="banner"><h4>What happens next</h4><p>Run the reviewed plan in Codex or Claude Code. Control Tower verifies the result independently afterward.</p><div class="footer"><button class="primary">Run guided setup</button></div></div><div class="section">${tier("Detected","1 instruction · 16 agents · 14 commands","")}${tier("Required","Claude marker and Codex integration","")}${tier("Preserve","CLAUDE.md, agents, and commands","")}${tier("Do not change","Project-owned capabilities","")}</div><div class="footer"><button>Back to project results</button><button class="primary">Run guided setup</button></div>`)}
];
const toc=document.querySelector("#toc");toc.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,"0")}</a>`).join("");
const numberNode=document.querySelector("#number"),titleNode=document.querySelector("#title"),mock=document.querySelector("#window"),commentNode=document.querySelector("#comment"),prevNode=document.querySelector("#prev"),nextNode=document.querySelector("#next"),themeNode=document.querySelector("#theme");
function render(){const n=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[n-1];numberNode.textContent=String(n).padStart(2,"0");titleNode.textContent=s.title;mock.innerHTML=s.body;commentNode.innerHTML=`<h4>${s.comment}</h4><ul>${s.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`;prevNode.href=`#s${Math.max(1,n-1)}`;prevNode.style.visibility=n===1?"hidden":"visible";nextNode.href=n===screens.length?"#s1":`#s${n+1}`;nextNode.textContent=n===screens.length?"Restart ↺":"Next →";[...toc.children].forEach((a,i)=>a.classList.toggle("active",i===n-1));}
addEventListener("hashchange",render);const themes=["auto","light","dark"];themeNode.onclick=()=>{const root=document.documentElement,n=themes[(themes.indexOf(root.dataset.theme)+1)%3];root.dataset.theme=n;themeNode.textContent=`Theme: ${n==="auto"?"system":n}`};render();
</script>
</body>
</html>
