<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>19 · Default project batch — UX walkthrough</title>
  <style>
    :root{color-scheme:light dark;--bg:#f1f2f4;--paper:#fff;--ink:#202126;--muted:#656872;--line:#d8dae0;--blue:#0874e8;--soft:#eaf3ff;--green:#2f8a4c;--warn:#a76109}
    @media(prefers-color-scheme:dark){:root{--bg:#111214;--paper:#222328;--ink:#f1f2f4;--muted:#afb2ba;--line:#3a3c42;--blue:#5aa2ff;--soft:#172b44;--green:#68c981;--warn:#e2ae5c}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:12px 18px;background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}header nav{display:flex;gap:6px}header a{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);text-decoration:none}main{width:min(1080px,calc(100% - 28px));margin:38px auto 70px}.intro{max-width:760px}.kicker{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{font-size:42px;line-height:1.05;letter-spacing:-.035em;margin:8px 0 12px}.intro p{font-size:18px;color:var(--muted)}.screen{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:22px;margin-top:38px}.frame{min-height:610px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 26px 80px rgb(0 0 0/16%)}.bar{padding:15px 22px;border-bottom:1px solid var(--line);font-weight:700}.content{padding:34px 42px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.content h2{font-size:30px;line-height:1.12;letter-spacing:-.025em;margin:8px 0}.lead{color:var(--muted);max-width:610px}.batch{margin:24px 0 14px;padding:18px;border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));border-radius:13px;background:var(--soft)}.batch label{display:flex;gap:12px;align-items:flex-start;font-weight:750;font-size:17px}.batch input,.row input{width:19px;height:19px;accent-color:var(--blue)}.counts{display:grid;grid-template-columns:1fr 1fr;gap:11px}.count{padding:16px;border:1px solid var(--line);border-radius:12px}.count b{display:block;font-size:26px}.count span,.quiet{color:var(--muted)}.quiet{padding:10px 2px}.quiet.ok strong{color:var(--green)}.quiet.warn strong{color:var(--warn)}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.actions button,.links button{font:inherit;padding:8px 13px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:var(--paper)}.actions .primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:750}.links{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.links a{color:var(--blue)}.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:flex;gap:11px;align-items:center;padding:13px 15px}.row+.row{border-top:1px solid var(--line)}.row span{margin-left:auto;color:var(--muted);font-size:13px}.note{border-left:2px solid var(--blue);padding-left:16px}.note h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.note li{color:var(--muted);margin-bottom:9px}.pager{display:flex;justify-content:space-between;margin-top:18px}.pager a{color:var(--blue);text-decoration:none}@media(max-width:820px){.screen{grid-template-columns:1fr}.note{order:-1}}@media(max-width:620px){.content{padding:26px}.counts{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column-reverse;gap:10px}.actions button{width:100%}}
  </style>
</head>
<body>
<header><strong>Default project batch · UX</strong><nav id="nav" aria-label="Walkthrough screens"></nav></header>
<main>
  <div class="intro"><span class="kicker">UX walkthrough · task 241</span><h1>One safe batch, already selected.</h1><p>The person sees only the work Control Tower can safely do now. Ready projects recede; exceptions stay protected; individual choice remains one step away.</p></div>
  <div class="screen"><section class="frame" id="frame" tabindex="-1"></section><aside class="note" id="note"></aside></div>
  <div class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></div>
</main>
<script>
const shell=body=>`<div class="bar">Set Up Copilot Control Tower</div><div class="content">${body}</div>`;
const screens=[
 {title:'The default answers the common case',notes:['Every safe actionable project starts selected.','Two counts explain the batch without exposing taxonomy.','Ready and needs-review projects are acknowledged, not listed.'],body:shell(`<span class="eyebrow">Your projects</span><h2>Set up and fix your projects</h2><p class="lead">47 projects can be handled safely. They are all selected.</p><div class="batch"><label><input type="checkbox" checked><span>Set up and fix all 47 projects<br><small class="quiet">Every project gets Claude Copilot and Codex Copilot.</small></span></label></div><div class="counts"><div class="count"><b>31</b><strong>New setup</strong><br><span>Set up from the ground up</span></div><div class="count"><b>16</b><strong>Needs correction</strong><br><span>Bring existing setup up to date</span></div></div><p class="quiet ok"><strong>✓ 12 projects are already set up.</strong> Nothing else is needed.</p><p class="quiet warn"><strong>6 projects need someone to review them.</strong> They will not be changed.</p><div class="actions"><button>Check again</button><button class="primary">Review changes for 47 projects</button></div>`)},
 {title:'Individual choice is an escape hatch',notes:['Only Python-approved projects appear.','One checkbox controls the whole project.','Select all and Select none make narrowing quick.'],body:shell(`<span class="eyebrow">Your projects</span><h2>Choose projects individually</h2><p class="lead">47 projects can be handled safely. Each selected project receives both copilots.</p><div class="links"><a href="#s1">← Do all 47</a><span><button>Select none</button> <button>Select all</button></span></div><div class="list"><label class="row"><input type="checkbox" checked><strong>admin-server</strong><span>New setup</span></label><label class="row"><input type="checkbox" checked><strong>convoco</strong><span>Needs correction</span></label><label class="row"><input type="checkbox" checked><strong>knowledge-copilot</strong><span>Needs correction</span></label><label class="row"><input type="checkbox" checked><strong>method-copilot</strong><span>New setup</span></label></div><p class="quiet">47 projects selected</p><div class="actions"><button>Check again</button><button class="primary">Review changes for 47 projects</button></div>`)},
 {title:'A prerequisite is one useful sentence',notes:['“Machine readiness” disappears.','Repeated credential-store actions collapse into one helper-authored instruction.','The safe batch remains visible while the action is unavailable.'],body:shell(`<span class="eyebrow">Before projects can be updated</span><h2>Reconnect this Mac to your organization</h2><p class="lead">Control Tower found 47 safe project updates, but it cannot start them until the organization connection is restored.</p><div class="batch" style="border-color:var(--warn);background:transparent"><strong>Restore the organization credential-store connection, then check again.</strong></div><div class="counts"><div class="count"><b>31</b><strong>New setup</strong></div><div class="count"><b>16</b><strong>Needs correction</strong></div></div><p class="quiet">All 47 safe projects will remain selected after the next check.</p><div class="actions"><button>Back</button><button class="primary">Check again</button></div>`)},
 {title:'Nothing to do becomes a quiet receipt',notes:['Healthy inventory does not become a 65-row report.','The screen gives confidence and moves on.','A fresh check remains available without dominating.'],body:shell(`<span class="eyebrow">Your projects</span><h2>All 65 projects are already set up</h2><p class="lead">Claude Copilot and Codex Copilot passed the latest check. Nothing needs to change.</p><p class="quiet ok"><strong>✓ This Mac has what it needs.</strong></p><div class="actions"><button>Check again</button><button class="primary">Continue setup</button></div>`)}
];
nav.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');
function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];frame.innerHTML=s.body;note.innerHTML=`<h3>${String(i).padStart(2,'0')} · ${s.title}</h3><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';frame.focus({preventScroll:true})}addEventListener('hashchange',render);render();
</script>
</body>
</html>
