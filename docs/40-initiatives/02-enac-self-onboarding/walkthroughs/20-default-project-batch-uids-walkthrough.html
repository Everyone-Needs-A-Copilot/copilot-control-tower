  <title>20 · Default project batch — UI walkthrough</title>
  <style>
    :root{color-scheme:light dark;--canvas:#e9eaed;--window:#fbfbfc;--rail:#f1f2f4;--card:#fff;--soft:#f4f5f7;--ink:#202126;--muted:#6b6e76;--line:#d7d9de;--blue:#0a71e8;--blue-soft:#eaf3ff;--green:#31894d;--amber:#a66a11;--shadow:0 30px 90px rgb(20 23 31/20%)}
    [data-theme="dark"]{--canvas:#101113;--window:#1a1b1e;--rail:#17181b;--card:#222328;--soft:#292b30;--ink:#f1f2f4;--muted:#afb2b9;--line:#3a3c42;--blue:#5aa2ff;--blue-soft:#172b44;--green:#68c981;--amber:#e2ae5c;--shadow:0 30px 100px rgb(0 0 0/55%)}
    @media(prefers-color-scheme:dark){html[data-theme="auto"]{--canvas:#101113;--window:#1a1b1e;--rail:#17181b;--card:#222328;--soft:#292b30;--ink:#f1f2f4;--muted:#afb2b9;--line:#3a3c42;--blue:#5aa2ff;--blue-soft:#172b44;--green:#68c981;--amber:#e2ae5c;--shadow:0 30px 100px rgb(0 0 0/55%)}}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(18px)}header a,.theme{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:6px 9px;text-decoration:none}.theme{margin-left:auto}main{width:min(1210px,calc(100% - 30px));margin:32px auto 72px}.intro{max-width:820px}.kicker,.eyebrow{color:var(--blue);font-size:11px;font-weight:780;letter-spacing:.09em;text-transform:uppercase}h1{font-size:42px;line-height:1.04;letter-spacing:-.035em;margin:7px 0 11px}.intro p{font-size:17px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:21px;margin-top:30px}.window{min-height:650px;border:1px solid var(--line);border-radius:22px;background:var(--window);box-shadow:var(--shadow);overflow:hidden}.titlebar{height:52px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);font-weight:700}.dots{color:#ff5f57;letter-spacing:6px;margin-right:20px}.app{display:grid;grid-template-columns:250px 1fr;min-height:598px}.rail{background:var(--rail);border-right:1px solid var(--line);padding:24px 14px}.brand{font-size:17px;font-weight:750;margin:0 12px 24px}.stage{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:9px 12px;border-radius:10px;color:var(--muted)}.stage.done b{color:var(--green)}.stage.current{background:var(--blue-soft);color:var(--ink);font-weight:700}.stage.current b{color:var(--blue)}.content{display:flex;flex-direction:column;min-width:0;padding:34px 42px}.content h2{font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:7px 0 8px}.lead{color:var(--muted);margin:0 0 18px}.batch{padding:17px;border:1px solid color-mix(in srgb,var(--blue) 46%,var(--line));border-radius:12px;background:var(--blue-soft);margin-bottom:12px}.batch label{display:flex;gap:12px;align-items:flex-start;font-size:16px;font-weight:750}.batch input,.row input{width:18px;height:18px;accent-color:var(--blue)}.batch small,.metric small,.row small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--card)}.metric b{font-size:25px;display:block}.ack{padding:10px 2px;color:var(--muted)}.ack.ok strong{color:var(--green)}.ack.warn strong{color:var(--amber)}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:18px}button{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:7px 12px;font:inherit}.primary{border-color:var(--blue);background:var(--blue);color:white;font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.toolbar a{color:var(--blue)}.list{border:1px solid var(--line);border-radius:11px;background:var(--card);overflow:hidden}.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}.row+.row{border-top:1px solid var(--line)}.pill{font-size:12px;color:var(--muted);background:var(--soft);padding:4px 7px;border-radius:7px}.note{border-left:2px solid var(--blue);padding-left:15px}.note h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em}.note li{color:var(--muted);margin-bottom:8px}.pager{display:flex;justify-content:space-between;margin-top:12px}.pager a{color:var(--blue);text-decoration:none}@media(max-width:900px){.layout{grid-template-columns:1fr}}@media(max-width:700px){.app{grid-template-columns:1fr}.rail{display:none}.content{padding:26px}.metrics{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body><header><strong>Default project batch · UI</strong><nav id="nav"></nav><button id="theme" class="theme">Theme: system</button></header><main><div class="intro"><span class="kicker">UI walkthrough · task 241</span><h1>The batch is the interface.</h1><p>Native controls, quiet acknowledgements, and one earned accent replace the old census, component matrix, and repeated machine warnings.</p></div><div class="layout"><section class="window" id="mock" tabindex="-1"></section><aside class="note" id="note"></aside></div><div class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></div></main>
<script>
const rail=`<aside class="rail"><div class="brand">Set Up Copilot Control Tower</div>${['✓ Welcome','✓ Connect GitHub','✓ Detect',"✓ What you're getting",'✓ Departments','✓ Your connections','● Your projects','○ Set up','○ Verify'].map((x,i)=>`<div class="stage ${i<6?'done':''} ${i===6?'current':''}"><b>${x[0]}</b><span>${x.slice(2)}</span></div>`).join('')}</aside>`;
const shell=body=>`<div class="titlebar"><span class="dots">● ● ●</span>Set Up Copilot Control Tower</div><div class="app">${rail}<section class="content">${body}</section></div>`;
const screens=[
 {t:'Wide default state',n:['The batch card contains the only project-selection control.','Count cards explain rather than navigate.','Ready and exception inventory use compact acknowledgement rows.'],b:shell(`<span class="eyebrow">Step 7 of 9</span><h2>Set up and fix your projects</h2><p class="lead">47 projects can be handled safely. They are all selected.</p><div class="batch"><label><input type="checkbox" checked><span>Set up and fix all 47 projects<small>Every project gets Claude Copilot and Codex Copilot.</small></span></label></div><div class="metrics"><div class="metric"><b>31</b><strong>New setup</strong><small>Set up from the ground up</small></div><div class="metric"><b>16</b><strong>Needs correction</strong><small>Bring existing setup up to date</small></div></div><div class="ack ok"><strong>✓ 12 projects are already set up.</strong> Nothing else is needed.</div><div class="ack warn"><strong>6 projects need someone to review them.</strong> They will not be changed.</div><div class="footer"><button>Choose projects individually</button><button class="primary">Review changes for 47 projects</button></div>`)},
 {t:'Individual selection state',n:['The list replaces the batch body in place.','Category pills are textual and neutral.','There is no component logo, switch, or recipe chooser.'],b:shell(`<span class="eyebrow">Step 7 of 9</span><h2>Choose projects individually</h2><p class="lead">Each selected project gets Claude Copilot and Codex Copilot.</p><div class="toolbar"><a href="#s1">← Do all 47</a><span><button>Select none</button> <button>Select all</button></span></div><div class="list"><label class="row"><input type="checkbox" checked><span><strong>admin-server</strong></span><span class="pill">New setup</span></label><label class="row"><input type="checkbox" checked><span><strong>convoco</strong></span><span class="pill">Needs correction</span></label><label class="row"><input type="checkbox" checked><span><strong>knowledge-copilot</strong></span><span class="pill">Needs correction</span></label><label class="row"><input type="checkbox" checked><span><strong>method-copilot</strong></span><span class="pill">New setup</span></label></div><div class="ack">47 projects selected</div><div class="footer"><button>Check again</button><button class="primary">Review changes for 47 projects</button></div>`)},
 {t:'Compact state',n:['Summary cards stack without losing order.','Footer controls remain full-sized and clear.','No horizontal project matrix appears at narrow width.'],b:`<div style="width:600px;max-width:100%;margin:auto">${shell(`<span class="eyebrow">Step 7 of 9</span><h2>Set up and fix your projects</h2><p class="lead">47 projects can be handled safely. They are all selected.</p><div class="batch"><label><input type="checkbox" checked><span>Set up and fix all 47 projects<small>Claude Copilot and Codex Copilot are included.</small></span></label></div><div class="metrics"><div class="metric"><b>31</b><strong>New setup</strong></div><div class="metric"><b>16</b><strong>Needs correction</strong></div></div><div class="ack ok"><strong>✓ 12 already set up</strong></div><div class="footer"><button>Choose individually</button><button class="primary">Review 47 projects</button></div>`)}</div>`}
];
nav.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];mock.innerHTML=s.b;note.innerHTML=`<h3>${String(i).padStart(2,'0')} · ${s.t}</h3><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';mock.focus({preventScroll:true})}addEventListener('hashchange',render);const themes=['auto','light','dark'];theme.addEventListener('click',()=>{const n=themes[(themes.indexOf(document.documentElement.dataset.theme)+1)%themes.length];document.documentElement.dataset.theme=n;theme.textContent=`Theme: ${n==='auto'?'system':n}`});render();
</script></body></html>
