<body>
  <header><strong>Step 7 project triage · UX</strong><nav class="toc" id="toc" aria-label="Walkthrough screens"></nav><button class="theme" id="theme">Theme: system</button></header>
  <main>
    <div class="intro"><span class="kicker">UX WALKTHROUGH · OWNER REVIEW</span><h1>Turn 53 project results into three understandable routes.</h1><p>One focused category at a time, visible guided work, exact verification evidence, and a truthful way to continue setup.</p></div>
    <div class="screen-head"><span id="screenNumber">01</span><h2 id="screenTitle"></h2></div>
    <div class="registers">
      <div class="window" id="mockWindow" tabindex="-1" aria-live="polite"></div>
      <aside class="comment" id="commentary"></aside>
    </div>
    <nav class="pager" aria-label="Previous and next walkthrough screens"><a id="prev" href="#s1">← Previous</a><a id="next" href="#s2">Next →</a></nav>
  </main>
  <script>
    const rail=(active="Your projects")=>`<aside class="side"><h3>Set Up Control Tower</h3>${["Welcome","Connect GitHub","Detect","What you're getting","Departments","Your connections","Your projects","Set up","Verify"].map((x,i)=>`<div class="navrow ${x===active?"current":i<6||active==="Your projects"&&i<6?"done":""}"><b>${i<6?"✓":x===active?"●":"○"}</b><span>${x}</span></div>`).join("")}</aside>`;
    const shell=(body,title="Set Up Copilot Control Tower",active="Your projects")=>`<div class="titlebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>${title}</span></div><div class="app">${rail(active)}<div class="detail">${body}</div></div>`;
    const footer=(left="",right="")=>`<div class="footer"><div>${left}</div><div class="footer-right">${right}</div></div>`;
    const screens=[
      {
        title:"Checking only the folders the person selected",
        comment:"Trust starts before the count",
        notes:["Name the folder being inspected.","Show useful progress without streaming technical filenames.","The person can leave this screen; inspection continues safely."],
        body:shell(`<span class="eyebrow">STEP 7 OF 9</span><h3>Checking your projects…</h3><p class="lead">Looking inside <span class="strong">Sites</span>. Control Tower will not inspect anywhere else on this Mac.</p><div class="card inset"><div class="tracker done"><b>✓</b><div><strong>Folder connected</strong><div class="page-note">/Volumes/Dev/Sites</div></div></div><div class="tracker"><b>●</b><div><strong>Checking Claude and Codex setup</strong><div class="page-note">42 of 53 projects checked</div></div></div><div class="tracker"><b>○</b><div><strong>Preparing the results</strong></div></div></div>${footer(`<button class="plain">Back</button>`,`<button>Continue in background</button>`)}`)
      },
      {
        title:"The default view is a triage hub, not a 53-row report",
        comment:"Three outcomes, each with meaning",
        notes:["The sentence is readable without decoding dots or taxonomy.","Zero-count classifications are hidden.","Selecting a card replaces the register beneath it."],
        body:shell(`<span class="eyebrow">STEP 7 OF 9</span><h3>53 projects found</h3><p class="lead"><span class="strong">17 are ready.</span> 17 need guided setup. Control Tower couldn’t confirm 19.</p><div class="status-grid"><a class="status-card" href="#s12"><span class="count">17</span><strong>Ready</strong><small>No action needed</small></a><a class="status-card selected" href="#s3"><span class="count">17</span><strong>Need guided setup</strong><small>A coding assistant can complete these</small></a><a class="status-card" href="#s10"><span class="count">19</span><strong>Couldn’t confirm</strong><small>Review exactly what could not be proven</small></a></div><div class="card inset callout"><b class="glyph route">i</b><div><strong>You do not need to finish every project now</strong><p>Continue setting up Control Tower and return to project setup later.</p></div></div>${footer(`<button class="plain">Back</button>`,`<button>How this is classified</button><button class="primary" data-go="16">Continue setup</button>`)}`)
      },
      {
        title:"A focused guided list explains why each project needs help",
        comment:"One category, six rows at a time",
        notes:["The category definition appears before the list.","Rows use project-specific reasons.","Search and pagination replace the continuous 53-row page."],
        body:shell(`<span class="eyebrow">17 PROJECTS</span><h3>Needs guided setup</h3><p class="lead">These projects have their own instructions or tools. A coding assistant can add the missing connection while preserving what is already there.</p><div class="toolbar"><button data-go="2">‹ All project results</button><div class="search" role="search">Search these 17 projects</div></div><div class="card"><div class="row"><b class="glyph route">→</b><div><strong>admin-server</strong><small>Needs a Claude connection and Codex project setup</small></div><button class="primary" data-go="4">Review setup</button></div><div class="row"><b class="glyph route">→</b><div><strong>cli-copilot</strong><small>Project-owned instructions need to be connected safely</small></div><button>Review setup</button></div><div class="row"><b class="glyph route">→</b><div><strong>preflight-copilot</strong><small>24 agents and 8 skills require a guided integration</small></div><button>Review setup</button></div><div class="row"><b class="glyph route">→</b><div><strong>research-copilot</strong><small>Claude and Codex customizations need reconciliation</small></div><button>Review setup</button></div></div><div class="toolbar page-note"><span>Showing 1–4 of 17</span><span><button disabled class="disabled">Previous</button> <button>Next</button></span></div>${footer("",`<button class="primary" data-go="16">Continue setup</button>`)}`)
      },
      {
        title:"Guided detail leads with what the person should do",
        comment:"Keep the useful evidence; change its framing",
        notes:["The current Detected/Required/Preserve structure survives.","A next-step panel turns information into instruction.","Safety constraints are legible without becoming an alarm."],
        body:shell(`<span class="eyebrow">NEEDS GUIDED SETUP</span><h3>admin-server needs a coding assistant</h3><p class="lead">This project has its own Claude instructions and tools. Control Tower will preserve them while the missing Claude and Codex connections are added.</p><div class="card next"><strong>What happens next</strong><p class="lead">Review what was found, then run the guided setup in Codex or Claude Code. Control Tower will verify the project independently afterward.</p><button class="primary" data-go="5">Run guided setup</button></div><div class="card"><div class="facts"><b>Detected</b><span>1 instruction · 16 agents · 14 commands</span></div><div class="facts"><b>Required</b><span>Add a valid Claude MCP marker and the missing Codex project integration</span></div><div class="facts"><b>Preserve</b><span>CLAUDE.md, project agents, and project commands</span></div><div class="facts"><b>Do not change</b><span>Project-owned instructions or capabilities; do not flatten the project model</span></div></div><div class="actions"><button>Show full guided prompt</button><button>Show technical evidence</button></div>${footer(`<button data-go="3">Back to guided projects</button>`,`<button class="primary" data-go="5">Run guided setup</button>`)}`)
      },
      {
        title:"The primary action chooses an installed assistant",
        comment:"A destination, not a dead button",
        notes:["The user knows a Terminal window will open before committing.","The project path and preservation promise remain visible.","Copy is recovery, not the main path."],
        body:shell(`<span class="eyebrow">RUN GUIDED SETUP</span><h3>Choose where to run it</h3><p class="lead">Control Tower will open a visible Terminal session in <span class="strong">admin-server</span>, start the assistant with the reviewed prompt, and verify the result when it finishes.</p><div class="card"><div class="row"><b class="glyph route">C</b><div><strong>Codex</strong><small>Installed and ready · Recommended for this project</small></div><button class="primary" data-go="6">Run in Codex</button></div><div class="row"><b class="glyph route">A</b><div><strong>Claude Code</strong><small>Installed and ready</small></div><button data-go="6">Run in Claude Code</button></div><div class="row"><b class="glyph">⌘</b><div><strong>Copy the guided prompt</strong><small>Use it in another supported project session</small></div><button>Copy prompt</button></div></div><div class="card inset callout"><b class="glyph route">i</b><div><strong>Nothing changes until the assistant begins</strong><p>The session must preserve every project-owned path named in the plan.</p></div></div>${footer(`<button data-go="4">Back</button>`,"")}`)
      },
      {
        title:"Guided work is visible while Control Tower keeps status",
        comment:"Observable, not hidden",
        notes:["Terminal is the auditable work surface.","Control Tower shows launch state without pretending to know assistant progress.","Only process lifecycle and later CLI verification advance the state."],
        body:shell(`<span class="eyebrow">GUIDED SETUP RUNNING</span><h3>Codex is working in admin-server</h3><p class="lead">The guided session is open in Terminal. You can watch it there or keep working here.</p><div class="evidence"><div class="terminal mono"><p>Project  admin-server</p><p>Assistant  Codex</p><p>Plan  Project integration contract 1</p><p class="live">● Guided session running…</p><p>Preserving project-owned instructions and capabilities.</p></div><div class="card inset"><div class="tracker done"><b>✓</b><div><strong>Terminal opened</strong></div></div><div class="tracker done"><b>✓</b><div><strong>Guided prompt delivered</strong></div></div><div class="tracker"><b>●</b><div><strong>Session running</strong><div class="page-note">Control Tower is waiting for it to end</div></div></div><div class="tracker"><b>○</b><div><strong>Independent verification</strong></div></div><button>Bring Terminal forward</button></div></div>${footer(`<button class="plain">Stop watching</button>`,`<button data-go="8">Preview session finished</button>`)}`)
      },
      {
        title:"Launch failure names the problem and preserves the route",
        comment:"Failure without a dead end",
        notes:["Nothing changed is stated explicitly.","The other installed assistant remains available.","The prompt survives even when launch does not."],
        body:shell(`<span class="eyebrow">COULDN’T START CODEX</span><h3>The Terminal session did not open</h3><p class="lead">Control Tower could not find the installed Codex command. <span class="strong">Nothing changed in admin-server.</span></p><div class="card next"><div class="callout"><b class="glyph bad">!</b><div><strong>Codex command not available</strong><p>The expected command was not found in the Terminal environment.</p></div></div></div><div class="card"><div class="row"><b class="glyph route">A</b><div><strong>Run the same plan in Claude Code</strong><small>Claude Code is installed and ready</small></div><button class="primary" data-go="6">Run in Claude Code</button></div><div class="row"><b class="glyph">⌘</b><div><strong>Copy the guided prompt</strong><small>The complete preservation and verification instructions are retained</small></div><button>Copy prompt</button></div></div>${footer(`<button data-go="5">Back</button>`,`<button>Retry Codex</button>`)}`)
      },
      {
        title:"The helper—not the assistant—decides whether work succeeded",
        comment:"Independent verification is the trust boundary",
        notes:["Verification starts after the visible session ends.","The assistant’s success message is never treated as proof.","The person can leave while the helper checks."],
        body:shell(`<span class="eyebrow">VERIFYING PROJECT</span><h3>Checking admin-server independently…</h3><p class="lead">Codex finished its session. Control Tower is now asking the setup helper to verify Claude, Codex, and the preserved project capabilities.</p><div class="card inset"><div class="tracker done"><b>✓</b><div><strong>Guided session ended</strong><div class="page-note">Codex reported completion</div></div></div><div class="tracker"><b>●</b><div><strong>Authoritative project check running</strong><div class="page-note">Assistant self-report is not proof of readiness</div></div></div><div class="tracker"><b>○</b><div><strong>Update project result</strong></div></div></div><div class="card callout"><b class="glyph route">i</b><div><strong>You can continue setting up Control Tower</strong><p>The result will remain available in Your projects.</p></div></div>${footer("",`<button class="primary" data-go="9">Preview result</button>`)}`)
      },
      {
        title:"Every verification outcome says what happens next",
        comment:"Success and recovery share one grammar",
        notes:["Ready is conclusive and quiet.","A partial result names only what remains.","Owner and uncertainty routes never masquerade as success."],
        body:shell(`<span class="eyebrow">PROJECT CHECK COMPLETE</span><h3>admin-server is ready</h3><p class="lead">Claude and Codex both passed verification. The project’s instructions, 16 agents, and 14 commands were preserved.</p><div class="status-grid"><div class="status-card selected"><span class="count">✓</span><strong>Ready</strong><small>Nothing else is needed</small></div><div class="status-card"><span class="count">1</span><strong>If something remains</strong><small>Show only the unresolved requirement</small></div><div class="status-card"><span class="count">↗</span><strong>If an owner must decide</strong><small>Prepare the exact handoff</small></div></div><div class="card inset"><div class="facts"><b>Claude</b><span>Ready</span></div><div class="facts"><b>Codex</b><span>Ready</span></div><div class="facts"><b>Preserved</b><span>CLAUDE.md · .claude/agents · .claude/commands</span></div></div>${footer(`<button data-go="3">Back to guided projects</button>`,`<button class="primary" data-go="16">Continue setup</button>`)}`)
      },
      {
        title:"Couldn’t-confirm projects get their own focused register",
        comment:"Uncertainty becomes inspectable",
        notes:["Each row previews the actual component-level reason.","The primary action is Review evidence, not Verify again.","The category explanation says setup was found."],
        body:shell(`<span class="eyebrow">19 PROJECTS</span><h3>Control Tower couldn’t confirm these</h3><p class="lead">Setup was found, but the helper could not prove that it matches the current Claude and Codex integration contract. Nothing has been changed.</p><div class="toolbar"><button data-go="2">‹ All project results</button><div class="search">Search these 19 projects</div></div><div class="card"><div class="row"><b class="glyph">?</b><div><strong>convoco</strong><small>Claude entry not recognized · Codex config and skill bridge mismatch</small></div><button class="primary" data-go="11">Review evidence</button></div><div class="row"><b class="glyph">?</b><div><strong>copilot-control-tower</strong><small>Claude needs guided setup · Codex project link could not be confirmed</small></div><button>Review evidence</button></div><div class="row"><b class="glyph">?</b><div><strong>pipeline-copilot</strong><small>Current proof could not be matched</small></div><button>Review evidence</button></div></div><div class="toolbar page-note"><span>Showing 1–3 of 19</span><span><button disabled class="disabled">Previous</button> <button>Next</button></span></div>${footer("",`<button class="primary" data-go="16">Continue setup</button>`)}`)
      },
      {
        title:"Exact evidence replaces the generic couldn't-verify sentence",
        comment:"The false-negative experience becomes actionable",
        notes:["Real read-only helper evidence grounds this screen.","Plain language comes before paths and contract identifiers.","Diagnosis is read-only until the helper can produce a safe route."],
        body:shell(`<span class="eyebrow">COULDN’T CONFIRM</span><h3>convoco has setup, but it does not match the current proof</h3><p class="lead">Control Tower found 2 instructions, 16 agents, 1 skill, and 9 commands. It could not prove that the Claude and Codex connections are current. <span class="strong">Nothing was changed.</span></p><div class="evidence"><div class="card"><div class="card-title">Claude</div><strong>The project entry was not recognized</strong><ul><li>CLAUDE.md does not expose the expected Claude Copilot entry.</li></ul></div><div class="card"><div class="card-title">Codex</div><strong>The project plugin proof does not match</strong><ul><li>Two framework files differ from the expected variant.</li><li>The Codex config does not name the local plugin.</li><li>The skill bridge points outside that plugin.</li></ul></div></div><div class="card next"><strong>Recommended next step</strong><p class="lead">Start a read-only diagnostic session. The assistant can explain the mismatch, but it cannot change project files until the helper returns a reviewed setup plan.</p><div class="actions"><button class="primary">Diagnose in Codex</button><button>Diagnose in Claude Code</button></div></div><div class="actions"><button>Show technical evidence</button><button>Copy diagnostic report</button><button class="disabled" disabled>Check again</button><span class="page-note">Use after the project setup changes</span></div>${footer(`<button data-go="10">Back to couldn’t confirm</button>`,"")}`)
      },
      {
        title:"Ready projects are reassuring and optional to inspect",
        comment:"Make success easy to see and easy to leave",
        notes:["Ready is collapsed by default on the overview.","The focused list explains that no action is needed.","Detail shows the two authoritative results without internal helper language."],
        body:shell(`<span class="eyebrow">17 PROJECTS</span><h3>Ready</h3><p class="lead">Claude and Codex passed authoritative verification for these projects. Nothing else is needed.</p><div class="toolbar"><button data-go="2">‹ All project results</button><div class="search">Search these 17 projects</div></div><div class="card"><div class="row"><b class="glyph ok">✓</b><div><strong>BM</strong><small>2 instructions · 16 agents · verified just now</small></div><button>View details</button></div><div class="row"><b class="glyph ok">✓</b><div><strong>knowledge-copilot</strong><small>2 instructions · 16 agents · verified just now</small></div><button>View details</button></div><div class="row"><b class="glyph ok">✓</b><div><strong>runway</strong><small>2 instructions · 16 agents · 1 skill · verified just now</small></div><button>View details</button></div></div><div class="card inset"><div class="card-title">BM</div><div class="facts"><b>Claude</b><span>Ready</span></div><div class="facts"><b>Codex</b><span>Ready</span></div><div class="facts"><b>Project setup</b><span>Preserved and verified</span></div></div>${footer("",`<button class="primary" data-go="16">Continue setup</button>`)}`)
      },
      {
        title:"An owner decision names the person and the decision",
        comment:"Zero today, explicit when present",
        notes:["This category stays hidden while its count is zero.","The handoff contains a decision, not a generic request to review.","The project remains incomplete and unchanged."],
        body:shell(`<span class="eyebrow">NEEDS PROJECT OWNER</span><h3>research-copilot needs one decision</h3><p class="lead">The project’s Claude instructions define a research-review route that overlaps with the shared route. Control Tower cannot choose which behavior should take precedence.</p><div class="card next"><strong>Decision needed</strong><p class="lead">Should project research review run before or after the shared Copilot review?</p></div><div class="card"><div class="facts"><b>Owner</b><span>Project author</span></div><div class="facts"><b>Preserved</b><span>Both instruction sets remain unchanged</span></div><div class="facts"><b>Resume</b><span>Guided setup can continue after the owner decides</span></div></div>${footer(`<button>Do this later</button>`,`<button>Copy owner handoff</button><button class="primary">Prepare handoff</button>`)}`)
      },
      {
        title:"A changed project invalidates the old plan honestly",
        comment:"No stale action survives changed evidence",
        notes:["The reason is stated without Git jargon.","No old prompt can be launched.","Inspect again is the only primary route."],
        body:shell(`<span class="eyebrow">PROJECT CHANGED</span><h3>admin-server needs a fresh inspection</h3><p class="lead">The project setup changed after this guided plan was created. Control Tower will not run instructions based on old evidence.</p><div class="card inset callout"><b class="glyph">↻</b><div><strong>The previous plan is no longer available</strong><p>No files were changed by Control Tower. Inspect the project again to produce a current route.</p></div></div><div class="card"><div class="facts"><b>Previous check</b><span>Claude and Codex setup inspected</span></div><div class="facts"><b>Current state</b><span>Project capability changed since that inspection</span></div></div>${footer(`<button>Return to projects</button>`,`<button class="primary">Inspect again</button>`)}`)
      },
      {
        title:"An empty folder explains what was checked",
        comment:"No projects is not a broken state",
        notes:["The selected folder is named.","The person can choose another folder or continue setup.","There is no invitation to broaden filesystem access silently."],
        body:shell(`<span class="eyebrow">STEP 7 OF 9</span><h3>No projects found in this folder</h3><p class="lead">Control Tower checked <span class="strong">Design Work</span> and did not find project folders with Claude or Codex setup.</p><div class="card inset"><div class="callout"><b class="glyph">○</b><div><strong>Only this folder was checked</strong><p>/Users/pablo/Design Work</p></div></div></div>${footer(`<button>Choose another folder</button>`,`<button class="primary" data-go="16">Continue setup</button>`)}`)

      {
        title:"Continuing setup preserves every unfinished project route",
        comment:"Finish onboarding without abandoning projects",
        notes:["The primary CTA no longer says Continue without projects.","The updated count reflects completed work.","Project aftercare remains available from Control Tower."],
        body:shell(`<span class="eyebrow">STEP 7 OF 9</span><h3>Your project results are saved</h3><p class="lead"><span class="strong">18 are ready.</span> 16 still need guided setup. Control Tower couldn’t confirm 19.</p><div class="status-grid"><a class="status-card" href="#s12"><span class="count">18</span><strong>Ready</strong><small>No action needed</small></a><a class="status-card" href="#s3"><span class="count">16</span><strong>Need guided setup</strong><small>Review here or later</small></a><a class="status-card" href="#s10"><span class="count">19</span><strong>Couldn’t confirm</strong><small>Evidence and diagnosis are saved</small></a></div><div class="card inset callout"><b class="glyph ok">✓</b><div><strong>You can return from Control Tower at any time</strong><p>Continuing does not discard project plans, evidence, or diagnostic reports.</p></div></div>${footer(`<button data-go="2">Review projects</button>`,`<button class="primary">Continue setup</button>`)}`)
      }
    ];
    const toc=document.querySelector("#toc");
    toc.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}" aria-label="Screen ${i+1}">${String(i+1).padStart(2,"0")}</a>`).join("");
    const render=()=>{
      const n=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),screen=screens[n-1];
      document.querySelector("#screenNumber").textContent=String(n).padStart(2,"0");
      document.querySelector("#screenTitle").textContent=screen.title;
      document.querySelector("#mockWindow").innerHTML=screen.body;
      document.querySelector("#commentary").innerHTML=`<h4>${screen.comment}</h4><ul>${screen.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`;
      document.querySelector("#prev").href=`#s${Math.max(1,n-1)}`;
      document.querySelector("#prev").style.visibility=n===1?"hidden":"visible";
      document.querySelector("#next").href=`#s${Math.min(screens.length,n+1)}`;
      document.querySelector("#next").textContent=n===screens.length?"Restart ↺":"Next →";
      if(n===screens.length)document.querySelector("#next").href="#s1";
      [...toc.children].forEach((a,i)=>a.classList.toggle("active",i===n-1));
      document.querySelector("#mockWindow").focus({preventScroll:true});
    };
    addEventListener("hashchange",render);
    document.addEventListener("click",e=>{const go=e.target.closest("[data-go]");if(go)location.hash=`s${go.dataset.go}`});
    const root=document.documentElement,themeButton=document.querySelector("#theme"),themes=["auto","light","dark"];
    themeButton.addEventListener("click",()=>{const next=themes[(themes.indexOf(root.dataset.theme)+1)%themes.length];root.dataset.theme=next;themeButton.textContent=`Theme: ${next==="auto"?"system":next}`});
    render();
  </script>
