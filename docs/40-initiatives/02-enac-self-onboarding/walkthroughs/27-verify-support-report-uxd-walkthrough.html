<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>27 · Verify support report — UX walkthrough</title>
<style>
:root{color-scheme:light dark;--bg:#f2f3f5;--paper:#fff;--ink:#202126;--muted:#666a72;--line:#d8dbe0;--blue:#0874e8;--soft:#f4f5f7;--warn:#a76109}html[data-theme=dark]{--bg:#111214;--paper:#242529;--ink:#f2f3f5;--muted:#b2b5bc;--line:#3b3d43;--blue:#62a7ff;--soft:#2a2b2f;--warn:#e3ad58}@media(prefers-color-scheme:dark){html[data-theme=auto]{--bg:#111214;--paper:#242529;--ink:#f2f3f5;--muted:#b2b5bc;--line:#3b3d43;--blue:#62a7ff;--soft:#2a2b2f;--warn:#e3ad58}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:11px 18px;background:var(--bg);border-bottom:1px solid var(--line)}nav{display:flex;gap:5px}a,button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 9px;text-decoration:none}#theme{margin-left:auto}main{width:min(1080px,calc(100% - 28px));margin:34px auto}.intro{max-width:800px}.kicker,.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}h1{font-size:40px;line-height:1.05;margin:7px 0}.intro p,.lead,small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:28px}.window{min-height:650px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}.bar{padding:15px 22px;border-bottom:1px solid var(--line);font-weight:700}.content{padding:30px 38px}.content h2{font-size:29px;line-height:1.12;margin:7px 0}.caption{margin:14px 0;color:var(--muted);font-size:13px}.disclosure,.card{margin:16px 0;padding:15px;border:1px solid var(--line);border-radius:11px}.report{white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:8px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:22px}.group{display:flex;gap:8px}.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}.note{border-left:2px solid var(--blue);padding-left:15px}.note h3{font-size:12px;text-transform:uppercase}.note li{color:var(--muted);margin-bottom:8px}.warn{color:var(--warn)}.pager{display:flex;justify-content:space-between;margin-top:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}.actions{flex-direction:column-reverse}.group{display:grid}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head>
<body><header><strong>Verify support report · UX</strong><nav id="nav"></nav><button id="theme">Theme: system</button></header><main><div class="intro"><span class="kicker">UX walkthrough · Verify recovery</span><h1>One useful, private report for the next conversation.</h1><p>The normal screen stays calm. Technical evidence is preserved, redacted, copyable, and revealable only when setup cannot be confirmed.</p></div><div class="grid"><section class="window" id="frame" tabindex="-1" aria-live="polite"></section><aside class="note" id="note"></aside></div><div class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></div></main>
<script>
const shell=b=>`<div class="bar">Set Up Copilot Control Tower</div><div class="content">${b}</div>`;
const report=`Copilot Control Tower 0.6.6 (33)\nSetup helper: cc 2.9.2\nRecorded: 2026-08-06 13:10 -0400\n\nInitial check\nResult: update available\nReport format: 1.0\nNeeds attention: Knowledge Copilot · Core setup · update available\nNeeds attention: CLI Copilot · Core setup · update available\nNeeds attention: Claude Copilot · Core setup · update available\nNeeds attention: Codex Copilot · Core setup · update available\n\nUpdate attempt\nResult: applied\nChanged: 4 · Held: 0 · Blocked: 0\n\nFresh check\nResult: update available\n\nPrivacy\nOmits names, paths, repository addresses, file content, process output, and secrets.`;
const screens=[
{t:'The holding state names the limit, not machinery',n:['The final CLI verdict remains the only source of status.','The repeat line describes the result, not unproven filesystem change.','Technical evidence stays collapsed.'],b:shell(`<span class="eyebrow">Setup paused</span><h2>I couldn't confirm everything's current</h2><p class="lead">An update is ready.</p><p class="caption">The latest check reached the same result.</p><div class="disclosure"><strong>› Support report</strong><br><small>A redacted report was saved for whoever helps with this Mac.</small></div><div class="actions"><button>Continue in the menu bar</button><button class="primary">Try again</button></div>`)},
{t:'Expanding reveals useful, bounded evidence',n:['The preview contains the sequence: first check, update receipt, fresh check.','No host, username, absolute path, repo, content, stdout, stderr, or secret is present.','The saved location uses a tilde path.'],b:shell(`<span class="eyebrow">Setup paused</span><h2>I couldn't confirm everything's current</h2><p class="lead">An update is ready.</p><div class="disclosure"><strong>⌄ Support report</strong><p><small>Copy this into a Claude Code, Codex, or support conversation. It omits names, paths, project content, process output, and secrets.</small></p><div class="report">${report}</div><p><small>Saved at ~/.claude/cc/diagnostics/control-tower/verify-….txt</small></p><div class="group"><button>Show in Finder</button><button>Copy support report</button></div></div><div class="actions"><button>Continue in the menu bar</button><button class="primary">Try again</button></div>`)},
{t:'Copy gives immediate, in-place confirmation',n:['Clipboard and saved file contain the same bytes.','Focus remains on the button.','The confirmation expires without a toast.'],b:shell(`<span class="eyebrow">Setup paused</span><h2>I couldn't confirm everything's current</h2><p class="lead">An update is ready.</p><div class="disclosure"><strong>⌄ Support report</strong><div class="report">${report}</div><p><small>Saved at ~/.claude/cc/diagnostics/control-tower/verify-….txt</small></p><div class="group"><button>Show in Finder</button><button class="primary">Copied</button></div></div><div class="actions"><button>Continue in the menu bar</button><button>Try again</button></div>`)},
{t:'Saving can fail without losing the conversation path',n:['The app does not repair or bypass an unsafe diagnostic directory.','The in-memory redacted report remains selectable and copyable.','Reveal disappears because no file is claimed.'],b:shell(`<span class="eyebrow">Setup paused</span><h2>I couldn't confirm everything's current</h2><p class="lead">An update is ready.</p><div class="disclosure"><strong>⌄ Support report</strong><p class="warn">I couldn't save the report on this Mac. You can still copy it below.</p><div class="report">${report}</div><div class="group"><button class="primary">Copy support report</button></div></div><div class="actions"><button>Continue in the menu bar</button><button>Try again</button></div>`)}
];
nav.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];frame.innerHTML=s.b;note.innerHTML=`<h3>${String(i).padStart(2,'0')} · ${s.t}</h3><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';frame.focus({preventScroll:true})}addEventListener('hashchange',render);const ts=['auto','light','dark'];theme.onclick=()=>{let n=ts[(ts.indexOf(document.documentElement.dataset.theme)+1)%3];document.documentElement.dataset.theme=n;theme.textContent=`Theme: ${n==='auto'?'system':n}`};render();
</script></body></html>
