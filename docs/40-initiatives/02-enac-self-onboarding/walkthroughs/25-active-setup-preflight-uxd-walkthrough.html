<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>25 · Active setup preflight — UX walkthrough</title><style>

</style></head><body><header><strong>Active setup preflight · UX</strong><nav id="nav"></nav><button id="theme">Theme: system</button></header><main><div class="intro"><span class="kicker">UX walkthrough · Task 255</span><h1>Do the routine work before asking the person.</h1><p>Setup saves eligible project work locally, downloads proven-safe shared updates, and then presents only the decisions that remain.</p></div><div class="grid"><section class="window" id="frame" tabindex="-1" aria-live="polite"></section><aside class="note" id="note"></aside></div><div class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></div></main><script>
const shell=b=>`<div class="bar">Set Up Copilot Control Tower</div><div class="content">${b}</div>`;
const screens=[
{t:'Preparation begins automatically',n:['No passive warning appears first.','The three operations are ordered and CLI-owned.','The copy promises no push, not no mutation.'],b:shell(`<span class="eyebrow">Preparing your projects</span><h2>Getting your projects ready</h2><p class="lead">I’m saving current project work locally, downloading the latest shared Copilot setup, and then checking what remains. Nothing is pushed.</p><div class="card soft"><div class="row"><b>✓</b><div><strong>Saving current project work</strong><br><small>Normal local commits; repository rules stay active.</small></div><span class="good">Done</span></div><div class="row"><b>…</b><div><strong>Updating shared Copilot setup</strong><br><small>Clean, verified fast-forwards only.</small></div><span>Working…</span></div><div class="row"><b>3</b><div><strong>Checking every project</strong></div><span>Waiting</span></div></div>`)},
{t:'Completed work leads',n:['Every count comes from the mutation ledger.','Zero-count actions are omitted.','The old “nothing can be handled” headline is gone.'],b:shell(`<span class="eyebrow">Preparation complete</span><h2>The routine work is done</h2><p class="lead">I saved work in 12 projects and downloaded 4 Copilot updates.</p><div class="card"><div class="row"><b class="good">34</b><div><strong>Already set up</strong><br><small>Nothing else is needed.</small></div><span>Ready</span></div><div class="row"><b>12</b><div><strong>Can be handled now</strong><br><small>Your work was saved before this fresh check.</small></div><span>Included</span></div><div class="row"><b class="warn">2</b><div><strong>Need your decision</strong><br><small>I left their setup unchanged.</small></div><span>Review</span></div></div><div class="actions"><button>See what I saved</button><button class="primary">Review the remaining projects</button></div>`)},
{t:'A failed checkpoint is specific and preservative',n:['Successful commits remain in the receipt.','A normal Git policy failure is never bypassed.','The project content stays intact.'],b:shell(`<span class="eyebrow">Preparation needs you</span><h2>I saved the work Git allowed me to save</h2><p class="lead">Eleven projects were saved locally. One project could not make a normal commit, so I left its files unchanged.</p><div class="card"><div class="row"><b class="warn">!</b><div><strong>research-copilot</strong><br><small>Its repository check did not accept the commit. Resolve that repository’s named check, then try again.</small></div><span>Unchanged</span></div></div><div class="actions"><button>Copy details</button><button class="primary">Check again</button></div>`)},
{t:'Shared repositories remain pull-only here',n:['Ecosystem repositories are never part of project checkpointing.','Unknown permission fails closed to read-only.','Even an author-capable account gets no implicit publish action.'],b:shell(`<span class="eyebrow">Shared setup preserved</span><h2>I found edits in shared Copilot setup</h2><p class="lead">I left that repository alone. Shared Copilot setup is download-only here.</p><div class="card"><div class="row"><b class="warn">!</b><div><strong>Organization setup</strong><br><small>An authorized maintainer needs to review its local changes before updates can continue.</small></div><span>Unchanged</span></div><div class="row"><b>↓</b><div><strong>Other shared setup</strong><br><small>Clean repositories received verified downloads.</small></div><span class="good">Current</span></div></div><div class="actions"><button>Copy details</button><button class="primary">Check again</button></div>`)},
{t:'Nothing needed is quiet and proven',n:['No invented receipt appears for a zero-work run.','Read-only is stated in ordinary language.','Fresh assessment unlocks continuation.'],b:shell(`<span class="eyebrow">Preparation complete</span><h2>Your projects and shared Copilot setup are current</h2><p class="lead">The fresh check found no routine work to do. Shared Copilot setup remains download-only here.</p><div class="card"><div class="row"><b class="good">48</b><div><strong>Projects ready</strong></div><span>Current</span></div><div class="row"><b class="good">16</b><div><strong>Shared setup sources</strong></div><span>Current</span></div></div><div class="actions"><button>Check again</button><button class="primary">Continue setup</button></div>`)}
];
nav.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];frame.innerHTML=s.b;note.innerHTML=`<h3>${String(i).padStart(2,'0')} · ${s.t}</h3><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';frame.focus({preventScroll:true})}addEventListener('hashchange',render);const ts=['auto','light','dark'];theme.onclick=()=>{let n=ts[(ts.indexOf(document.documentElement.dataset.theme)+1)%3];document.documentElement.dataset.theme=n;theme.textContent=`Theme: ${n==='auto'?'system':n}`};render();
