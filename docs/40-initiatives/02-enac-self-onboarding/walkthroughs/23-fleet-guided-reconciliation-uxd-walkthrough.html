<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>23 · Fleet-guided reconciliation — UX walkthrough</title>
<style>
:root{color-scheme:light dark;--bg:#f2f3f5;--paper:#fff;--ink:#202126;--muted:#666a72;--line:#d8dbe0;--blue:#0874e8;--soft:#edf5ff;--warn:#a76109;--good:#2f8a4c}html[data-theme=dark]{--bg:#111214;--paper:#242529;--ink:#f2f3f5;--muted:#b2b5bc;--line:#3b3d43;--blue:#62a7ff;--soft:#172b44;--warn:#e3ad58;--good:#70cc87}@media(prefers-color-scheme:dark){html[data-theme=auto]{--bg:#111214;--paper:#242529;--ink:#f2f3f5;--muted:#b2b5bc;--line:#3b3d43;--blue:#62a7ff;--soft:#172b44;--warn:#e3ad58;--good:#70cc87}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:11px 18px;background:var(--bg);border-bottom:1px solid var(--line)}nav{display:flex;gap:5px}a,button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 9px;text-decoration:none}#theme{margin-left:auto}main{width:min(1080px,calc(100% - 28px));margin:34px auto}.intro{max-width:760px}.kicker,.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}h1{font-size:40px;line-height:1.05;margin:7px 0}.intro p,.lead,small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:28px}.window{min-height:570px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}.bar{padding:15px 22px;border-bottom:1px solid var(--line);font-weight:700}.content{padding:30px 38px}.content h2{font-size:29px;line-height:1.12;margin:7px 0}.card{margin:16px 0;padding:15px;border:1px solid var(--line);border-radius:11px}.card.soft{background:var(--soft)}.row{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:10px 0}.row+.row{border-top:1px solid var(--line)}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:22px}.group{display:flex;gap:8px}.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}.note{border-left:2px solid var(--blue);padding-left:15px}.note h3{font-size:12px;text-transform:uppercase}.note li{color:var(--muted);margin-bottom:8px}.good{color:var(--good)}.warn{color:var(--warn)}.pager{display:flex;justify-content:space-between;margin-top:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}.actions{flex-direction:column-reverse}.group{display:grid}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body><header><strong>Fleet-guided setup · UX</strong><nav id="nav"></nav><button id="theme">Theme: system</button></header><main><div class="intro"><span class="kicker">UX walkthrough · Phase 9.3</span><h1>One work order. One conversation. Independent proof.</h1><p>The person starts once at Sites, asks questions in one assistant session, and returns to Python-authored project truth.</p></div><div class="grid"><section class="window" id="frame" tabindex="-1" aria-live="polite"></section><aside class="note" id="note"></aside></div><div class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></div></main>
<script>
const shell=b=>`<div class="bar">Set Up Copilot Control Tower</div><div class="content">${b}</div>`;
const screens=[
{t:'One root-level handoff',n:['No project-by-project routing appears.','Both assistants receive the same Python-authored package.','The user chooses a conversation, not an implementation recipe.'],b:shell(`<span class="eyebrow">Step 7 of 9</span><h2>Finish your projects in one guided session</h2><p class="lead">Control Tower will write one set of instructions for this folder and open it in the assistant you choose.</p><div class="card soft"><div class="row"><b>22</b><div><strong>22 selected product projects</strong><br><small>One conversation will work through the complete list.</small></div><span>Included</span></div><div class="row"><b>16</b><div><strong>Copilot setup repositories</strong><br><small>Managed separately and excluded from project changes.</small></div><span>Separate</span></div></div><div class="actions"><button>Choose projects</button><div class="group"><button>Finish with Claude Code</button><button class="primary">Finish with Codex</button></div></div>`)},
{t:'The package exists before Terminal',n:['The durable file is the source of continuity.','No project success claim is made during preparation.','Copy is a fallback, not the primary path.'],b:shell(`<span class="eyebrow">Writing the guide</span><h2>Preparing one set of project instructions</h2><p class="lead">Nothing has been counted as complete yet.</p><div class="card"><div class="row"><b>1</b><div><strong>Instruction file</strong><br><small>What to inspect, preserve, change, and verify.</small></div><span>Writing</span></div><div class="row"><b>22</b><div><strong>Project records</strong><br><small>Exact paths and Python-authored evidence.</small></div><span>Included</span></div></div><div class="actions"><button>Back</button><div class="group"><button>Copy instructions</button><button class="primary" disabled>Opening Terminal…</button></div></div>`)},
{t:'One visible working conversation',n:['The user can bring the same Terminal forward at any point.','Verified counts come only from helper checks.','No percentage or ETA is invented.'],b:shell(`<span class="eyebrow">Guided setup is open</span><h2>Your guided setup is open in Terminal</h2><p class="lead">Ask questions there while the assistant works through every selected project.</p><div class="card"><div class="row"><b class="good">7</b><div><strong>Passed a fresh check</strong><br><small>Python verified the selected Claude and Codex setup.</small></div><span>Verified</span></div><div class="row"><b>15</b><div><strong>Still in the work order</strong><br><small>The assistant can inspect and continue in the same conversation.</small></div><span>Remaining</span></div></div><div class="actions"><button>Open instruction file</button><div class="group"><button>Copy instructions</button><button class="primary">Bring Terminal forward</button></div></div>`)},
{t:'A question stays in the same session',n:['Control Tower does not duplicate the conversation.','Attention names ownership without calling it an app failure.','The helper still refuses to infer completion.'],b:shell(`<span class="eyebrow">Conversation needed</span><h2>Two projects need your answer in Terminal</h2><p class="lead">The assistant found choices that belong to the project owner. Continue in the same conversation.</p><div class="card"><div class="row"><b class="warn">2</b><div><strong>Waiting for your answer</strong><br><small>No decision was made on your behalf.</small></div><span>In Terminal</span></div><div class="row"><b class="good">18</b><div><strong>Passed a fresh check</strong></div><span>Verified</span></div></div><div class="actions"><button>Leave for later</button><button class="primary">Bring Terminal forward</button></div>`)},
{t:'Completion is independently earned',n:['The assistant cannot create this state.','A remaining run reuses the same package.','Setup advances only on fresh evidence.'],b:shell(`<span class="eyebrow">Fresh check complete</span><h2>Every selected project passed</h2><p class="lead">Python independently checked all 22 projects after the guided session.</p><div class="card"><div class="row"><b class="good">22</b><div><strong>Ready</strong><br><small>The exact selected components passed current verification.</small></div><span>Verified</span></div><div class="row"><b>0</b><div><strong>Remaining</strong></div><span>None</span></div></div><div class="actions"><button>Open instruction file</button><button class="primary">Continue setup</button></div>`) }
];
nav.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];frame.innerHTML=s.b;note.innerHTML=`<h3>${String(i).padStart(2,'0')} · ${s.t}</h3><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';frame.focus({preventScroll:true})}addEventListener('hashchange',render);const ts=['auto','light','dark'];theme.onclick=()=>{let n=ts[(ts.indexOf(document.documentElement.dataset.theme)+1)%3];document.documentElement.dataset.theme=n;theme.textContent=`Theme: ${n==='auto'?'system':n}`};render();
</script></body></html>
