<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>23 · User-controlled project handoff — UX walkthrough</title>
<style>
:root{color-scheme:light dark;--bg:#f2f3f5;--paper:#fff;--ink:#202126;--muted:#666a72;--line:#d8dbe0;--blue:#0874e8;--soft:#f4f5f7;--warn:#a76109;--good:#2f8a4c}html[data-theme=dark]{--bg:#111214;--paper:#242529;--ink:#f2f3f5;--muted:#b2b5bc;--line:#3b3d43;--blue:#62a7ff;--soft:#2a2b2f;--warn:#e3ad58;--good:#70cc87}@media(prefers-color-scheme:dark){html[data-theme=auto]{--bg:#111214;--paper:#242529;--ink:#f2f3f5;--muted:#b2b5bc;--line:#3b3d43;--blue:#62a7ff;--soft:#2a2b2f;--warn:#e3ad58;--good:#70cc87}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:11px 18px;background:var(--bg);border-bottom:1px solid var(--line)}nav{display:flex;gap:5px}a,button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 9px;text-decoration:none}#theme{margin-left:auto}main{width:min(1080px,calc(100% - 28px));margin:34px auto}.intro{max-width:780px}.kicker,.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}h1{font-size:40px;line-height:1.05;margin:7px 0}.intro p,.lead,small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:28px}.window{min-height:620px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}.bar{padding:15px 22px;border-bottom:1px solid var(--line);font-weight:700}.content{padding:30px 38px}.content h2{font-size:29px;line-height:1.12;margin:7px 0}.card{margin:16px 0;padding:15px;border:1px solid var(--line);border-radius:11px}.card.soft,.prompt{background:var(--soft)}.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0}.row+.row{border-top:1px solid var(--line)}.steps{counter-reset:s}.step{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:8px 0}.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:23px;height:23px;border:1px solid var(--line);border-radius:50%;font-size:12px;font-weight:700}.prompt{padding:12px;border-radius:8px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:22px}.group{display:flex;gap:8px}.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}.note{border-left:2px solid var(--blue);padding-left:15px}.note h3{font-size:12px;text-transform:uppercase}.note li{color:var(--muted);margin-bottom:8px}.good{color:var(--good)}.warn{color:var(--warn)}.pager{display:flex;justify-content:space-between;margin-top:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}.actions{flex-direction:column-reverse}.group{display:grid}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head>
<body><header><strong>Project handoff · UX</strong><nav id="nav"></nav><button id="theme">Theme: system</button></header><main><div class="intro"><span class="kicker">UX walkthrough · Phase 9.4</span><h1>Prepare the work. Hand over control. Verify afterward.</h1><p>Control Tower opens an ordinary Terminal at Sites and explains the handoff. The person starts Claude Code or Codex and owns the conversation.</p></div><div class="grid"><section class="window" id="frame" tabindex="-1" aria-live="polite"></section><aside class="note" id="note"></aside></div><div class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></div></main>
<script>
const shell=b=>`<div class="bar">Set Up Copilot Control Tower</div><div class="content">${b}</div>`;
const screens=[
{t:'One batch, no assistant choice yet',n:['The first action prepares files and opens a folder.','No assistant executable is detected or launched.','Ecosystem repositories remain separate.'],b:shell(`<span class="eyebrow">Step 7 of 9</span><h2>Prepare one set of project instructions</h2><p class="lead">Control Tower will write one work-order file for every selected project and open Terminal at your Sites folder. It will not start Claude Code or Codex.</p><div class="card"><div class="row"><b>22</b><div><strong>Selected product projects</strong><br><small>One Sites-root conversation can work through the complete list.</small></div><span>Included</span></div><div class="row"><b>16</b><div><strong>Copilot setup repositories</strong><br><small>Managed separately and excluded from project changes.</small></div><span>Separate</span></div></div><div class="actions"><button>Choose projects</button><button class="primary">Prepare instructions and open Terminal</button></div>`)},
{t:'The only spinner belongs to file preparation',n:['The app names the deterministic work it is doing.','No project or assistant progress is implied.','The state ends as soon as Python returns the package.'],b:shell(`<span class="eyebrow">Preparing instructions</span><h2>Writing your project work order</h2><p class="lead">Python is writing the selected project list, preservation rules, and verification steps. Nothing is running in an assistant.</p><div class="card soft"><div class="row"><b>…</b><div><strong>Creating the files</strong><br><small>No project has been counted as finished.</small></div><span>Preparing</span></div></div>`)},
{t:'A clear, user-controlled handoff',n:['Terminal is idle at Sites.','The person starts either assistant themselves.','A short prompt points to the durable file instead of inlining it.'],b:shell(`<span class="eyebrow">Instructions ready</span><h2>Your project instructions are ready</h2><p class="lead">Terminal is open at your Sites folder. You choose which assistant to start and you control the conversation.</p><div class="card"><div class="step"><div><strong>Start an assistant in Terminal</strong><br><small>Type <code>codex</code> or <code>claude</code> and press Return.</small></div></div><div class="step"><div><strong>Copy the prompt below</strong></div></div><div class="step"><div><strong>Paste it into the assistant and send it</strong></div></div><div class="step"><div><strong>Keep talking there until the work is finished</strong><br><small>Ask questions and answer anything that needs your decision.</small></div></div></div><small><strong>Prompt to paste into Claude Code or Codex</strong></small><div class="prompt">Read and follow every instruction in …/INSTRUCTIONS.md. Work through every listed project in this one conversation…</div><div class="actions"><button>Open instruction file</button><div class="group"><button>Show Terminal</button><button class="primary">Copy prompt</button></div></div>`)},
{t:'Terminal failure does not become assistant failure',n:['The prepared files remain useful.','The app names only what it knows: Terminal did not open.','Manual recovery keeps the same root and prompt.'],b:shell(`<span class="eyebrow">Instructions ready</span><h2>Terminal did not open</h2><p class="lead">Your files are ready. Open Terminal yourself at the Sites folder, then follow the same four steps.</p><div class="card"><div class="row"><b class="warn">!</b><div><strong>Open this folder in Terminal</strong><br><small>/Volumes/Dev/Sites</small></div><span>Needed</span></div></div><div class="prompt">Read and follow every instruction in …/INSTRUCTIONS.md…</div><div class="actions"><button>Open instruction file</button><div class="group"><button>Try opening Terminal again</button><button class="primary">Copy prompt</button></div></div>`)},
{t:'Verification happens only when requested',n:['No spinner persists while the assistant is running.','The person chooses when to check.','Remaining work reuses the same conversation and prompt.'],b:shell(`<span class="eyebrow">Fresh check complete</span><h2>Some projects still need work</h2><p class="lead">The fresh check found 3 projects that are not ready yet. Continue the same conversation with the same prompt.</p><div class="card"><div class="row"><b class="good">19</b><div><strong>Passed a fresh check</strong></div><span>Verified</span></div><div class="row"><b class="warn">3</b><div><strong>Still need work</strong><br><small>Python's current reasons appear in the project list.</small></div><span>Continue</span></div></div><div class="actions"><button>Open instruction file</button><div class="group"><button>Check again</button><button class="primary">Copy prompt</button></div></div>`)},
{t:'Completion is independently earned',n:['The assistant cannot create this state.','Green appears only after current Python evidence.','The next setup step is now available.'],b:shell(`<span class="eyebrow">Fresh check complete</span><h2>Every selected project passed</h2><p class="lead">Python independently checked all 22 projects after your conversation.</p><div class="card"><div class="row"><b class="good">22</b><div><strong>Ready</strong><br><small>The exact selected Claude and Codex setup passed current verification.</small></div><span>Verified</span></div><div class="row"><b>0</b><div><strong>Remaining</strong></div><span>None</span></div></div><div class="actions"><button>Open instruction file</button><button class="primary">Continue setup</button></div>`) }
];
nav.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];frame.innerHTML=s.b;note.innerHTML=`<h3>${String(i).padStart(2,'0')} · ${s.t}</h3><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';frame.focus({preventScroll:true})}addEventListener('hashchange',render);const ts=['auto','light','dark'];theme.onclick=()=>{let n=ts[(ts.indexOf(document.documentElement.dataset.theme)+1)%3];document.documentElement.dataset.theme=n;theme.textContent=`Theme: ${n==='auto'?'system':n}`};render();
</script></body></html>
