<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">

  <title>22 · Resolve with Claude Code — UI walkthrough</title>
  <style>
    :root{color-scheme:light dark;--canvas:#e9eaed;--window:#fbfbfc;--rail:#f1f2f4;--card:#fff;--well:#f4f5f7;--ink:#202126;--muted:#666970;--faint:#777a82;--line:#d7d9de;--accent:#0a71e8;--accent-soft:#eaf3ff;--ready:#267944;--attention:#9a5d08;--blocked:#af2f2f;--shadow:0 30px 90px rgb(20 23 31/20%)}
    [data-theme="dark"]{--canvas:#101113;--window:#1a1b1e;--rail:#17181b;--card:#222328;--well:#292b30;--ink:#f1f2f4;--muted:#b5b8c0;--faint:#a2a5ad;--line:#3a3c42;--accent:#5aa2ff;--accent-soft:#172b44;--ready:#68c981;--attention:#e2ae5c;--blocked:#ff7770;--shadow:0 30px 100px rgb(0 0 0/55%)}
    @media(prefers-color-scheme:dark){html[data-theme="auto"]{--canvas:#101113;--window:#1a1b1e;--rail:#17181b;--card:#222328;--well:#292b30;--ink:#f1f2f4;--muted:#b5b8c0;--faint:#a2a5ad;--line:#3a3c42;--accent:#5aa2ff;--accent-soft:#172b44;--ready:#68c981;--attention:#e2ae5c;--blocked:#ff7770;--shadow:0 30px 100px rgb(0 0 0/55%)}}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}header{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:9px;padding:11px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(18px)}header nav{display:flex;gap:4px;flex-wrap:wrap}header a,.theme{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:5px 8px;text-decoration:none}.theme{font:inherit;margin-left:auto}main{width:min(1240px,calc(100% - 30px));margin:30px auto 72px}.intro{max-width:820px}.kicker,.eyebrow{color:var(--accent);font-size:11px;font-weight:780;letter-spacing:.09em;text-transform:uppercase}h1{font-size:42px;line-height:1.04;letter-spacing:-.035em;margin:7px 0 11px}.intro p{font-size:17px;color:var(--muted)}.registers{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:21px;margin-top:28px}.window{min-height:690px;border:1px solid var(--line);border-radius:22px;background:var(--window);box-shadow:var(--shadow);overflow:hidden}.titlebar{height:52px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);font-weight:700}.dots{color:#ff5f57;letter-spacing:6px;margin-right:20px}.app{display:grid;grid-template-columns:246px 1fr;min-height:638px}.rail{background:var(--rail);border-right:1px solid var(--line);padding:22px 14px}.brand{font-size:16px;font-weight:750;margin:0 12px 22px}.road{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 11px;border-radius:9px;color:var(--muted)}.road.done b{color:var(--ready)}.road.current{background:var(--accent-soft);color:var(--ink);font-weight:700}.road.current b{color:var(--accent)}.content{display:flex;flex-direction:column;min-width:0;padding:30px 38px}.content h2{font-size:28px;line-height:1.1;letter-spacing:-.025em;margin:6px 0 8px}.lead{color:var(--muted);margin:0 0 15px;max-width:650px}.card{padding:15px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--ink) 4%,var(--card));margin-bottom:12px}.card.well{background:var(--well)}.card.action{border-color:color-mix(in srgb,var(--accent) 48%,var(--line));background:var(--accent-soft)}.card.attention{border-left:3px solid var(--attention)}.card.blocked{border-left:3px solid var(--blocked)}.card h3{font-size:15px;margin:0 0 5px}.batch{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start}.batch .number{font-size:27px;font-weight:750}.small,small{display:block;color:var(--muted);margin-top:3px}.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:16px}.group{display:flex;gap:8px;align-items:center}button{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:7px 12px;font:inherit}.primary{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:720}.plain{border-color:transparent;background:transparent;color:var(--accent)}button:disabled{opacity:.5}.status{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:9px;align-items:start;padding:10px 0}.status+.status{border-top:1px solid var(--line)}.status .symbol{width:22px;text-align:center;font-size:16px}.status .value{font-size:12px;color:var(--muted);font-weight:650}.status.actionable .symbol,.status.actionable .value{color:var(--accent)}.status.attn .symbol,.status.attn .value{color:var(--attention)}.status.good .symbol,.status.good .value{color:var(--ready)}.status.bad .symbol,.status.bad .value{color:var(--blocked)}.steps .status{grid-template-columns:24px minmax(0,1fr)}.decision{padding:14px;border:1px solid var(--line);border-left:3px solid var(--attention);border-radius:10px;background:var(--card)}.choices{display:grid;gap:7px;margin:11px 0}.choice{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--window)}.plan{display:grid;grid-template-columns:1fr 1fr;gap:9px}.plan .card{margin:0}.plan h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.plan ul{margin:6px 0 0;padding-left:18px}.plan li{margin-bottom:5px}.note{border-left:2px solid var(--accent);padding-left:15px}.note h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em}.note li{color:var(--muted);margin-bottom:8px}.tokens{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.token{padding:9px;border:1px solid var(--line);border-radius:8px;text-align:center}.pager{display:flex;justify-content:space-between;margin-top:12px}.pager a{color:var(--accent);text-decoration:none}@media(max-width:930px){.registers{grid-template-columns:1fr}}@media(max-width:720px){.app{grid-template-columns:1fr}.rail{display:none}.content{padding:24px}.plan{grid-template-columns:1fr}.footer{align-items:stretch;flex-direction:column-reverse}.footer .group{display:grid}.footer button{width:100%}.tokens{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<header><strong>Resolve with Claude Code · UI</strong><nav id="nav" aria-label="Walkthrough screens"></nav><button id="theme" class="theme">Theme: system</button></header>
<main><div class="intro"><span class="kicker">UI walkthrough · Phase 9.2</span><h1>A visible specialist inside a quiet instrument.</h1><p>One native primary action starts preparation. Real progress stays neutral. Attention belongs to owner decisions. Green appears only after independent verification.</p></div><div class="registers"><section class="window" id="mock" tabindex="-1"></section><aside class="note" id="note"></aside></div><div class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></div></main>
<script>
const rail=`<aside class="rail"><div class="brand">Set Up Copilot Control Tower</div>${['✓ Welcome','✓ Connect GitHub','✓ Detect',"✓ What you're getting",'✓ Departments','✓ Your connections','● Your projects','○ Set up','○ Verify'].map((x,i)=>`<div class="road ${i<6?'done':''} ${i===6?'current':''}"><b>${x[0]}</b><span>${x.slice(2)}</span></div>`).join('')}</aside>`;
const shell=body=>`<div class="titlebar"><span class="dots">● ● ●</span>Set Up Copilot Control Tower</div><div class="app">${rail}<section class="content">${body}</section></div>`;
const screens=[
 {t:'The Resolve action earns the accent',n:['Product projects and ecosystem repositories are visibly separate.','Each selectable row states its exact component scope.','The only filled control is the user-intent action.'],b:shell(`<span class="eyebrow">Step 7 of 9</span><h2>Set up and fix your projects</h2><p class="lead">47 product projects were checked. 22 can continue.</p><div class="card action"><div class="batch"><span>✓</span><div><strong>All supported product projects included</strong><small>Thought Leadership · Claude Copilot only<br>Clio · Claude Copilot and Codex Copilot</small></div><span class="number">22</span></div></div><div class="status"><span class="symbol">▣</span><div><strong>16 Copilot setup repositories</strong><small>Managed separately; no project changes here.</small></div><span class="value">Separate</span></div><div class="status"><span class="symbol">✋</span><div><strong>8 product projects left unchanged</strong><small>5 protected work · 1 owner decision · 2 could not verify</small></div><span class="value">Explained below</span></div><div class="footer"><button class="plain">Choose projects individually</button><div class="group"><button>Use standard setup only</button><button class="primary">✦ Resolve 22 projects with Claude Code</button></div></div>`)},
 {t:'Unavailable stays neutral and actionable',n:['Unavailable is not red because no project truth was lost.','The selected batch remains visible.','Two recovery routes are native bordered actions.'],b:shell(`<span class="eyebrow">Claude Code unavailable</span><h2>Claude Code is not available on this Mac</h2><p class="lead">Install or reconnect Claude Code, then try again. No projects were changed.</p><div class="card"><div class="status"><span class="symbol">⌧</span><div><strong>The preparation session did not start</strong><small>Your 47-project selection is still available.</small></div><span class="value">Not started</span></div></div><div class="footer"><button>Back</button><div class="group"><button>Use standard setup only</button><button class="primary">Check again</button></div></div>`)},
 {t:'Permission denial uses the attention ramp',n:['A three-point attention rail is enough.','The settings path is readable text, not a code block.','The default action is Try again only after the person returns.'],b:shell(`<span class="eyebrow">Permission needed</span><h2>Allow Control Tower to open Claude Code</h2><p class="lead">In System Settings, allow Control Tower to control Terminal. Then come back and try again.</p><div class="card attention"><h3>Privacy &amp; Security → Automation</h3><p class="small">Turn on Terminal for Copilot Control Tower. No projects were changed.</p></div><div class="footer"><button>Use standard setup only</button><div class="group"><button>Open System Settings</button><button class="primary">Try again</button></div></div>`)},
 {t:'Preparing is one calm status card',n:['The spinner, Python stage, and current sentence are paired.','The exact selected-project count is visible.','No percentage, timer, or elapsed-duration display appears.'],b:shell(`<span class="eyebrow">Claude Code · Active</span><h2>Preparing project proposals</h2><p class="lead">Nothing is changing yet.</p><div class="card steps"><div class="status actionable"><span class="symbol">◌</span><div><strong>Claude Code is preparing proposals</strong><small>Claude Code is choosing only among the bounded Python candidates.</small></div></div><div class="status"><span class="symbol">22</span><div><strong>22 selected projects</strong><small>Exact component scope preserved for every project.</small></div></div></div><div class="footer"><button>Stop checking</button><span class="small">Python is recording recent activity</span></div>`)},
 {t:'Stale liveness becomes a static attention state',n:['Python owns the stale verdict.','The spinner is removed when recent activity is not confirmed.','The same card can recover when a fresh stage arrives.'],b:shell(`<span class="eyebrow">Claude Code · Activity delayed</span><h2>Preparing project proposals</h2><p class="lead">Nothing is changing yet.</p><div class="card attention"><div class="status attn"><span class="symbol">!</span><div><strong>Claude Code activity has not been confirmed recently</strong><small>Claude Code is still marked as running, but Python has not recorded a recent heartbeat.</small></div><span class="value">Stale</span></div><div class="status"><span class="symbol">22</span><div><strong>22 selected projects remain protected</strong><small>Control Tower keeps checking for verified progress.</small></div></div></div><div class="footer"><button>Stop checking</button><span class="small">No project changes have started</span></div>`)},
 {t:'Prepared work becomes a compact status register',n:['Rows replace dashboard tiles.','Managed repositories and unchanged reasons never collapse together.','The primary action advances to human review.'],b:shell(`<span class="eyebrow">Preparation complete</span><h2>Proposals are ready to review</h2><p class="lead">Python validated the exact plan.</p><div class="card"><div class="status actionable"><span class="symbol">→</span><strong>17 proposals ready to review</strong><span class="value">Ready next</span></div><div class="status"><span class="symbol">▣</span><strong>16 Copilot setup repositories managed separately</strong><span class="value">Separate</span></div><div class="status"><span class="symbol">✋</span><div><strong>Left unchanged to protect your work</strong><small>5 protected work · 1 owner decision · 2 could not verify</small></div><span class="value">Named below</span></div></div><div class="footer"><button>Start again</button><button class="primary">Review decisions and proposals</button></div>`)},
 {t:'Owner decisions are focused and native',n:['One project question owns the pane.','Native radio controls preserve keyboard and VoiceOver behavior.','The attention rail marks responsibility, not failure.'],b:shell(`<span class="eyebrow">Needs your decision · 1 of 3</span><h2>Choose how convoco should keep its instructions</h2><p class="lead">Control Tower found two active instruction sources and will not choose which one leads.</p><div class="decision"><strong>Which instructions should Claude use first?</strong><div class="choices"><label class="choice"><input type="radio" name="owner"><span><strong>Keep the project's CLAUDE.md first</strong><small>Add shared guidance after it.</small></span></label><label class="choice"><input type="radio" name="owner"><span><strong>Use the shared entry first</strong><small>Link the project instructions from the shared entry.</small></span></label><label class="choice"><input type="radio" name="owner"><span><strong>Leave this project unchanged</strong><small>Exclude convoco from this run.</small></span></label></div><details><summary>Why this is needed</summary><p class="small">Either route can preserve the existing work, but the precedence belongs to the project owner.</p></details></div><div class="footer"><button>Back</button><button class="primary">Save decision and continue</button></div>`)},
 {t:'Untouched work uses neutral, exact protection',n:['Rows have no checkbox or disabled-control ambiguity.','Every row pairs Python’s reason with a next action.','Could-not-verify is visibly different from dirty work.'],b:shell(`<span class="eyebrow">Left unchanged to protect your work</span><h2>Each untouched product has a reason</h2><p class="lead">These projects stay outside preparation and apply.</p><div class="card"><div class="status"><span class="symbol">✋</span><div><strong>method-copilot</strong><small>Protected work. Commit, stash, or finish current changes, then check again.</small></div><span class="value">Protected</span></div><div class="status"><span class="symbol">−</span><div><strong>copilot-control-tower</strong><small>Could not verify safely. Repair unreadable local setup evidence, then check again.</small></div><span class="value">Could not verify</span></div><div class="status"><span class="symbol">◉</span><div><strong>research-copilot</strong><small>Review the project-owned instructions and choose what should lead.</small></div><span class="value">Your decision</span></div></div><div class="footer"><button>Back</button><button class="primary">Continue with ready proposals</button></div>`)},
 {t:'Exact plan review reuses proven cards',n:['The assistant flow visually converges with reconciliation.','Four plain-language groups replace implementation vocabulary.','Apply remains a separate confirmation.'],b:shell(`<span class="eyebrow">Review proposed changes</span><h2>44 projects are ready</h2><p class="lead">Review what will change and what Control Tower will protect.</p><div class="plan"><div class="card"><h3>Will change</h3><ul><li>Add the portable Claude entry.</li><li>Update the Codex Copilot copy.</li></ul></div><div class="card"><h3>Will preserve</h3><ul><li>Keep project-owned instructions.</li><li>Keep existing tools and skills.</li></ul></div><div class="card"><h3>Will not do</h3><ul><li>Run project scripts.</li><li>Replace unrelated files.</li></ul></div><div class="card"><h3>Will check</h3><ul><li>Freshly inspect Claude and Codex.</li><li>Restore failed bounded writes.</li></ul></div></div><div class="footer"><button>Change decisions</button><button class="primary">Apply reviewed changes…</button></div>`)},
 {t:'Apply and fresh verification are two states',n:['The preparation accent disappears during transaction work.','Apply completion is not green.','The current verification sentence is the only animated element.'],b:shell(`<span class="eyebrow">Applying and checking</span><h2>Running a fresh project check</h2><p class="lead">The reviewed changes finished applying. A separate check is inspecting the same approved batch.</p><div class="card steps"><div class="status"><span class="symbol">✓</span><div><strong>Applied the reviewed changes</strong><small>42 projects continued to verification. Two were restored.</small></div></div><div class="status actionable"><span class="symbol">◌</span><div><strong>Freshly verifying Claude and Codex</strong><small>No success claim is shown until this check returns.</small></div></div></div><div class="footer"><button disabled>Back</button><span class="small">Keep Control Tower open</span></div>`)},
 {t:'Receipt color is earned by verification',n:['Green belongs only to verified rows.','Restored uses attention, not failure red.','Incomplete restoration alone earns the blocked ramp and an immediate next action.'],b:shell(`<span class="eyebrow">Project receipt</span><h2>The latest check is complete</h2><p class="lead">Every selected project has an outcome and a next route.</p><div class="card"><div class="status good"><span class="symbol">✓</span><strong>42 freshly verified</strong><span class="value">Verified</span></div><div class="status"><span class="symbol">−</span><strong>3 left unchanged</strong><span class="value">Protected</span></div><div class="status attn"><span class="symbol">↶</span><div><strong>1 restored</strong><small>The previous setup is back in place.</small></div><span class="value">Review next</span></div><div class="status bad"><span class="symbol">!</span><div><strong>1 needs attention</strong><small>One file could not be restored. Open the private diagnostic before changing this project.</small></div><span class="value">Blocked</span></div></div><div class="footer"><button>Show diagnostic</button><button class="primary">Continue setup</button></div>`)},
 {t:'The state ramp survives every appearance',n:['Color is always redundant to symbol and status text.','The manual theme control demonstrates light and dark tokens.','Reduced Motion removes transition without removing status.'],b:shell(`<span class="eyebrow">Visual system proof</span><h2>One closed state vocabulary</h2><p class="lead">The assistant experience adds no new palette. It uses the same Quiet Instrument tokens as the rest of Control Tower.</p><div class="tokens"><div class="token"><strong style="color:var(--accent)">→</strong><small>Actionable</small></div><div class="token"><strong style="color:var(--attention)">◉</strong><small>Decision</small></div><div class="token"><strong>✋</strong><small>Held</small></div><div class="token"><strong style="color:var(--ready)">✓</strong><small>Verified</small></div><div class="token"><strong style="color:var(--blocked)">!</strong><small>Blocked</small></div></div><div class="card well" style="margin-top:16px"><div class="status"><span class="symbol">⌨</span><div><strong>Focus and announcements</strong><small>New state heading first. One polite count summary. Native controls throughout.</small></div></div><div class="status"><span class="symbol">◐</span><div><strong>Appearance</strong><small>Semantic colors adapt to Dark Mode and Increase Contrast.</small></div></div><div class="status"><span class="symbol">◌</span><div><strong>Reduced Motion</strong><small>Text updates immediately and carries the complete fact.</small></div></div></div>`) }
];
nav.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}" aria-label="Screen ${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');
function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];mock.innerHTML=s.b;note.innerHTML=`<h3>${String(i).padStart(2,'0')} · ${s.t}</h3><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';mock.focus({preventScroll:true})}
addEventListener('hashchange',render);const themes=['auto','light','dark'];theme.addEventListener('click',()=>{const n=themes[(themes.indexOf(document.documentElement.dataset.theme)+1)%themes.length];document.documentElement.dataset.theme=n;theme.textContent=`Theme: ${n==='auto'?'system':n}`});render();
</script>
</body>
</html>
