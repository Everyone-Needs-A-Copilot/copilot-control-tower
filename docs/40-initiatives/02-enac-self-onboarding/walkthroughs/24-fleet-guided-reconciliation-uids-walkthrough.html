<!doctype html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24 · User-controlled project handoff — UI walkthrough</title><style>
:root{color-scheme:light dark;--canvas:#eceef1;--window:#fbfbfc;--rail:#f2f3f5;--ink:#202126;--muted:#696c73;--line:#d7d9de;--accent:#0878f0;--accentSoft:#eaf3ff;--ready:#35a553;--attention:#c77b16;--code:#f1f2f4;--shadow:0 28px 80px #0002}html[data-theme=dark]{--canvas:#0f1012;--window:#202124;--rail:#25262a;--ink:#f1f2f4;--muted:#aeb1b8;--line:#3a3c42;--accent:#5da5ff;--accentSoft:#172c46;--ready:#66c97d;--attention:#e0a553;--code:#292a2e;--shadow:0 28px 80px #0008}@media(prefers-color-scheme:dark){html[data-theme=auto]{--canvas:#0f1012;--window:#202124;--rail:#25262a;--ink:#f1f2f4;--muted:#aeb1b8;--line:#3a3c42;--accent:#5da5ff;--accentSoft:#172c46;--ready:#66c97d;--attention:#e0a553;--code:#292a2e;--shadow:0 28px 80px #0008}}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.42 -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line)}nav{display:flex;gap:5px}a,button{font:inherit;color:var(--ink);background:var(--window);border:1px solid var(--line);border-radius:8px;padding:6px 9px;text-decoration:none}#theme{margin-left:auto}main{width:min(1180px,calc(100% - 28px));margin:30px auto}.intro{max-width:780px}.kicker,.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}h1{font-size:40px;line-height:1.04;margin:7px 0}.intro p,.lead,small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px;margin-top:26px}.window{min-height:690px;background:var(--window);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.titlebar{height:52px;padding:16px 21px;border-bottom:1px solid var(--line);font-weight:700}.app{display:grid;grid-template-columns:230px 1fr;min-height:638px}.rail{background:var(--rail);border-right:1px solid var(--line);padding:24px 15px}.brand{font-weight:750;margin:0 10px 20px}.navstep{padding:8px 10px;border-radius:8px;color:var(--muted)}.navstep.done b{color:var(--ready)}.navstep.current{color:var(--ink);background:var(--accentSoft);font-weight:700}.navstep.current b{color:var(--accent)}.content{display:flex;flex-direction:column;padding:31px 38px}.content h2{font-size:28px;line-height:1.1;margin:6px 0 8px}.card{border:1px solid var(--line);border-radius:11px;padding:15px;margin:14px 0}.card.action{background:var(--accentSoft);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.row{display:grid;grid-template-columns:25px 1fr auto;gap:10px;padding:10px 0}.row+.row{border-top:1px solid var(--line)}.step{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:7px 0}.step b{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--accentSoft);color:var(--accent);font-size:12px}.prompt{margin:10px 0;padding:12px;border-radius:8px;background:var(--code);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.value{font-size:12px;color:var(--muted);font-weight:650}.ready{color:var(--ready)}.attention{color:var(--attention)}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:16px}.group{display:flex;gap:8px}.primary{color:white;background:var(--accent);border-color:var(--accent);font-weight:720}.plain{border-color:transparent;background:transparent;color:var(--accent)}.note{border-left:2px solid var(--accent);padding-left:15px}.note h3{font-size:12px;text-transform:uppercase}.note li{color:var(--muted);margin-bottom:8px}.pager{display:flex;justify-content:space-between;margin-top:13px}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:700px){.app{grid-template-columns:1fr}.rail{display:none}.content{padding:24px}.footer{flex-direction:column-reverse}.group{display:grid}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><strong>Project handoff · UI</strong><nav id="nav"></nav><button id="theme">Theme: system</button></header><main><div class="intro"><span class="kicker">UI walkthrough · Phase 9.4</span><h1>The app prepares. The person pilots.</h1><p>The existing native hierarchy makes the handoff unmistakable: four steps, one prompt, a normal Terminal, and a separate verification action.</p></div><div class="grid"><section class="window" id="mock" tabindex="-1"></section><aside class="note" id="note"></aside></div><div class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></div></main><script>
const rail=`<aside class="rail"><div class="brand">Set Up Copilot Control Tower</div>${['✓ Welcome','✓ Connect GitHub','✓ Detect',"✓ What you're getting",'✓ Departments','✓ Your connections','● Your projects','○ Set up','○ Verify'].map((x,i)=>`<div class="navstep ${i<6?'done':''} ${i===6?'current':''}"><b>${x[0]}</b> ${x.slice(2)}</div>`).join('')}</aside>`;const shell=b=>`<div class="titlebar">● &nbsp;● &nbsp;● &nbsp;&nbsp; Set Up Copilot Control Tower</div><div class="app">${rail}<section class="content">${b}</section></div>`;
const screens=[
{t:'Preparation is the one primary decision',n:['No assistant brands compete at this stage.','The batch and preservation boundaries remain visible.','The button says exactly what the app will do.'],b:shell(`<span class="eyebrow">Step 7 of 9</span><h2>Prepare one set of project instructions</h2><p class="lead">Control Tower will write one work-order file and open Terminal at your Sites folder. It will not start Claude Code or Codex.</p><div class="card action"><div class="row"><b>22</b><div><strong>Selected product projects</strong><br><small>One Sites-root conversation</small></div><span class="value">Included</span></div></div><div class="card"><div class="row"><b>16</b><div><strong>Copilot setup repositories</strong><br><small>Managed separately</small></div><span class="value">Excluded</span></div><div class="row"><b>15</b><div><strong>Projects protected from this run</strong><br><small>Current reasons remain available below</small></div><span class="value">Unchanged</span></div></div><div class="footer"><button class="plain">Choose projects</button><button class="primary">Prepare instructions and open Terminal</button></div>`)},
{t:'Four steps make the handoff concrete',n:['Blue marks an available action, not completion.','The prompt is compact and selectable.','Verification is visually separated from starting the assistant.'],b:shell(`<span class="eyebrow">Instructions ready</span><h2>Your project instructions are ready</h2><p class="lead">Terminal is open at your Sites folder. You choose which assistant to start and you control the conversation.</p><div class="card"><div class="step"><b>1</b><div><strong>Start an assistant in Terminal</strong><br><small>Type <code>codex</code> or <code>claude</code> and press Return.</small></div></div><div class="step"><b>2</b><div><strong>Copy the prompt below</strong></div></div><div class="step"><b>3</b><div><strong>Paste it into the assistant and send it</strong></div></div><div class="step"><b>4</b><div><strong>Keep talking there until the work is finished</strong></div></div></div><small><strong>Prompt to paste into Claude Code or Codex</strong></small><div class="prompt">Read and follow every instruction in /Volumes/Dev/Sites/…/INSTRUCTIONS.md…</div><div class="footer"><div class="group"><button class="plain">Open instruction file</button><button>Show Terminal</button></div><div class="group"><button>Check the projects</button><button class="primary">Copy prompt</button></div></div>`)},
{t:'Recovery preserves the handoff',n:['Attention names only the Terminal problem.','No absent-assistant guess is made.','Copy remains available even when Terminal did not open.'],b:shell(`<span class="eyebrow">Instructions ready</span><h2>Terminal did not open</h2><p class="lead">Your files are ready. Open Terminal yourself at the Sites folder, then follow the same steps.</p><div class="card"><div class="row"><b class="attention">!</b><div><strong>Open this folder in Terminal</strong><br><small>/Volumes/Dev/Sites</small></div><span class="value attention">Needed</span></div></div><div class="prompt">Read and follow every instruction in /Volumes/Dev/Sites/…/INSTRUCTIONS.md…</div><div class="footer"><button class="plain">Open instruction file</button><div class="group"><button>Try opening Terminal again</button><button class="primary">Copy prompt</button></div></div>`)},
{t:'Remaining work is a verified fact',n:['There was no assistant-running spinner before this screen.','The user explicitly requested this check.','The same prompt resumes the same one-session workflow.'],b:shell(`<span class="eyebrow">Fresh check complete</span><h2>Some projects still need work</h2><p class="lead">Continue the same conversation with the same prompt, then check again.</p><div class="card"><div class="row"><b class="ready">19</b><div><strong>Passed a fresh check</strong></div><span class="value ready">Verified</span></div><div class="row"><b class="attention">3</b><div><strong>Still need work</strong><br><small>Current Python reasons are listed below.</small></div><span class="value attention">Continue</span></div></div><div class="footer"><button class="plain">Open instruction file</button><div class="group"><button>Check again</button><button class="primary">Copy prompt</button></div></div>`)},
{t:'Fresh verification earns the quiet state',n:['Green is limited to current evidence.','No celebratory styling appears.','The instruction file remains available as support evidence.'],b:shell(`<span class="eyebrow">Fresh check complete</span><h2>Every selected project passed</h2><p class="lead">Python independently checked the complete selected batch.</p><div class="card"><div class="row"><b class="ready">22</b><div><strong>Ready</strong><br><small>All selected Claude and Codex components</small></div><span class="value ready">Verified</span></div><div class="row"><b>0</b><div><strong>Remaining</strong></div><span class="value">None</span></div></div><div class="footer"><button class="plain">Open instruction file</button><button class="primary">Continue setup</button></div>`) }
];nav.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];mock.innerHTML=s.b;note.innerHTML=`<h3>${String(i).padStart(2,'0')} · ${s.t}</h3><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';mock.focus({preventScroll:true})}addEventListener('hashchange',render);const ts=['auto','light','dark'];theme.onclick=()=>{let n=ts[(ts.indexOf(document.documentElement.dataset.theme)+1)%3];document.documentElement.dataset.theme=n;theme.textContent=`Theme: ${n==='auto'?'system':n}`};render();
</script></body></html>
