r:var(--ready)}.step.current{color:var(--ink);background:var(--accentSoft);font-weight:700}.step.current b{color:var(--accent)}.content{display:flex;flex-direction:column;padding:31px 38px}.content h2{font-size:28px;line-height:1.1;margin:6px 0 8px}.card{border:1px solid var(--line);border-radius:11px;padding:15px;margin:14px 0}.card.action{background:var(--accentSoft);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.row{display:grid;grid-template-columns:25px 1fr auto;gap:10px;padding:10px 0}.row+.row{border-top:1px solid var(--line)}.value{font-size:12px;color:var(--muted);font-weight:650}.ready{color:var(--ready)}.attention{color:var(--attention)}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:16px}.group{display:flex;gap:8px}.primary{color:white;background:var(--accent);border-color:var(--accent);font-weight:720}.plain{border-color:transparent;background:transparent;color:var(--accent)}.note{border-left:2px solid var(--accent);padding-left:15px}.note h3{font-size:12px;text-transform:uppercase}.note li{color:var(--muted);margin-bottom:8px}.pager{display:flex;justify-content:space-between;margin-top:13px}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:700px){.app{grid-template-columns:1fr}.rail{display:none}.content{padding:24px}.footer{flex-direction:column-reverse}.group{display:grid}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const rail=`<aside class="rail"><div class="brand">Set Up Copilot Control Tower</div>${['✓ Welcome','✓ Connect GitHub','✓ Detect',"✓ What you're getting",'✓ Departments','✓ Your connections','● Your projects','○ Set up','○ Verify'].map((x,i)=>`<div class="step ${i<6?'done':''} ${i===6?'current':''}"><b>${x[0]}</b> ${x.slice(2)}</div>`).join('')}</aside>`;const shell=b=>`<div class="titlebar">● &nbsp;● &nbsp;● &nbsp;&nbsp; Set Up Copilot Control Tower</div><div class="app">${rail}<section class="content">${b}</section></div>`;
const screens=[
{t:'Assistant choice is one native decision',n:['No AI gradient or special assistant chrome is introduced.','The selected batch owns the visual weight.','Codex and Claude Code remain interchangeable routes.'],b:shell(`<span class="eyebrow">Step 7 of 9</span><h2>Finish your projects in one guided session</h2><p class="lead">One instruction file will guide the assistant through every selected project.</p><div class="card action"><div class="row"><b>22</b><div><strong>Selected product projects</strong><br><small>One Sites-root conversation</small></div><span class="value">Included</span></div></div><div class="card"><div class="row"><b>16</b><div><strong>Copilot setup repositories</strong><br><small>Managed separately</small></div><span class="value">Excluded</span></div><div class="row"><b>15</b><div><strong>Projects protected from this run</strong><br><small>Dirty, unsafe, or awaiting an owner decision</small></div><span class="value">Unchanged</span></div></div><div class="footer"><button class="plain">Choose projects</button><div class="group"><button>Finish with Claude Code</button><button class="primary">Finish with Codex</button></div></div>`)},
{t:'Progress is compact and evidentiary',n:['Counts align and remain stable.','Blue marks the available action, not unverified success.','The same Terminal action persists for the full run.'],b:shell(`<span class="eyebrow">Guided setup is open</span><h2>Your guided setup is open in Terminal</h2><p class="lead">Ask questions there while the assistant works through the list.</p><div class="card"><div class="row"><b class="ready">7</b><div><strong>Passed a fresh check</strong><br><small>Counted only after Python verification</small></div><span class="value ready">Verified</span></div><div class="row"><b>15</b><div><strong>Still in the work order</strong><br><small>Available to the same conversation</small></div><span class="value">Remaining</span></div></div><div class="footer"><button class="plain">Open instruction file</button><div class="group"><button>Copy instructions</button><button class="primary">Bring Terminal forward</button></div></div>`)},
{t:'An owner question uses attention, not alarm',n:['Attention says who acts next.','The app does not repeat technical evidence in a wall of text.','The person returns to one existing conversation.'],b:shell(`<span class="eyebrow">Conversation needed</span><h2>Two projects need your answer in Terminal</h2><p class="lead">No decision was made on your behalf.</p><div class="card"><div class="row"><b class="attention">2</b><div><strong>Waiting for your answer</strong><br><small>Continue in the open conversation</small></div><span class="value attention">Your decision</span></div><div class="row"><b class="ready">18</b><div><strong>Passed a fresh check</strong></div><span class="value ready">Verified</span></div></div><div class="footer"><button>Leave for later</button><button class="primary">Bring Terminal forward</button></div>`)},
{t:'Fresh verification earns the quiet ready state',n:['Green is limited to a verified fact.','No celebratory decoration competes with the next action.','The instruction file remains available as support evidence.'],b:shell(`<span class="eyebrow">Fresh check complete</span><h2>Every selected project passed</h2><p class="lead">Python independently checked the complete guided batch.</p><div class="card"><div class="row"><b class="ready">22</b><div><strong>Ready</strong><br><small>All selected Claude and Codex components</small></div><span class="value ready">Verified</span></div><div class="row"><b>0</b><div><strong>Remaining</strong></div><span class="value">None</span></div></div><div class="footer"><button class="plain">Open instruction file</button><button class="primary">Continue setup</button></div>`) }
];nav.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];mock.innerHTML=s.b;note.innerHTML=`<h3>${String(i).padStart(2,'0')} · ${s.t}</h3><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';mock.focus({preventScroll:true})}addEventListener('hashchange',render);const ts=['auto','light','dark'];theme.onclick=()=>{let n=ts[(ts.indexOf(document.documentElement.dataset.theme)+1)%3];document.documentElement.dataset.theme=n;theme.textContent=`Theme: ${n==='auto'?'system':n}`};render();
</script></body></html>
