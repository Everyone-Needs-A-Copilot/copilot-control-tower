<head>

  <title>10 · Bulk project migration — UI walkthrough</title>
  <style>
    :root{color-scheme:light dark;--canvas:#e9eaed;--window:#fbfbfc;--rail:#f1f2f4;--card:#fff;--soft:#f4f5f7;--ink:#202126;--muted:#686b73;--faint:#92959d;--line:#d7d9de;--blue:#0a71e8;--blue-soft:#eaf3ff;--green:#2f8a4c;--amber:#a66a11;--radius:12px;--shadow:0 28px 90px rgb(20 23 31/18%)}
    [data-theme="dark"]{color-scheme:dark;--canvas:#101113;--window:#1a1b1e;--rail:#17181b;--card:#222328;--soft:#292b30;--ink:#f1f2f4;--muted:#afb2b9;--faint:#7d8088;--line:#3a3c42;--blue:#5aa2ff;--blue-soft:#172b44;--green:#68c981;--amber:#e2ae5c;--shadow:0 30px 100px rgb(0 0 0/52%)}
    @media(prefers-color-scheme:dark){html[data-theme="auto"]{--canvas:#101113;--window:#1a1b1e;--rail:#17181b;--card:#222328;--soft:#292b30;--ink:#f1f2f4;--muted:#afb2b9;--faint:#7d8088;--line:#3a3c42;--blue:#5aa2ff;--blue-soft:#172b44;--green:#68c981;--amber:#e2ae5c;--shadow:0 30px 100px rgb(0 0 0/52%)}}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(18px)}header nav{display:flex;gap:5px}header a,.theme{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:6px 9px;text-decoration:none}.theme{margin-left:auto}main{width:min(1210px,calc(100% - 30px));margin:32px auto 76px}.intro{max-width:850px}.kicker,.eyebrow{color:var(--blue);font-size:11px;font-weight:760;letter-spacing:.09em;text-transform:uppercase}h1{font-size:42px;line-height:1.04;letter-spacing:-.035em;margin:7px 0 11px}.intro p{font-size:17px;color:var(--muted)}.stage-title{display:flex;gap:11px;align-items:baseline;margin:34px 0 13px}.stage-title span{color:var(--faint);font:700 11px ui-monospace,monospace}.stage-title h2{font-size:22px;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:21px}.window{min-height:650px;border:1px solid var(--line);border-radius:22px;background:var(--window);box-shadow:var(--shadow);overflow:hidden}.titlebar{height:52px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);font-weight:700}.dots{color:#ff5f57;letter-spacing:6px;margin-right:20px}.app{display:grid;grid-template-columns:250px 1fr;min-height:598px}.rail{background:var(--rail);border-right:1px solid var(--line);padding:24px 14px}.brand{font-size:17px;font-weight:750;margin:0 12px 24px}.stage{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:9px 12px;border-radius:10px;color:var(--muted)}.stage.done b{color:var(--green)}.stage.current{background:var(--blue-soft);color:var(--ink);font-weight:700}.stage.current b{color:var(--blue)}.content{display:flex;flex-direction:column;min-width:0;padding:34px 42px}.content h3{font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:7px 0 8px}.lead{color:var(--muted);margin:0 0 20px;max-width:680px}.bulk{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:17px;border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));border-radius:var(--radius);background:var(--blue-soft);margin-bottom:12px}.bulk .number{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--card);font-size:22px;font-weight:760}.bulk strong,.row strong{display:block}.bulk small,.row small{display:block;color:var(--muted);margin-top:3px}.census{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.metric{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.metric b{display:block;font-size:22px}.metric small{color:var(--muted)}.card{padding:15px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:12px}.card.soft{background:var(--soft)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0}.row+.row{border-top:1px solid var(--line)}button{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:7px 12px;font:inherit}.primary{border-color:var(--blue);background:var(--blue);color:white;font-weight:700}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:18px}.note{padding-left:15px;border-left:2px solid var(--blue)}.note h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:2px 0 7px}.note li{color:var(--muted);margin-bottom:7px}.pager{display:flex;justify-content:space-between;margin-top:11px}.pager a{color:var(--blue);text-decoration:none}.ok{color:var(--green)}.warn{color:var(--amber)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}}@media(max-width:700px){.app{grid-template-columns:1fr}.rail{display:none}.content{padding:26px}.bulk{grid-template-columns:44px 1fr}.bulk button{grid-column:2}.census{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body><header><strong>Bulk project migration · UI</strong><nav id="toc" aria-label="Screens"></nav><button id="theme" class="theme">Theme: system</button></header><main><div class="intro"><span class="kicker">UI WALKTHROUGH · TASK 226</span><h1>One accented action. Everything else is an exception.</h1><p>The existing native materials, radii, type, and row geometry remain. Accent is earned by the combined action; green appears only after the CLI ledger proves readiness.</p></div><div class="stage-title"><span id="num">01</span><h2 id="title"></h2></div><div class="layout"><div class="window" id="mock" tabindex="-1"></div><aside class="note" id="note"></aside></div><div class="pager"><a id="prev">← Previous</a><a id="next">Next →</a></div></main>
  <script>
    const rail=`<aside class="rail"><div class="brand">Set Up Copilot Control Tower</div>${['✓ Welcome','✓ Connect GitHub','✓ Detect',"✓ What you're getting",'✓ Departments','✓ Your connections','● Your projects','○ Set up','○ Verify'].map((x,i)=>`<div class="stage ${i<6?'done':''} ${i===6?'current':''}"><b>${x[0]}</b><span>${x.slice(2)}</span></div>`).join('')}</aside>`;
    const shell=body=>`<div class="titlebar"><span class="dots">● ● ●</span>Set Up Copilot Control Tower</div><div class="app">${rail}<section class="content">${body}</section></div>`;
    const screens=[
      {t:'Combined update dominates the old repeated list',n:['Full-width action card outranks all 33 rows.','Three stable metrics explain the remainder.','No pre-apply green or success styling.'],b:shell(`<span class="eyebrow">Step 7 of 9</span><h3>Needs guided setup</h3><p class="lead">Some projects can be updated safely together. The rest stay unchanged until their own setup is ready.</p><div class="bulk"><span class="number">9</span><div><strong>Projects can be updated together</strong><small>Preserves project instructions and tools</small></div><button class="primary" data-go="2">Review 9 updates</button></div><div class="census"><div class="metric"><b>9</b><small>Can update together</small></div><div class="metric"><b>7</b><small>Held for now</small></div><div class="metric"><b>17</b><small>Tailored setup</small></div></div><div class="card soft"><div class="row"><div><strong>Held for now</strong><small>Projects with current work or custom setup remain untouched.</small></div><button>Show 7</button></div><div class="row"><div><strong>Tailored setup</strong><small>These projects still need their own reviewed route.</small></div><button>Show 17</button></div></div><div class="footer"><button>Back</button><button class="primary">Continue setup</button></div>`)},
      {t:'Review uses calm, scannable rows',n:['Every eligible project is named.','A single preservation card replaces repeated warnings.','The primary button includes the exact count.'],b:shell(`<span class="eyebrow">Review combined update</span><h3>9 projects can be updated together</h3><p class="lead">Control Tower checked each one against a recognized older setup. It will check again before changing anything.</p><div class="card"><div class="row"><div><strong>convoco</strong><small>Claude and Codex setup</small></div><span>Included</span></div><div class="row"><div><strong>convoco-site</strong><small>Codex setup</small></div><span>Included</span></div><div class="row"><div><strong>force-readiness-assessment</strong><small>Claude setup</small></div><span>Included</span></div><div class="row"><div><strong>6 more projects</strong><small>Visible in the scrollable review</small></div><span>Included</span></div></div><div class="card soft"><strong>Project-owned work stays untouched</strong><p class="lead">Instructions, agents, skills, commands, and plugins are preserved. A project whose evidence changes is left alone.</p></div><div class="footer"><button data-go="1">Back</button><button class="primary" data-go="3">Update 9 projects</button></div>`)},
      {t:'The final confirmation is focused and reversible',n:['The modal contains no technical identifiers.','The safety condition is legible before consent.','Escape and Cancel return to the unchanged review.'],b:shell(`<span class="eyebrow">Ready to confirm</span><h3>9 reviewed projects</h3><p class="lead">The review remains visible behind one native confirmation.</p><div class="card" style="max-width:430px;margin:auto"><h3 style="font-size:22px">Update these 9 projects?</h3><p class="lead">Only the projects in this review are included. Any project that changed will be left alone.</p><div class="footer"><button data-go="2">Cancel</button><button class="primary" data-go="4">Update 9 projects</button></div></div>`)},
      {t:'Indeterminate progress does not make promises',n:['Geometry stays stable during the run.','Controls disable to prevent duplicate apply.','The phase sentence carries the status.'],b:shell(`<span class="eyebrow">Updating eligible projects</span><h3>Updating projects…</h3><p class="lead">Control Tower is checking each project again, applying only the reviewed setup, and verifying the result.</p><div class="card soft"><strong>Checking and updating eligible projects</strong><p class="lead">Projects held for safety remain unchanged.</p><div style="height:5px;background:var(--line);border-radius:5px;overflow:hidden"><span style="display:block;width:38%;height:100%;background:var(--blue)"></span></div></div><div class="footer"><button disabled>Back</button><button class="primary" disabled>Updating…</button></div>`)},
      {t:'Ledger-backed outcomes earn restrained color',n:['Green is limited to verified result text.','A stopped project remains visible, not collapsed into failure.','The remaining count is a CLI field, not app arithmetic.'],b:shell(`<span class="eyebrow">Project update complete</span><h3>8 projects are ready. 1 stopped safely.</h3><p class="lead">Every attempted project was checked. The project that stopped was restored and remains available below.</p><div class="census"><div class="metric"><b class="ok">8</b><small>Updated and verified</small></div><div class="metric"><b class="warn">1</b><small>Stopped safely</small></div><div class="metric"><b>25</b><small>Still need setup</small></div></div><div class="card"><div class="row"><div><strong>convoco</strong><small>The update passed independent verification.</small></div><b class="ok">Ready</b></div><div class="row"><div><strong>voice-copilot</strong><small>The project changed, so the reviewed update was not used.</small></div><b class="warn">Unchanged</b></div></div><div class="footer"><button data-go="1">Review remaining projects</button><button class="primary">Continue setup</button></div>`)},
      {t:'Exception groups keep their own visual weight',n:['Held is protective, not an error state.','Tailored rows retain their existing action grammar.','The batch action disappears when no eligible work remains.'],b:shell(`<span class="eyebrow">Remaining guided setup</span><h3>Projects that still need setup</h3><p class="lead">These projects were not included in the combined update.</p><div class="card"><div class="row"><div><strong>7 held for now</strong><small>Control Tower found work or custom setup it will not overwrite.</small></div><button>Show projects</button></div></div><div class="card"><div class="row"><div><strong>17 need tailored setup</strong><small>Each keeps its existing reviewed assistant route.</small></div><button>Show projects</button></div></div><div class="footer"><button data-go="1">All guided projects</button><button class="primary">Continue setup</button></div>`)},
    ];
    toc.innerHTML=screens.map((_,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')}</a>`).join('');function render(){const i=Math.min(screens.length,Math.max(1,Number((location.hash.match(/s(\d+)/)||[])[1]||1))),s=screens[i-1];num.textContent=String(i).padStart(2,'0');title.textContent=s.t;mock.innerHTML=s.b;note.innerHTML=`<h4>Visual decision</h4><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul>`;prev.href=`#s${Math.max(1,i-1)}`;prev.style.visibility=i===1?'hidden':'visible';next.href=i===screens.length?'#s1':`#s${i+1}`;next.textContent=i===screens.length?'Restart ↺':'Next →';mock.focus({preventScroll:true})}addEventListener('hashchange',render);document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)location.hash=`s${b.dataset.go}`});const themes=['auto','light','dark'];theme.addEventListener('click',()=>{const n=themes[(themes.indexOf(document.documentElement.dataset.theme)+1)%themes.length];document.documentElement.dataset.theme=n;theme.textContent=`Theme: ${n==='auto'?'system':n}`});render();
  </script>
