  - id: ladder-cannot-measure-framework-agent-layer
    statement: "The v2 ladder run (TASK-142/WP-81, 72 cells: 48 main + 24 O-4 ablation) is structurally incapable of evaluating the framework/agent delegation layer in its current harness mode (headless, single-shot `claude -p`): the model invokes the Task tool zero times in any of the 72 cells, INCLUDING the 3 rungs (framework/knowledge/integrations) where the full 13-agent roster is materialized and available. Therefore any 'zero regression from removing agents' finding on this instrument is evidence the agent layer was never exercised -- not evidence it adds nothing. A valid framework-layer test requires a harness mode where delegation actually fires (e.g. interactive/multi-turn sessions rather than single-shot claude -p, or a job whose scope/complexity structurally forces decomposition -- a multi-domain brief spanning several specialist skill areas in one task) -- this ladder's single-file, single-skill jobs never create that pressure."
    definition_refs: [delegation_rate_tool_share, delegation_rate_event_share]
    check: "python3 -c \"import json, glob, os; files=[f for d in ('20260714T144205Z','20260714T150155Z','20260714T150358Z') for f in sorted(glob.glob('tools/cse-bench/output/bench_ladder-runs/%s/*.json' % d))]; paths=[(json.load(open(f)).get('turn_breakdown') or {}).get('transcript_path') for f in files]; checked=[p for p in paths if p and os.path.exists(p)]; hits=[p for p in checked if any(isinstance(c, dict) and c.get('type')=='tool_use' and c.get('name')=='Task' for line in open(p, encoding='utf-8') for obj in [json.loads(line)] for c in ((obj.get('message') or {}).get('content') or []))]; print(len(files), 'cells,', len(checked), 'transcripts found,', len(hits), 'with a Task-tool invocation'); assert len(hits)==0, hits\"  -- transcripts live under ephemeral /var/folders temp dirs (tempfile.mkdtemp() per cell, per this bench's own README convention); if a future re-run finds fewer than 72 transcripts still on disk, that corpus shrinkage must be disclosed, not silently treated as compliance"
    status: passing
    evidence: >-
      Registered 2026-07-14 per QA WP-83 (adversarial verification of
      TASK-142/WP-81's O-6 + O-4 results), as the first-class instrument-
      limitation entry that finding #3 calls for -- this claim exists so no
      future reader re-derives "zero regression from removing agents" as
      "agents add nothing" from ladder-o4-scaffold-attribution-wp79-closed's
      capability-control paragraph (corrected in place, same pass, to point
      here). QA's method: scanned every .jsonl transcript across this run's
      72 cells (all 6 rungs: bare, framework, knowledge, integrations,
      framework_minus_claudemd, framework_minus_agents), structurally
      parsing each `message.content[]` block for `type=="tool_use"` entries
      (not a text grep), and found zero entries named "Task" anywhere,
      including in the 3 rungs where 13 real .claude/agents/*.md files were
      materialized on disk and available for delegation.

      INDEPENDENTLY RE-VERIFIED by this task, same day, same method, fresh
      code (not a re-run of QA's own script): all 72 transcript files are
      still present on disk under /var/folders/.../T/cse-bench-ladder-*/
      (0 missing); the check above runs clean -- 72 cells, 72 transcripts
      found, 0 with a Task-tool invocation. The full set of tool names any
      cell in this run ever invokes, across all 72 cells and all 6 rungs,
      is exactly {Bash, Edit, Read, Write} -- confirmed by enumerating
      every distinct `tool_use.name` seen, not merely checking for the
      absence of "Task". This is a mechanically checked, reproducible
      result (as of 2026-07-14, while these ephemeral temp directories
      persist on this machine), not an inference from the capability-
      control finding alone.

      NAMING WHAT A VALID FRAMEWORK-LAYER TEST WOULD REQUIRE (per the
      task's own instruction, not left implicit): this ladder's jobs are
      each scoped to a single file / single skill area (fix one function,
      write one about.md, report on one health check, build one small
      toolkit) -- none of them present a brief an orchestrator would be
      structurally pushed to decompose and delegate. A test that could
      actually exercise the agent layer needs either (a) a harness mode
      where delegation is possible at all -- this ladder's cells run
      headless, single-shot `claude -p` invocations, which by construction
      never reach a second turn where a Task-tool call could even be
      considered mid-conversation the way it would be in an interactive
      multi-turn session; or (b) a job whose size/domain-breadth forces
      decomposition even within a single invocation (e.g. a brief spanning
      security review + UI design + data migration in one task, closer to
      this program's own real-world sessions). Neither exists in job-pack
      v2. This is named as the concrete next step, not assumed to be
      sufficient on its own -- even a harness that CAN delegate might still
      not, for reasons this ladder cannot distinguish from "the layer adds
      nothing" without first closing this gap.

      OPEN QUESTION, RECORDED HONESTLY, NOT RESOLVED BY ASSERTION (per QA
      WP-83's finding #3 and this task's own instruction): this is also a
      live question about the ecosystem, not only about the instrument.
      delegation-rate-baseline (passing, this same register) reports a
      real-session tool-share delegation rate of ~40.5-40.9% from actual
      production transcripts -- yet this ladder's 72 controlled cells
      delegate at 0%. Two explanations are both consistent with the data
      and neither is favored here: (i) the harness suppresses delegation
      (single-shot `claude -p`, small single-domain jobs, no multi-turn
      pressure -- the "structural" explanation above), or (ii) delegation
      in real sessions only happens under conditions this ladder simply
      does not reproduce (larger/messier real tasks, longer sessions,
      human-in-the-loop back-and-forth). This register does not pick
      between them -- both remain open until a harness that can actually
      exercise delegation is built and run, per the next-step above.

      FOLLOW-UP (2026-07-14, TASK-150 -- the next step this claim itself
      named): the open question above is now CLOSED, by a controlled,
      repeatable, structurally-verified test, not by assertion. Explanation
      (i) is the correct one, refined: `claude -p` headless mode DOES
      expose and fire the delegation tool -- it is named "Agent" in this
      machine's installed Claude Code CLI, never literally "Task" (this
      claim's own `check:` above only filters `name=="Task"`; re-running it
      against the SAME 72-cell corpus scanning for "Agent" too still finds
      ZERO hits, so the zero finding above is not a tool-name artifact of
      that narrower filter). A 12-turn, 3-domain brief (security + UX +
      data-migration, no routing framing) still did NOT delegate -- job
      size/breadth alone, within one un-routed `-p` shot, is insufficient,
      narrowing explanation (i) further. The SAME brief, prefixed with
      `/protocol` -- the framework's own real routing entry point, already
      materialized at every framework rung by `configs.py`, not a
      benchmark-specific hack -- delegated NATURALLY (5 real `Agent` calls,
      sensible routing reasoning, all deliverables correct). A new
      delegation-capable harness mode (`tools/cse-bench/benches/ladder/
      delegation_harness.py`) built on this finding fired real delegations
      in 2/4 `framework`-rung cells on `job_pack.py` v2's discriminating
      pack. See `delegation-capable-harness-mode-built` and
      `agent-layer-marginal-value-underpowered` (new claims, this same
      register) for the mode's pre-registered definition and the
      framework-vs-framework_minus_agents comparison it enables. This
      claim's own STATEMENT -- that the v2 ladder run's own headless,
      single-shot, un-prefixed harness mode is structurally incapable of
      exercising delegation -- remains TRUE and is not superseded (that
      exact mode still delegates at 0%, re-confirmed); what changes is that
      the "why" is now closed, and a working alternative mode exists
      alongside it. Full record:
      docs/40-initiatives/01-cse-auditability/phases/
      phase-4-delegation-capable-harness.md.
    last_checked: "2026-07-14"

  - id: ladder-o4-full-attribution-closed
    statement: "The 23.5% unattributed O-4 residual left by ladder-o4-scaffold-attribution-wp79-closed is closed AMONG SCAFFOLD FILES: all five file-based components materialize_framework() places (CLAUDE.md, agents, commands, skills, .mcp.json) are now isolated in situ at the same model (sonnet) and same job pack (v2, 4 jobs), and their point-estimate shares sum to ~97.8% of the mean turn-1 cache_creation premium -- but at n=4 job-level means, only a coarse ordering is statistically supported (see CORRECTION below): {CLAUDE.md, agents} are the two dominant, roughly-tied costs, together far ahead of skills, which is itself ahead of {commands, .mcp.json}, whose own confidence intervals include zero. The remaining ~2.2% (~66 tokens/job) residual is within measurement noise and not attributed to any untested scaffold FILE, since none remain untested -- but two non-file bare-vs-framework differences (PATH, CC_KNOWLEDGE_REPO) are never ablated by this design and are out of this claim's scope; see CORRECTION."
    definition_refs: [ladder_o4_residual_ablation, ladder_config_materialization, ladder_job_pack_v2]
    check: "cd tools/cse-bench/benches/ladder && python3 -c \"import configs; need={'framework_minus_commands','framework_minus_skills','framework_minus_mcp'}; assert need.issubset(set(configs.CONFIG_NAMES)), configs.CONFIG_NAMES; print('OK', sorted(need))\"  -- data check: tools/cse-bench/output/bench_ladder-runs/{20260714T190603Z,20260714T190828Z,20260714T191044Z}/*.json (12 cells each, framework_minus_commands/skills/mcp respectively) plus the pre-existing 20260714T144205Z (bare/framework baseline). CI check: QA WP-92's t-distribution recomputation (n=4 job-level means, df=3) against the SAME per-job deltas already recorded in this claim's own evidence text below (skills 768/561/501/441; commands 283/196/76/-44; mcp 239/-180/-88/-208 -- reproducible from the same source data, no new run)."
    status: passing
    evidence: >-
      TASK-148, 2026-07-14, per the `ladder_o4_residual_ablation`
      pre-registration (committed BEFORE this run, commit 269b1a7):
      3 rungs x 4 jobs x 3 reps = 36 live cells, all model=sonnet
      (verified per-cell), all status=ok. 5,580,836 tokens / $5.7312
      list-price-equivalent (subscription auth, not billed --
      ladder_config_materialization.cost_accounting_convention), inside
      the pre-registered ~$5.3-$5.7 budget.

      Turn-1 cache_creation isolated per rung via the same
      extract_turn_breakdown() instrument WP-79/WP-81 used, reading the
      real session transcript (message.id-deduped). Recomputed the
      baseline independently from the SAME 20260714T144205Z run WP-79
      used (not re-run): bare and framework turn-1 means per job
      reproduce a MEAN PREMIUM of 3003 tokens across the 4 jobs -- exact
      match to the already-registered figure, confirming this
      decomposition is built on the identical baseline, not a fresh one.

      PER-COMPONENT IN-SITU CONTRIBUTION (framework vs framework_minus_X,
      mean turn-1 cache_creation delta across all 4 jobs -- job-1-bugfix /
      job-2-house-voice / job-3-integration-report / job-4-toolkit):
      - CLAUDE.md (registered, WP-79): 1228 tok, 40.9%.
      - agents (registered, WP-79): 1071 tok, 35.7%.
      - skills (NEW, this task): 568 tok, 18.9% -- per-job deltas 768 /
        561 / 501 / 441, positive and consistent in sign across all 4
        jobs (no job shows a negative skills delta), the largest of the
        3 new components, matching the largest raw content footprint
        (~25.6KB across 5 SKILL.md files -- though the 568-token cost is
        far below what loading all 25.6KB verbatim would imply, meaning
        this is closer to a metadata/discovery-index cost than full-body
        loading, consistent with progressive disclosure).
      - commands (NEW, this task): 128 tok, 4.3% -- per-job deltas 283 /
        196 / 76 / -44 (job-4's delta is slightly negative, i.e. within
        noise); small and consistent with commands' own small raw
        footprint (7 short .md files).
      - .mcp.json (NEW, this task): -59 tok, -2.0% -- per-job deltas 239 /
        -180 / -88 / -208, net slightly NEGATIVE, confirming this rung's
        own pre-registered null hypothesis: the file it ablates is
        already a no-op placeholder (`{"mcpServers":{}}`, zero servers),
        so removing it costs ~0 tokens within noise. This is a real,
        informative null (RULES .mcp.json OUT of the residual), not a
        wasted rung.

      TOTAL ATTRIBUTED = 40.9 + 35.7 + 18.9 + 4.3 + (-2.0) = 97.8% of the
      mean 3003-token premium. SURVIVING RESIDUAL = 2.2% (~66 tokens/job).
      Named exactly, per this claim's own truth condition, not rounded
      away: 66 tokens/job is smaller than the run-to-run spread already
      visible above (e.g. skills' own per-job deltas range 441-768, a
      327-token spread at n=3 reps/job) -- i.e. this residual is
      statistically indistinguishable from measurement noise (cache-
      creation boundary rounding, minor tokenizer/session-bookkeeping
      variance) at this rep count, not a sixth undiscovered component.
      Per this claim's own pre-registration, since all five FILE-based
      components materialize_framework() places have now been measured
      (verified exhaustive OF FILES by re-reading
      _copy_framework_files()), this residual CANNOT be "an untested
      scaffold FILE" by construction -- the pre-registered fallback
      naming applies: most plausibly a genuine model/session-bookkeeping
      floor (e.g. minor cache-boundary variance in how the transcript's
      own turn-1 block is chunked), not demonstrated further than that.

      CORRECTION (QA WP-92, 2026-07-14, adversarial verification of this
      task's own point estimates -- disclosed, not softened): the point
      estimates above reproduce EXACTLY on re-check, but were originally
      quoted with more precision than n=4 job-level means (df=3) supports.
      95% confidence intervals (Student's t, t-crit at df=3), computed from
      THE SAME per-job deltas already recorded above, not a new run:
      CLAUDE.md 1227.8 tok (40.9%), CI [956, 1499]; agents 1070.8 tok
      (35.7%), CI [799, 1342]; skills 567.8 tok (18.9%), CI [342, 794];
      commands 127.8 tok (4.3%), CI [-99, 355]; .mcp.json -59.2 tok
      (-2.0%), CI [-386, 267]. Three consequences this claim's own prose
      must carry, not gloss over:
      (1) CLAUDE.md's and agents' CIs OVERLAP by 343 tokens -- the ranking
      "CLAUDE.md (40.9%) is the biggest lever, ahead of agents (35.7%)" is
      NOT statistically established at this n; the two are roughly TIED as
      the program's two dominant costs, not ordered relative to each
      other. Any recommendation ranking CLAUDE.md above agents on cost
      alone must be read as directional, not proven -- see the corrected
      RECOMMENDATION below.
      (2) skills' and commands' CIs also overlap (by 14 tokens), and
      commands' own CI INCLUDES ZERO -- commands may cost nothing at all;
      only "commands is small, at or near noise" is supported, not its
      exact 4.3% point estimate.
      (3) The only ordering this data actually supports is the coarse one:
      {CLAUDE.md, agents} >> skills >> {commands, .mcp.json} ~= 0. The
      67.9-token / 2.26% residual (restated to QA's own precision, matches
      the "~66 tokens/job, ~2.2%" figure above within rounding) IS
      confirmed smaller than every individual component's own
      run-to-run SD -- that specific finding (residual = noise) stands
      unchanged by this correction.

      EXHAUSTIVENESS SCOPE, STATED EXPLICITLY (QA WP-92): "97.8%
      attributed" and "all five components... now isolated" describe
      exhaustiveness AMONG SCAFFOLD FILES ONLY -- _copy_framework_files()
      is exhaustive of what gets COPIED, but bare and framework differ in
      at least two OTHER ways this file-based ablation design never
      touches: (a) PATH -- framework restores `tc`/`cc`
      (`~/.local/bin`) to PATH, bare excludes it entirely (README.md "The
      4 configs" table); (b) CC_KNOWLEDGE_REPO -- framework points it at
      an EMPTY directory, bare leaves it unset/None. Neither PATH nor
      CC_KNOWLEDGE_REPO is a file materialize_framework() places, so
      neither is, or could be, ablated by a framework_minus_X rung; this
      claim's own instrument cannot see their contribution to the
      3003-token premium at all. "Fully attributed" in this claim's own
      statement and prose above means fully attributed among the files
      copied, not fully attributed among every bare-vs-framework
      difference -- do not requote it as the broader claim.

      DESIGN LIMIT, STATED EXPLICITLY (QA WP-92): every rung in this
      ablation (WP-79's two plus this task's three) removes exactly ONE
      component, marginally, against the same framework baseline -- there
      is no leave-two-out or full-factorial rung. This design is
      structurally BLIND to pairwise interactions between components (e.g.
      whether removing CLAUDE.md AND agents together costs more or less
      than the sum of removing each alone). No evidence of a LARGE
      interaction was found -- the additivity discrepancy (100% - 97.8% =
      2.2%) equals the noise residual exactly, with no unexplained excess
      to attribute to interaction -- but a marginal-only design cannot
      rule small interactions out; it can only fail to detect one bigger
      than the noise floor already named above.

      CAPABILITY CONTROL (same convention as WP-79/WP-83, same scoped
      caveat): t_working was IDENTICAL to +framework on all 4 jobs for
      all 3 new rungs (job-1 3/3, job-2 0/3, job-3 3/3, job-4 3/3, in
      every one of framework_minus_commands/skills/mcp) -- zero
      regressions from removing commands, skills, or .mcp.json on this
      job pack, at this difficulty, with Sonnet. job-2's 0/3 matches
      +framework's own 0/3 exactly (it fails for lack of the knowledge
      tree, unrelated to commands/skills/mcp) -- not a new failure mode.
      Structurally re-verified, same method as
      ladder-cannot-measure-framework-agent-layer: across all 36 new
      cells' transcripts (0 missing on disk), the only tool names ever
      invoked are {Bash, Edit, Read, Write} -- no distinct "Skill" or
      command-invocation tool_use block appears either, so (matching that
      claim's own caveat for the agent layer) this ladder's headless,
      single-shot jobs cannot demonstrate skills/commands add capability
      value here -- only that removing them, on THIS job pack, cost
      nothing observable. Scoped finding, not a general claim these
      components are worthless.

      RECOMMENDATION (the question the owner actually cares about --
      ranked by tokens-per-unit-of-demonstrated-value, cheapest-to-cut
      first, given knowledge/integration layers stay off the table as
      PROVEN and the agent layer stays off the table pending
      ladder-cannot-measure-framework-agent-layer's own separate
      resolution). CORRECTED 2026-07-14 (QA WP-92): the ranking below no
      longer orders CLAUDE.md above agents by point estimate -- their 95%
      CIs overlap (see CORRECTION above), so they are named as a TIED
      top pair, not #1 vs #5:
      1=2 (TIED, CIs overlap). CLAUDE.md, 1227.8 tok/job (40.9%, CI [956,
         1499]) AND agents, 1070.8 tok/job (35.7%, CI [799, 1342]) --
         together the two dominant costs, roughly tied at this sample
         size, both far ahead of skills/commands/.mcp.json. Of the two,
         ONLY CLAUDE.md is already DEMONSTRATED trimmable without
         capability loss: TASK-127/W-5's real trim (commit 0c73f65) cut
         its raw bytes 28.3% and its own measured session contribution
         37.1%, with 6 golden-set agent evals still 10/10 and 498/498 tc
         tests passing -- this 1227.8-token figure is POST-trim, meaning a
         real cut already landed. agents is named here for its true,
         tied-for-largest cost, but is explicitly NOT recommended for
         cutting on this basis alone: ladder-cannot-measure-framework-
         agent-layer already shows this harness cannot observe the agent
         layer's value (0 Task-tool invocations across every rung in 108
         total cells now run), and a separate, concurrent lane is building
         the instrument that would measure it properly -- this claim does
         not pre-empt that ruling. Highest-leverage next engineering step
         that IS supported: a second per-line audit of the CLAUDE.md
         template, same before/after discipline as the first trim.
      3. skills, 567.8 tok/job (18.9%, CI [342, 794]) -- third, and the
         first component whose CI does not overlap CLAUDE.md/agents'
         range, so it is genuinely smaller than the top pair, not merely
         a tied point estimate. Zero explicit invocations observed in
         this harness's 36 cells (though, per the capability-control
         caveat above, that is an instrument limit on THIS job pack, not
         proof skills are never used in real interactive sessions --
         same honesty discipline the agent-layer caveat already
         requires). Candidate for terser SKILL.md descriptions or a
         narrower default roster.
      4. commands, 127.8 tok/job (4.3%, CI [-99, 355] -- includes zero)
         -- small, and the CI does not rule out a true cost of zero; not
