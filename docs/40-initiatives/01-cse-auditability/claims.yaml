      01763a8 -- why returns run large, empirically measured, not guessed):
      a full merged-corpus bucket analysis of 149 subagent invocations with
      a usable final return (304 distinct .jsonl files scanned, 155
      subagent files, 149 usable) found three buckets by what the
      transcript actually shows for `tc wp store`: (a) SUCCEEDED -- a
      `tc wp store` call with a non-error result: n=34 (22.8%), median
      return 648 tokens, mean 868; (b) ATTEMPTED AND FAILED or explicitly
      claimed inability: n=3 (2.0%), median 1,003; (c) NEVER MENTIONED
      externalization at all: n=112 (75.2%), median return 1,082, mean
      1,613. The DOMINANT failure mode is bucket (c), SILENT NON-ATTEMPT
      (75.2% of returns) -- not a broken mechanism; bucket (b), the
      hypothesis this claim's prior CORRECTION paragraph proposed, is real
      but tiny (2.0%). Three in four subagent invocations simply never try
      to externalize, with no stated reason, and their returns run larger
      than the successful bucket's median.

      FALSE-NEGATIVE CORRECTION (same investigation): the "tc isn't on
      PATH" anecdote quoted in this claim's own CORRECTION paragraph above
      (the 5,568-token sd sample) was a FALSE NEGATIVE, not a real PATH
      failure. Root cause, empirically reproduced: this machine's shell
      config aliases `which='type -all'`; zsh parses the combined flag
      `-all` as `-a -l -l`, and `-l` is an invalid option for the builtin
      `type`, so `which <anything>` -- including things that ARE on PATH,
      e.g. `which ls` -- always errors, regardless of the target's real
      availability. `tc` was in fact reliably available to subagent Bash
      calls: 34 of 35 attempted `tc wp store` invocations in the sampled
      corpus succeeded, across 6+ repos and many sessions, using a bare
      `tc` in command position. This matters because it prevents a future
      reader re-deriving a false "tc's PATH is broken for subagents"
      narrative from the single anecdote -- the real, disclosed defect was
      the missing standalone-WP fallback (below), not PATH.

