      this session on a check that tested only the statement's first
      clause ("measured") and never tested the second ("netted against
      outcome value") -- a check weaker than its own statement, the exact
      t2-no-claim-outlives-its-check disease this register exists to make
      impossible, caught in review and fixed here (never a silent
      rewrite). The check above now tests both clauses; this row records
      the honest result of running it.

