# claims.yaml — CSE Verification & Benchmark Program claims register (v1)
#
# TASK-85 (B-2, phase-2-prd.md P0). Retires the initiative's V-2 violation
# (docs/40-initiatives/01-cse-auditability/README.md, "Validation Contract"):
# Phase 1's findings were produced by choosing operational definitions AFTER
# seeing the data. This file is the pre-registration V-2 requires. Per
# phase-2-prd.md §7: "claims.yaml is the single authoritative source for
# every operational definition. No metric may be quoted from this program
# without a register entry — including in the dashboard, in docs, and in
# future audit phases."
#
# SCOPE NOTE (read before extending this file): this is NOT yet the
# README's Phase-0 vision of "one machine-readable table of every claim
# across all four products" (~40 rows, operational_definition /
# falsification_condition / threshold / verdict schema). That full sweep is
# still open work. This v1 register is narrower and specific to what
# phase-2-prd.md §7 actually requires right now: the operational
# definitions this Verification & Benchmark Program itself quotes, plus one
# claim per program truth condition (T1-T8, phase-2-prd.md §2) and one per
# still-quotable Phase-1/re-audit corrected number. When Phase 0's full
# CSE-wide sweep runs, it should EXTEND this file (reuse `definitions:`,
# append to `claims:`) rather than replace it.
#
# ---------------------------------------------------------------------------
# SCHEMA
# ---------------------------------------------------------------------------
#
# definitions:
#   <name>:                 # referenced by claims[].definition_refs
#     description: <str>    # what the term means, precisely enough to
#                            #   re-implement independently
#     source: <path>         # (optional) the code that currently implements
#                            #   this definition, if one exists
#     note / caveat: <str>   # (optional) known fragility, open gaps, or
#                            #   cross-references to other definitions
#     ... additional structured sub-fields as the term requires (e.g.
#         `channels`, `variants`, `products`, `classes`, `levels`) — see
#         individual entries below.
#
# claims:
#   - id: <unique-slug>
#     statement: <str>              # the exact quotable claim, precise
#                                    #   enough to be falsified
#     definition_refs: [<name>, ...]  # keys into `definitions:` above;
#                                    #   `[]` only when the claim rests on
#                                    #   an unambiguous raw field, not a
#                                    #   contested operational definition
#     check: <command-or-"manual">  # how to (re-)verify this claim
#     status: passing|failing|unchecked|gated
#     evidence: <path>              # file (this repo or a sibling repo)
#                                    #   substantiating `status`
#     last_checked: <YYYY-MM-DD>    # required whenever status != unchecked
#
# STATUS ENUM (this register's own vocabulary — distinct from, but mapped
# to, the README's Phase-5 four-verdict scorecard language):
#   passing   — checked; the statement is currently true.        (~ proven)
#   failing   — checked; the statement is currently false.       (~ falsified)
#   unchecked — no check has been run against this statement yet. (~ not-yet-measured)
#   gated     — blocked on a prerequisite workstream/decision landing
#               first; cannot be meaningfully checked until then. (~ not-yet-measured,
#               blocked)
#
# V-2 note: this file is git-committed as its own pre-registration event.
# Per V-2, any `check`/`status`/`threshold`-bearing field must not be
# edited to match a result observed after the fact — corrections belong in
# a new commit with a changed `last_checked`, not a silent rewrite.
# ---------------------------------------------------------------------------

definitions:

  turn:
    description: >-
      One real user turn in a main session transcript: a JSONL record with
      type=="user", isSidechain != true, isMeta != true, and content that is
      not a tool_result (i.e. an actual human/user message, not a tool
      response wrapped in a user-role record). This is the definition
      tools/cse-audit/session_metrics.py (is_real_user_turn, n_user_turns)
      currently implements and the one this program's "turns" numbers use.
    source: "tools/cse-audit/jsonl_utils.py (is_real_user_turn); tools/cse-audit/session_metrics.py (n_user_turns)"
    caveat: >-
      This definition is NOT comparable to the April 2026 restructure doc's
      "671 turns/session" figure. April's counting script no longer exists
      (docs/40-initiatives/01-cse-auditability/phases/phase-1-findings.md,
      F-6), so its definition cannot be recovered. Re-measuring under THIS
      definition gives a median of 6.0 turns/session — a ~90-112x gap the
      re-audit corroborated as a definitional artifact, not a real
      before/after change. See claim turn-definition-incompatible-with-april.

  delegation_rate_tool_share:
    description: >-
      Of all tool calls in a session (main-session tool calls plus every
      sidechain/subagent tool call), the fraction executed inside a
      subagent context: n_subagent_tool_calls / (n_main_tool_calls +
      n_subagent_tool_calls). Answers "of everything that got done, how
      much ran inside a delegated subagent."
    source: "tools/cse-audit/session_metrics.py (SessionMetrics.delegation_rate_toolshare)"
    note: >-
      ALWAYS report side by side with delegation_rate_event_share, never
      alone. The two are both defensible readings of "delegation rate" and
      disagree by an order of magnitude (docs/40-initiatives/01-cse-auditability/phases/phase-1-findings.md,
      F-5); citing only one without the other reproduces the exact
      pre-registration failure this file exists to close.

  delegation_rate_event_share:
    description: >-
      Of the main session's own tool-call decisions only, the fraction that
      were "call an Agent/Task" rather than "do it myself":
      n_agent_delegations / n_main_tool_calls. Answers "of the orchestrator's
      own choices, how often did it choose to delegate."
    source: "tools/cse-audit/session_metrics.py (SessionMetrics.delegation_rate_eventshare)"
    note: >-
      ALWAYS report side by side with delegation_rate_tool_share. See that
      entry's note; this is the other half of the same F-5 pair.

  protocol_declaration:
    description: >-
      A main-session assistant message counts as protocol-declared if its
      first non-thinking text block, left-stripped, starts with the literal
      string "[PROTOCOL". Two denominators are tracked: `_all` (every
      main-session assistant message) and `_first_of_turn` (only messages
      whose parentUuid is a real user-turn uuid — the "strict" reading,
      since a protocol declaration is only meaningful as the FIRST reply to
      a user turn, not on every follow-up message within it).
    source: "tools/cse-audit/session_metrics.py (_process_assistant_record; protocol_declaration_rate_all, protocol_declaration_rate_first_of_turn)"
    caveat: >-
      Whether April 2026's original "3.5%" figure used the same string
      match is unrecoverable (F-6); the comparison is directional only.

  knowledge_read:
    description: >-
      A file under a registered knowledge-repo root counts as "read" in a
      session if EITHER of two channels fires against its path.
    channels:
      read_tool: >-
        A Read, Grep, or Glob tool_use call whose input path (file_path for
        Read; path/pattern for Grep/Glob) resolves to a location under a
        registered knowledge repo root. IMPLEMENTED —
        tools/cse-audit/product_usage.py (classify_knowledge_path,
        scan_corpus's Read/Grep/Glob branch).
      bash_mediated: >-
        A Bash tool_use call whose command string contains one of {cat,
        grep, rg, head, sed} in COMMAND POSITION (start of the command
        string, or start of a pipeline segment after &&/||/|/;/backtick/
        $(/newline — the same command-position rule as cli_invocation
        below) AND at least one subsequent whitespace-delimited token,
        after ~/$VAR/relative-to-cwd expansion, resolves to a path under a
        registered knowledge repo root. IMPLEMENTED (B-5, 2026-07-12) —
        tools/cse-bench/collectors/transcripts.py
        (_classify_knowledge_bash / _extract_bash_targets / the Bash
        branch of _scan_extra). This closes the H-2 gap identified in
        phase-1-findings.md ("no native Grep/Glob calls exist anywhere in
        the corpus — file search happens via Bash"). Any "never read"
        figure computed from read_tool alone remains available for
        comparison (tools/cse-audit/product_usage.py still implements
        that channel only) but is now known to be an UPPER BOUND on
        never-read, not the full measurement — see the collector's
        `distinct_files.bash_only` field for how many files this channel
        surfaces that read_tool alone would have missed.
    named_file_match_rule: >-
      The binary must be in command position per the bash_mediated channel
      above (not merely present in the argument list — e.g. `echo "run cat
      foo.md"` does not match). A directory-target grep/rg call (e.g. `grep
      -r pattern knowledge-copilot/`) counts as reading every file named in
      that call's OWN tool_result output (the files rg/grep actually
      reported matches in), not every file under the directory argument —
      a call that finds zero matches reads nothing under this rule.
    source: "tools/cse-audit/product_usage.py (read_tool channel); tools/cse-bench/collectors/transcripts.py (bash_mediated channel, B-5)"

  knowledge_never_read_denominator:
    description: >-
      "Never read" is meaningless without stating what it is a fraction OF.
      Two denominators are both registered and both quotable — NEVER quote
      a never-read percentage without naming which one it uses.
    variants:
      knowledge_md: >-
        Count of *.md files under knowledge-copilot/, excluding vendored/
        tooling directories (node_modules, storybook build output, .git,
        .obsidian). 906 files as measured 2026-07-12
        (docs/40-initiatives/01-cse-auditability/phases/phase-1-reaudit-report.html: "True size: 906 knowledge markdown
        files — of 15,244 total"). Never-read share under this denominator
        was originally reported as 67% (67.1% precisely) — SUPERSEDED, see
        RECONCILIATION 2026-07-14 below; the reproducible baseline under
        this register's own matching rule is 80.8% (denominator 915,
        2026-07-12).
      all_files: >-
        Count of every file under knowledge-copilot/ regardless of
        extension, using tools/cse-audit/product_usage.py's
        inventory_knowledge_repo() (excludes only .git, .obsidian,
        node_modules by default). Never-read share under this denominator:
        ≈88%. CONFIRMED 2026-07-14 (was OPEN GAP): B-5's re-run
        (tools/cse-bench/collectors/transcripts.py, denominator 1724)
        measures 88.7% never-read — a 0.8% relative deviation from the
        original ≈88%, close enough that this exclusion set (in particular,
        that it does not need the storybook-build-output exclusion the
        knowledge_md variant carries) is confirmed to match what the
        re-audit used. This denominator variant is a clean machine-vs-machine
        reproduction, unlike knowledge_md below.
    reconciliation_2026_07_14: >-
      knowledge-never-read-rate was FAILING (last_checked 2026-07-12)
      because B-5's mechanical re-run reproduced all_files (88.7% vs ≈88%,
      0.8% relative deviation) but NOT knowledge_md (80.8% vs 67.1%, ~21%
      relative deviation) -- flagged then as "needs reconciliation, out of
      scope." Reconciled here. Diagnosis, proven with numbers and direct
      filesystem/git inspection, not asserted: the 67.1% figure was a
      ONE-OFF MANUAL reconciliation of the same stale-path-join problem
      that inflated Phase 1's original 95.6% headline -- the reaudit report
      itself documents this was NOT durably fixed in the underlying
      tooling ("the never-read join has no rename tracking and will
      silently re-break on the next repo reorg,"
      phase-1-reaudit-report.html "Probe blind spots found but not
      fixed"), only patched by hand for that one measurement. Direct
      inspection of the live knowledge-copilot tree confirms the kind of
      reorg a human can reconcile by judgment but a non-guessing matcher
      correctly cannot: (1) one-to-many directory splits, e.g.
      01-company/10-org-and-team.md is now the directory
      01-company/10-org-and-team/{00-roster.md, people/}, and
      01-company/08-case-studies/beacon.md is now
      01-company/08-case-studies/beacon/{00-case-study.md, 00-index.md,
      reference/} -- both confirmed live as directories, not files, and
      both surfaced as `unmatched` by transcripts.py's own
      read_tool_channel in a fresh 2026-07-14 run; (2) basename-changing
      renames outside the numeric-prefix pattern the collector's
      _basename_key fallback already handles, e.g. knowledge-copilot git
      history since 2026-05-01 shows
      01-company/08-case-studies/uber-freight/00-case-study.md renamed to
      01-company/12-pursuits/uber-freight/00-pursuit.md (git log
      --diff-filter=R) -- the basename itself changed, so no basename-key
      match, current or fallback, can ever land it. Both classes are
      exactly what this register's own knowledge_read definition requires
      the matcher to refuse to guess at (named_file_match_rule: ambiguous
      or non-unique matches are reported unmatched, never guessed) --
      matching conservatism (the register's original hypothesis) is
      confirmed as the mechanism, and it is concentrated in knowledge_md
      because a one-to-many directory split changes the *.md inventory's
      shape (one denominator entry becomes several) in a way that barely
      moves the much larger all_files pool's percentage. Corpus growth
      (906 -> 915 -> 920 knowledge_md files across the three measurement
      dates) is real but minor -- a ~1.5% denominator change, not the ~21%
      relative deviation being explained. This is not a collector bug (the
      unique-basename-fallback design is a deliberate, correct refusal to
      guess at ambiguous or basename-changing renames -- guessing would be
      the actual bug) and the original 906/67.1% figure was not
      ill-specified (its definition -- 906 knowledge_md files, both read
      channels -- is precise) -- it is simply NOT REPRODUCIBLE by any
      mechanical, non-guessing re-run, the same class of problem as
      definitions.turn's unrecoverable April figure. Per that precedent,
      the honest move is to re-baseline: 80.8% (knowledge_md, n=915) and
      88.7% (all_files, n=1724), both dated 2026-07-12, are now the
      register's reproducible baseline; 67.1% remains on record as a
      historical, non-reproducible data point (directionally consistent --
      both agree the corpus is cold, not dead) and must not be requoted as
      an ongoing target, exactly as Phase 1's 95.6% was already treated.
      See claim knowledge-never-read-rate.
    caveat: >-
      Phase 1's original headline (95.6% never read) is SUPERSEDED and must
      not be requoted; it combined a buggy path-join (a mid-corpus repo
      reorg broke ~60% of recorded reads) with a vendored-file-polluted
      denominator. See claim knowledge-never-read-rate.

  cli_invocation:
    description: >-
      A tool call counts as invoking a CLI product if the target binary
      name appears in COMMAND POSITION — the start of a Bash command
      string, or the start of a pipeline segment after &&, ||, |, ;, a
      backtick, $(, or a newline — never merely as a substring, a path
      component, a grep pattern, or prose in an argument. This is the same
      command-position rule the bash_mediated knowledge_read channel reuses.
    products:
      cli_copilot: >-
        Entrypoints: /opt/homebrew/bin/copilot (absolute path) or the
        `cli_copilot` console-script name — both classified
        cli_copilot_unambiguous. A bare `copilot` token in command position
        is tracked SEPARATELY as cli_copilot_bare (ambiguous: whether the
        Bash tool's non-interactive shell sources the `copilot` alias below
        cannot be determined from the transcript alone) and is NOT counted
        toward unambiguous cli_copilot usage.
      cc_framework: >-
        Entrypoint: `cc`, resolving to ~/.local/bin/cc (mirrored at
        /opt/homebrew/bin/cc) — claude-copilot's tool, a DIFFERENT product
        from cli_copilot (see docs/40-initiatives/01-cse-auditability/phases/phase-1-findings.md
        F-14: "four programs share two names"). Classified cc_framework
        only when the following token is a registered cc subcommand (see
        CC_FRAMEWORK_SUBCOMMANDS in product_usage.py) or --version/--help;
        otherwise cc_ambiguous. Must NEVER be merged into cli_copilot
        counts.
    excludes:
      - "the interactive `copilot` shell alias (`cd /Volumes/Dev/Sites/COPILOT`) — a directory change, not a program; per F-14 it shadows the binary in an interactive shell"
      - "`gh copilot` (GitHub's own Copilot CLI extension) — excluded by checking for a preceding `gh` token"
      - "`/usr/bin/cc`, the C compiler — excluded via a compiler-style-flag / source-object-argument / CC=-assignment / cargo|clang|gcc heuristic (cc_compiler bucket)"
    source: "tools/cse-audit/product_usage.py (classify_bash_command, CLI_COPILOT_BIN_RE, CC_BIN_RE, _CC_COMPILER_HINT_RE)"
    terminal_coverage: >-
      Terminal (non-transcript) invocations are covered by two independent,
      cross-validated sources: ~/.zsh_history (536 days, 2025-01-21..2026-07-12)
      and Warp's block history (warp.sqlite `commands` table, 207 days,
      2025-12-17..2026-07-12; B-3 probe 2026-07-12). For the overlapping window
      every command-position hit is a timestamp-exact duplicate across both
      sources (12/12 concordant); the pre-2025-12-17 stretch (~329 days) is
      single-source (zsh only) because Warp did not exist on this machine.
      CORRECTION (B-3, 2026-07-12): the re-audit's "14 terminal invocations"
      counted 2 mid-line textual mentions; under this definition's
      command-position rule the true count is 12 (11x uspto 2026-04-03,
      1x conv 2026-06-09; +2x db 2026-06-14 appear only in zsh — recheck
      classification during B-5). Bare `copilot` in interactive history is
      always the cd alias (84/84 Warp hits corroborated via pwd deltas).

  cli_liveness_classes:
    description: >-
      Every CLI Copilot leaf command is classified into exactly one of four
      liveness classes, per config presence x git activity x transcript
      usage x shell history, as used in the 2026-07-12 re-audit
      (docs/40-initiatives/01-cse-auditability/phases/phase-1-reaudit-report.html).
    classes:
      alive: "shows all four liveness signals (config present, recent git activity, transcript usage, shell-history usage)"
      occasional: "shows some but not all liveness signals — used, but not on every signal"
      never: "shows zero usage signals in any corpus checked, including commands whose backing service cannot even authenticate"
      local_utility: "commands that operate purely on local state (git, fs, shell, docker, docs, …) and therefore have no live-integration signal to show in the first place — liveness classification does not apply to them the same way"
    caveat: >-
      This classifies CLI Copilot's 439 leaf commands (22 service groups),
      not the same figure as Phase 1's original 208-command count, which
      was a ~2x undercount corrected by the re-audit.

  parity:
    description: >-
      Codex Copilot's fidelity to its claude-copilot upstream, checked at
      two distinct levels — never conflate them when reporting a parity
      result.
    levels:
      version_tuple: >-
        Compares 3 version-string fields between the two repos'
        parity manifests (codex-copilot/parity/claude-baseline.json).
        EXISTING, IMPLEMENTED. Passing this check proves the manifests
        AGREE on version numbers; it says nothing about whether the
        underlying agent/command/skill CONTENT actually matches.
      content_hash: >-
        Extends the version-tuple check to sha256 content hashes of every
        upstream `.claude/agents/*.md`, `.claude/commands/*.md`, and
        `.claude/skills/**/SKILL.md` file, so drift is visible the day it
        happens rather than only when a maintainer notices by inspection.
        BUILT (C-4, TASK-104, codex-copilot commit 740aa10, 2026-07-12) —
        `check-upstream-parity.py --content [--json]`, compared against
        the committed manifest `codex-copilot/parity/upstream-content-hashes.json`
        ({generated_at, upstream_commit, files: {relpath: sha256},
        versions}). `--update-baseline` is the explicit "we caught up"
        action (never implicit); see codex-copilot
        docs/05-reference/03-parity-contract.md "Sweep Workflow". This
        register's earlier note ("PROPOSED, NOT YET BUILT") is corrected
        here, not silently — see claim t6-two-harnesses-one-behavior for
        the current content-check result.
    source: "codex-copilot/parity/claude-baseline.json (version_tuple); codex-copilot/parity/upstream-content-hashes.json (content_hash); codex-copilot scripts/check-upstream-parity.py (both levels)"

  two_harness_behavior_equivalence:
    description: >-
      Whether Claude's and Codex's harnesses reach the SAME mechanical
      PASS/FAIL outcome on the SAME job under the SAME unmodified
      acceptance check, at the `+framework` ladder rung only. For a job `J`,
      let `claude_result = t_working(claude_workdir_after_J)` and
      `codex_result = t_working(codex_workdir_after_J)`, both booleans from
      `J`'s own `acceptance_check` exit code (0 = pass) plus each harness's
      `protected_files` check. `J` is BEHAVIOR-EQUIVALENT iff
      `claude_result == codex_result` — agreement on FAILURE counts equally
      as agreement on success; this is deliberately the narrowest
      defensible reading of "same solution, different harness," not a
      byte-identical or rubric-level (`t_loveable`) match. A pack is
      behavior-equivalent iff all of its jobs are.
      NAMED INSTRUMENT LIMITATION (do not read past it): neither harness's
      headless mode (`claude -p` / `codex exec`) invokes
      delegation/orchestration — 0 Task-tool calls across 72 ladder cells is
      the separately-documented finding this inherits (see claim
      `ladder-cannot-measure-framework-agent-layer`). This check therefore
      tests whether a project-instructions file (`CLAUDE.md` vs `AGENTS.md`)
      changes a single-shot, tools-enabled model's outcome — it does NOT
      test, and must never be reported as testing, multi-agent
      delegation/orchestration equivalence, `t_loveable`/MLP-rubric
      equivalence, equivalence at any rung other than `+framework`, or
      byte-level deliverable equivalence.
    source: "docs/40-initiatives/01-cse-auditability/phases/phase-4-cross-harness-behavior.md Sec 2 (pre-registered, committed 36721e3, before any cell ran); tools/cse-bench/benches/ladder/cross_harness.py; codex_harness.py"

  live_integration:
    description: >-
      A service is counted as a live integration if `copilot health --json`
      (CLI Copilot's top-level `health` command, cli-copilot/copilot_cli/main.py)
      reports healthy==true for it. Per-service check functions return a
      dict containing a "healthy" boolean (or, for legacy checks, a
      "status"=="healthy" string that main.py's health() coerces to the
      same boolean); a service that raises an exception during its check,
      or that main.py could not import at all, is treated as unhealthy
      (healthy=false), never as absent from the count.
    source: "cli-copilot/copilot_cli/main.py (health(); checks list; print_health)"
    caveat: >-
      As of this register's writing, 4 service groups exist in CLI Copilot
      but are NOT registered in the `health` command's checks list at all
      (phase-2-prd.md C-1: "registering the 4 service groups missing from
      copilot health"). Until that lands, a live_integration count is an
      undercount of true integration health, not a false one — services
      missing from the list are neither healthy nor unhealthy, they are
      simply not checked.

  outcome_bars:
    description: >-
      The nine ratified outcome measures (owner, 2026-07-13) that define
      ecosystem success: O-1 Time-to-First-Loveable-Solution (two timestamps,
      t_working and t_loveable, per solution); O-2 Solution Completeness
      (against a brief locked at start: sessions-to-done, tokens-to-done,
      post-ship fix-vs-feature ratio); O-3 Speed (prompt to finished solution
      vs bare-harness counterfactual); O-4 Token Efficiency (constraint not
      objective: aspiration 90 percent reduction, below 60 percent = work to
      do, never traded against O-1/O-3); O-5 Solution Survival (started ->
      shipped -> in-use at N weeks); O-6 Counterfactual Delta (4-config
      ladder); O-7 Voluntary Return Rate; O-8 Transfer Coefficient (>=2
      non-author users); O-9 Upkeep Tax. Unit of value = a Solution: a
      completed artifact resolving a real person's real problem. Full
      operational definitions: phases/phase-4-outcome-program-prd.md par.2.
    source: "docs/40-initiatives/01-cse-auditability/phases/phase-4-outcome-program-prd.md"
    note: >-
      Pre-registered before any outcome data exists (V-2). Gated on the
      Outcome Ledger (W-1), token joins (W-2), ladder harness (W-3), and
      external pilots (W-4). The removal rule rides on these: surface that
      moves no outcome bar within its review window is nominated for
      delete-or-defend.

  solution_token_accounting:
    description: >-
      W-2 (per-solution token accounting, phase-4-outcome-program-prd.md
      par.3 W-2): a solution's total tokens are computed TWO independent
      ways and the two are compared — never quoted alone.
    methods:
      ledger: >-
        The solutions.tokens_total column (claude-copilot tools/tc/,
        `tc solution log-usage --tokens N`) — a self-reported, cumulative
        figure a person types in. Per the W-1 (TASK-123) status gate,
        log_usage can only run once a solution has shipped
        (tc.services.solutions.log_usage), so today this column
        accumulates POST-ship usage entries, not a running total from
        first prompt — an inherited W-1 scope limit this task does not
        change; the ledger figure compared here is whatever a person has
        logged, however that entry was arrived at.
      transcripts_billed_volume: >-
        RENAMED + WINDOWED 2026-07-13 (QA WP-17 finding 1, correction
        commit -- was `transcripts`, unwindowed, in the original W-2
        landing; see join_keys.windowing below for the attribution bug
        this fixes). For every DISTINCT session_id recorded against a
        solution in solution_sessions, windowed to that solution's OWN
        touch span in that session, the sum of input_tokens +
        cache_creation_input_tokens + cache_read_input_tokens +
        output_tokens across every assistant message WHOSE OWN TIMESTAMP
        FALLS INSIDE THE WINDOW, in that session's main transcript file
        and its sibling subagent transcript files. This is billed API
        VOLUME (what the API metered for those messages), not marginal
        spend -- see transcripts_marginal_spend for the number comparable
        to a person's mental model of "tokens this took."
      transcripts_marginal_spend: >-
        NEW 2026-07-13 (QA WP-17 finding 2, correction commit, citing the
        F-8 precedent -- docs/40-initiatives/01-cse-auditability/phases/
        phase-1-findings.md: the falsified "~94% less context" figure was
        cache-read SHARE misattributed as the framework's own context
        reduction, a property of Claude Code's prompt caching, not the
        framework. Cumulative-summing transcripts_billed_volume across a
        long session has the same error class: cache_read_input_tokens
        reflects a turn's full re-read of the growing cached context, so
        summing it turn-over-turn conflates billed API volume with
        tokens actually spent doing NEW work). Same windowed message set
        as transcripts_billed_volume, but summing ONLY input_tokens +
        cache_creation_input_tokens + output_tokens -- i.e. EXCLUDING
        cache_read_input_tokens entirely (tokens re-read from an existing
        cache, not newly spent). This is the figure the tolerance below
        is primarily checked against, since a person typing a
        `tc solution log-usage --tokens` estimate is estimating marginal
        spend, not cumulative billed cache-read volume.
      event_ledger_c3: >-
        NOT YET BUILT. phase-4-outcome-program-prd.md par.3 W-2 names a
        third source — "the PostToolUse event ledger from C-3" — as what
        "makes this exact in every wired repo." C-3 (phase-2-prd.md
        C-series, "Observability hook rollout ... beyond the single wired
        repo") has not landed anywhere as of this register's writing (see
        phase-4-outcome-program-prd.md par.1, "Pending queues: R-series
        (phase 3), C-3/C-5, B-13/B-14/B-17") — no PostToolUse hook that
        logs a token/tool-call event ledger exists in any repo today. The
        two methods this register compares are therefore `ledger` vs
        `transcripts`, NOT `ledger` vs the C-3 event ledger — do not
        mistake `transcripts` for C-3's output.
    join_keys: >-
      repo_path (cwd at the time of the `tc solution` call), session_id
      (the CLAUDE_CODE_SESSION_ID environment variable Claude Code exports
      to every tool invocation inside a live session), and logged_at
      (datetime('now') at the call) — captured automatically by every
      solution-mutating `tc solution` subcommand (create, lock-brief,
      mark-working, mark-loveable, log-usage, close) into the additive
      solution_sessions table whenever that env var is present; absent
      outside a live session (e.g. scripts, tests), which is the honest
      no-signal state, not an error.
    windowing: >-
      CORRECTION 2026-07-13 (QA WP-17 finding 1, correction commit). The
      original W-2 landing attributed a session's ENTIRE transcript total
      to EVERY solution that shared its session_id — a real attribution
      bug (caught before any O-4 number was ever quoted, not after). Fix:
      per (solution, session_id) pair, window := [min(logged_at),
      max(logged_at)] across that solution's OWN solution_sessions
      touches in that session — first touch to last touch. Chosen over
      the other honest option (cross-solution per-touch bracketing, where
      each touch's window extends to the NEXT touch to ANY solution in
      that session) because a single solution's own touch rows are
      sufficient to bound its own window without reading every OTHER
      solution's touches in the same session — simpler, and still fixes
      the attribution bug, at the cost of the limitation below. Only
      assistant messages whose OWN timestamp falls inside the window
      count toward that solution's transcripts_billed_volume /
      transcripts_marginal_spend / waste_decomposition_heuristics
      figures for that session.
      KNOWN LIMITATION (disclosed, not padded away): a solution touched
      only once, or whose touches all land in the same instant (e.g. a
      scripted/synthetic sequence rather than real elapsed work), yields
      a near-zero-width window and near-zero attributed tokens. This
      join is only informative for solutions whose real `tc solution`
      commands are genuinely spread across the session's real elapsed
      time — the expected shape of real usage, not of a test script.
    tolerance: >-
      agrees_within_tolerance := abs(ledger_tokens - transcripts_marginal_spend)
      / transcripts_marginal_spend <= 0.20 (20 percent relative
      difference); undefined (null) when transcripts_marginal_spend is 0
      or either side has no data. Registered BEFORE any real two-method
      comparison was computed or looked at (V-2); value UNCHANGED by the
      2026-07-13 correction commit (QA WP-17) — only the windowing and
      the marginal-spend/billed-volume split were added, never the
      threshold. Rationale: `ledger` is a human-typed, rounded estimate,
      not a second machine-exact computation, so this tolerance measures
      "same order of magnitude, roughly right," not agreement between
      two machines that should be identical to the token. 20 percent is
      a deliberately loose first bar for that reason; expected to
      tighten once event_ledger_c3 lands and the comparison becomes
      machine-vs-machine. Applies PRIMARILY to ledger vs
      transcripts_marginal_spend (the figure comparable to a human
      estimate); ledger vs transcripts_billed_volume is reported
      alongside for transparency only — it is NOT expected to agree at
      the same order of magnitude (billed_volume includes cumulative
      cache-read re-reads, not new spend), and a billed_volume/ledger
      mismatch must never be quoted as if it were the same finding as a
      marginal_spend/ledger mismatch (the F-8 conflation this correction
      exists to avoid).
    source: >-
      claude-copilot tools/tc/src/tc/db/schema.py (solution_sessions
      table); tools/tc/src/tc/services/solutions.py
      (_record_session_touch); tools/cse-bench/collectors/economy.py (the
      join + comparison).
    verified_finding_initial_superseded: >-
      SUPERSEDED by verified_finding_corrected below (QA WP-17 caught the
      unwindowed attribution bug and the billed-volume/marginal-spend
      conflation this initial run exhibits). Kept verbatim as the honest
      record of what the FIRST run actually found, not deleted: TASK-124,
      2026-07-13, added AFTER the tolerance above was registered
      and the mechanism built (not a threshold change): a scratch-DB
      verification joined to this task's own real, live session
      transcript found transcript_tokens two-to-three orders of magnitude
      larger than a plausible human-typed ledger guess (~190M vs a 50,000
      test estimate). This is NOT a bug -- `cache_read_input_tokens` is
      billed PER ASSISTANT MESSAGE and reflects that turn's full re-read
      context, so summing it across every turn of a long, many-turn
      session (here: 1 main + 7 subagent files, 1,373 assistant messages
      total) is mathematically a cumulative sum, not a snapshot -- it
      legitimately grows to the tens/hundreds of millions for a
      real, heavily-delegated session. Two consequences worth recording:
      (1) a `tc solution log-usage --tokens` estimate typed against
      intuition (e.g. "current context size") will essentially never
      agree with this definition at real-world scale unless the person
      logging it is told explicitly to estimate the SAME cumulative-sum
      quantity; (2) a session_id shared across multiple unrelated tasks
      (Claude Code reuses one session_id across a long-lived orchestrator
      conversation) attributes that WHOLE session's cumulative usage to
      whichever solution happens to be joined to it -- the join is only
      a clean per-solution measure when the joined session is dedicated
      to that one solution. Neither point changes the registered 20%
      tolerance or the mechanism; both are open gaps for whoever next
      logs ledger tokens or interprets a comparison this collector
      produces.
    verified_finding_corrected: >-
      TASK-124, 2026-07-13, RE-RUN after the windowing + billed_volume/
      marginal_spend correction commit above (QA WP-17) -- same method
      (scratch DB, never written to a production tasks.db), but this time
      with the 5 touches given a REALISTIC simulated spread (18:40:00 ->
      19:00:30, ~20 minutes of this task's own real session, rather than
      the first run's 5 calls clustered in the same instant, which would
      have produced a near-zero window per the windowing's own disclosed
      limitation). Windowing worked as designed: transcripts_billed_volume
      dropped from the unwindowed run's ~190.2M to ~76.4M (the ~20-minute
      slice, not the whole ~83-minute session) -- confirms the attribution
      bug QA caught is fixed. transcripts_marginal_spend for that same
      slice: ~2.16M -- ~35x smaller than billed_volume, confirming
      cache_read dominated the old figure exactly as the F-8 precedent
      predicted. Comparison against a 20,000-token ledger guess: BOTH
      still fail the 20% tolerance (vs_marginal_spend delta_pct ~99.1%,
      vs_billed_volume ~99.97%) -- a plain negative finding, not hidden.
      Unlike the first run, this is not primarily a cache-read artifact:
      the ~20-minute window contains genuine heavy subagent delegation
      (multiple large exploration/read-heavy subagent conversations), so
      ~2.16M real marginal spend in ~20 minutes is itself a large but
      plausible number a hand-typed guess would not anticipate.
      mismatch_sessions is now non-empty for this window (was clean
      unwindowed) -- an honest, disclosed side effect of windowing: a
      delegation call and its subagent file's own activity can straddle
      a window boundary, so the windowed call-count and windowed
      file-count can legitimately disagree even when the unwindowed
      counts matched.
      NEW OPEN GAP surfaced by this re-run (not asked for by QA WP-17,
      not fixed here -- flagged, not silently patched, per V-2):
      failed_direction_tokens was 96.7% of billed_volume in this window,
      because failed_direction's check is literally the string
      "<promise>COMPLETE</promise>" (waste_decomposition_heuristics.
      categories.failed_direction) -- but only "me"/engineer-class agents
      in this CSE use that exact marker; other delegated roles (qa, ta,
      doc, cw, ...) signal completion in their OWN vocabulary (e.g. qa's
      "VERDICT: APPROVED" + "ARTIFACT:" markers), never the literal
      promise string, even when they succeeded. As registered, this
      heuristic therefore likely systematically OVER-counts
      failed_direction for any session with a normal multi-agent-role
      delegation mix. Not corrected in this commit (out of the two
      findings QA WP-17 asked for); left for a future correction commit
      once an owner/QA decision is made on how to recognize per-role
      completion vocabulary.

  waste_decomposition_heuristics:
    description: >-
      phase-4-outcome-program-prd.md par.3 W-2: "waste decomposition
      (re-explaining, rework, failed-direction tokens — classify by
      session structure; document the heuristics in the register first)."
      Registered BEFORE any waste-decomposition number was computed or
      looked at (V-2). Computed per session, then summed across a
      solution's joined sessions (definitions.solution_token_accounting
      join_keys). A given subagent (sidechain) transcript file is
      attributed to AT MOST ONE of failed_direction/rework (priority order
      below); re_explaining is scoped to main-session tokens only, a
      disjoint pool, so it never double-counts against the other two.
      WINDOWED 2026-07-13 (QA WP-17 finding 1, correction commit): every
      category below now uses the SAME per-(solution,session) touch
      window as definitions.solution_token_accounting.windowing — only
      messages (and, for rework's subagent-file matching, only subagent
      files with at least one message) inside the window are considered;
      the token totals below use the billed_volume formula (see
      solution_token_accounting.methods.transcripts_billed_volume).
    categories:
      failed_direction: >-
        Full windowed token total (billed_volume formula: input+
        cache_creation+cache_read+output, messages inside the solution's
        touch window only) of any subagent (sidechain) transcript file,
        WITHIN THE WINDOW, whose LAST real assistant-role message in the
        FULL file does not contain the literal string
        "<promise>COMPLETE</promise>" — i.e. the delegated direction ended
        BLOCKED, CONFUSED, or with no completion marker at all. The
        completion-marker check itself reads the whole file (a
        structural/qualitative signal, not token-windowed); only the
        token total attributed is windowed. Highest attribution priority
        (checked first).
      rework: >-
        Full windowed token total (billed_volume formula) of a subagent
        (sidechain) transcript file, WITHIN THE WINDOW, for a
        subagent_type already delegated to EARLIER in the same session's
        windowed delegation order (2nd-or-later occurrence of that
        subagent_type; the 1st occurrence is assumed the primary attempt,
        never rework), and not already counted under failed_direction.
        Subagent files are matched to the session's windowed, ordered
        list of Agent/Task tool_use calls by chronological order (each
        file's own first record timestamp) — an approximation valid
        where call count and file count agree 1:1; a per-session
        mismatch count is reported alongside so silent misattribution
        stays visible, never hidden.
      re_explaining: >-
        Windowed token total (billed_volume formula) of every
        main-session assistant message, WITHIN THE WINDOW, that is the
        first reply to a real user turn (jsonl_utils.is_real_user_turn)
        whose own text, normalized (stripped, lowercased,
        whitespace-collapsed), exactly matches an earlier real user
        turn's normalized text in the SAME session — a proxy for "the
        person had to repeat themselves." A deliberately conservative
        floor: paraphrased (non-exact) repeats are not caught, so this
        undercounts, never overcounts.
    caveat: >-
      All three are approximations of a genuinely fuzzy concept (why was a
      token spent); they exist to make waste VISIBLE and comparable
      release over release, not to be an exact ledger. waste_total is a
      lower bound given re_explaining's exact-match floor, the
      chronological-order assumption behind rework/failed_direction
      attribution, AND the windowing limitation
      (solution_token_accounting.windowing's known-limitation note
      applies here identically — a narrow or single-instant touch window
      undercounts waste the same way it undercounts total tokens).
    source: "tools/cse-bench/collectors/economy.py"

  ladder_config_materialization:
    description: >-
      TASK-125 (W-3): the 4-config ladder's config isolation, verbatim from
      phase-4-outcome-program-prd.md par.3 W-3 ("bare = fresh dir, no
      framework files; +framework = claude-copilot install; +knowledge =
      CC_KNOWLEDGE_REPO populated vs empty tree; +integrations =
      cli-copilot on PATH with .env"). Registered BEFORE any config was
      run against a real job (V-2). Three isolation levers (CORRECTED
      same-day per QA WP-23 finding 5 — see corrections below for what
      changed and why), all verified against this machine's
      actually-installed `claude` CLI before this register entry was
      written (`claude --help`, 2026-07-13): (1) a per-run HOME override
      to a fresh, empty temp directory — the PRIMARY isolator of
      user-level CLAUDE.md/agents/skills, since Claude Code auto-discovers
      those relative to $HOME/.claude/ and this machine already has
      claude-copilot installed at the user level (`~/.claude/agents/`,
      `~/.local/bin/{tc,cc}`); (2) `--setting-sources project` on every
      rung including bare — a SECONDARY restriction on which
      settings.json-style permission/hook sources merge, kept as
      defense-in-depth, not the CLAUDE.md/agent isolator; (3) a per-rung
      PATH override (bare/+framework exclude cli-copilot's venv bin; bare
      additionally excludes tc/cc's ~/.local/bin). `+framework`
      materializes `.claude/{agents,commands,skills}/` + CLAUDE.md by
      copying directly from claude-copilot's own VERSION.json roster (the
      same files `/setup-project`'s FULL-mode flow would copy), so the
      ladder measures a job's MARGINAL cost with the framework already
      installed, not the one-time setup cost. `+framework`'s
      CC_KNOWLEDGE_REPO points at an EMPTY directory (not unset),
      isolating "knowledge content present" from "knowledge mechanism
      present."
    source: "tools/cse-bench/benches/ladder/configs.py"
    corrections: >-
      TASK-125, same-day, QA WP-23 findings 4/5 (fixed, not a rewrite of
      the design — the mechanisms above were already correct; these are
      bugs in how they were described/keyed): finding 5 — an earlier
      version of this entry (and of configs.py's own docstring) credited
      `--setting-sources project` with isolating user-level CLAUDE.md/
      agents; QA verified the actual isolator is the per-run HOME
      override (lever 1 above), corrected here so the isolation doesn't
      silently break if a future edit removes the HOME override thinking
      `--setting-sources` alone covers it. Finding 4 — workdir/HOME
      materialization was keyed on (job_id, config_name) only; `--reps >
      1` silently reused the same directory across reps with no cleanup.
      Fixed: every workdir/HOME is now keyed on (job_id, config_name, rep)
      — verified via `python3 run.py --dry-run --reps 3 --job
      job-1-bugfix --config bare` producing three fully distinct
      rep1/rep2/rep3 directory trees.
    caveat: >-
      Environment gap found while building this (recorded, not hidden):
      `/opt/homebrew/bin/copilot` (the path this repo's README and
      benches/mcp_twin/run.py name) does not exist on this machine;
      `copilot` is also a shell alias for `cd` interactively. The real,
      working entry point used for +integrations is cli-copilot's own venv
      (`cli-copilot/.venv313/bin/copilot`, verified live via --help).
      Whether an isolated HOME still resolves Anthropic auth (OAuth/
      keychain) the same way the real HOME does is UNTESTED, not asserted
      as fact; verify on one throwaway cell before a full live run.
    cost_accounting_convention: >-
      CORRECTED 2026-07-14 (a truth defect, not a formatting nit — a
      number that reads as money spent when nothing was billed): TASK-125's
      auth fix (WP-44, `_seed_home_for_auth()`) symlinks the real
      `~/Library/Keychains` and copies `~/.claude.json` into each cell's
      fresh, isolated `HOME` so `claude -p` can authenticate at all inside
      it — every ladder/cross-harness cell therefore runs under the
      OWNER'S OWN Claude Code SUBSCRIPTION, exactly like his interactive
      sessions, never a separate metered API key. `envelope.modelUsage.
      *.costUSD` / `total_cost_usd` in every cell's raw JSON is Claude
      Code's own computed LIST-PRICE-AT-METERED-RATES EQUIVALENT — the
      figure a metered account would have been billed for the same token
      volume — not an amount actually charged to anyone; `--max-budget-usd`
      is a real per-cell circuit breaker (the harness aborts a cell if this
      computed equivalent crosses the ceiling) but the ceiling it enforces
      is against the same non-billed equivalent, not a live invoice. RULE
      FOR EVERY FUTURE RUN AND EVERY FUTURE CLAIM/WP THAT CITES ONE: lead
      with TOKENS (the real, unambiguous, metering-model-independent
      resource: `usage.total_tokens` / `marginal_spend` in every cell's
      JSON); a USD figure may be reported ALONGSIDE tokens only as a
      clearly-labeled "list-price equivalent, not billed" under
      subscription auth, exactly the same discipline
      `two_harness_behavior_equivalence`'s own Codex side already applies
      (ChatGPT-subscription auth, no metered key, no dollar figure quoted
      at all) — a Claude-side dollar figure must never be quoted as if it
      were more real than that just because a number exists to quote. This
      note does not change any already-registered token count; it changes
      how the dollar figures alongside them must be read, going forward and
      retroactively across this register.
    source: "tools/cse-bench/benches/ladder/configs.py (_seed_home_for_auth); WP-44 (tc wp get 44, TASK-125's pre-flight auth fix)"

  ladder_job_pack_v1:
    description: >-
      TASK-125 (W-3): the ladder's job pack v1, per
      phase-4-outcome-program-prd.md par.3 W-3 ("3 real software jobs of
      graduated size ... candidates: an R-series fix implemented 4 ways;
      a small web utility; a data-pull-and-report task that exercises
      integrations. Pack format is pluggable"). Registered BEFORE any job
      was scored (V-2). Three jobs: job-1-bugfix (small — an R-series-
      style off-by-one fix, mechanical t_working via stdlib `unittest`,
      not pytest, since this machine's default python3 has no pytest
      importable, verified live); job-2-web-utility (medium — build a
      word-frequency CLI utility from scratch, mechanical t_working via
      an external checker diffing real output against a precomputed
      expected_output.txt); job-3-integration-report (large, exercises
      integrations — pull a service-health report via the copilot CLI,
      with an explicit, mechanically-checked honest-fallback path
      ("integrations unavailable") when the CLI is not reachable, so this
      job is reachable and t_working-passable from EVERY rung, not gated
      to +integrations alone — the ladder's O-1..O-4 deltas are what
      reveal whether +integrations actually helps, not a rigged pass/fail
      gate). Pack format is a plain, directly-importable Python module
      (job_pack.py), not a bank.yaml/rules.yaml-style file like this
      program's other benches: this machine's default python3 has no
      importable PyYAML (verified live), and a job pack's nested shape
      (per-job acceptance-check specs, fixture dirs) would need a bigger
      vendored parser than knowledge_qa/voice_lint's flat-row parsers
      already carry — "pack format is pluggable" is satisfied by
      run.py's --job/--config selectors reading this module, not by a
      file-format promise.
    source: "tools/cse-bench/benches/ladder/job_pack.py"

  ladder_job_pack_v2:
    description: >-
      TASK-142 (W-3b), superseding ladder_job_pack_v1: QA WP-76
      (adversarial verification of the first live ladder run,
      20260714T135253Z) proved v1 was an instrument that could not detect
      a framework advantage even if one existed — job-3's own check.py
      docstring admitted it "never asks did it reach real service data,"
      and job-1/job-2 required zero org knowledge or live integration
      data to solve correctly from ANY rung. v1's 12/12 t_working tie
      across all rungs was therefore not evidence of "no advantage"; it
      was evidence of an instrument with no discriminating power on that
      axis, by construction — see ladder-job-pack-v1-could-not-discriminate
      below. Registered BEFORE the v2 scored run's aggregate numbers were
      examined (V-2) — 6 throwaway pipeline-verification cells (job-2 x
      {bare, knowledge}, job-3 x {bare, integrations}, job-4 x {bare,
      framework}), written to a scratch out-dir never under output/, were
      run first to confirm the mechanism itself works, matching this
      bench's own established precedent (ladder_config_materialization's
      "verify on one throwaway cell before a full live run" caveat) — not
      a violation of pre-registration, since only the DESIGN is being
      registered here, and the scored 4x4x3 matrix's own aggregate had not
      been looked at when this text was written.

      Four jobs, one CONTROL + three DISCRIMINATING (a discriminating
      job's correct answer must be UNREACHABLE from a lower rung):

      - job-1-bugfix (CONTROL, unchanged from v1, small): any rung can
        solve it — a rung's failure to beat bare here is itself a
        meaningful null result, not noise, since it needs no knowledge/
        integration/decomposition advantage.
      - job-2-house-voice (KNOWLEDGE-discriminating, NEW, medium):
        correct output requires knowledge-copilot's real
        01-company/02-voice/06-glossary.md (Anti-Glossary: consultant/
        advisor/vendor/stakeholder/leverage/synergy/"best practice"/
        "touch base"/"circle back"/"deep dive" banned; Core Terms:
        "Copilot"/tension/breakthrough/co-creation/"struggling moment" as
        private substitutes) — verified present in the real repo and
        verified NOT inferable: this project's own CLAUDE.md (materialized
        for +framework too, with an EMPTY knowledge tree) only POINTS at
        01-company/02-voice/, it never states the banned/required terms
        itself, so +framework cannot pass by reading CLAUDE.md alone.
        fixtures/job-2-house-voice/check.py mechanically requires BOTH
        zero hits on the banned-term denylist AND >=1 hit on the private
        substitute-term set — avoiding jargon alone (satisfiable by luck)
        is not sufficient; positive evidence of the private vocabulary is
        required, closing the fabrication gap the same way (b) below
        does. Live-verified during pipeline smoke-testing: bare produced
        an honest "no house guidance found, using my own judgment"
        paragraph (t_working=False, zero private terms, as expected);
        knowledge produced a paragraph using the real glossary's terms
        (t_working=True).
      - job-3-integration-report (INTEGRATION-discriminating, brief
        mostly unchanged from v1, check.py REWRITTEN): now independently
        re-fetches real service health via `copilot --json health` by
        ABSOLUTE path + cli-copilot's own .env, NEVER through the
        config-under-test's PATH, and mechanically asserts the
        deliverable's per-service claims match ground truth exactly
        (name-by-name, status-by-status), not merely that a
        well-formed-looking line exists (v1's exact gap). A rung whose own
        env lacks `copilot` on PATH (bare/framework/knowledge) must use
        the honest "integrations unavailable" fallback — a populated
        "Services: N healthy" claim from such a rung now FAILS as
        fabrication by construction, regardless of whether N happens to
        match. A rung with `copilot` reachable (+integrations) must
        report real, exactly-matching data — falling back to "unavailable"
        despite having the capability now also FAILS. Live-verified
        during smoke-testing against this machine's real, currently-live
        `copilot --json health` (fireflies/reddit/metabase already cut
        per DEC-5/TASK-122; 20 services registered, 15 healthy / 4
        unhealthy (n8n, brevo, uspto, infisical -- auth/config gaps) / 1
        skipped (discord) at smoke-test time): +integrations produced a
        report whose 15-healthy claim and full 20-service breakdown
        matched live ground truth exactly (PASS); bare produced the
        honest unavailable fallback (PASS); a synthetic fabricated
        "Services: 99 healthy" and a synthetic single-wrong-status report
        were both mechanically caught (FAIL) in dry unit testing of
        check.py itself before any model call.
      - job-4-toolkit (FRAMEWORK-discriminating, NEW, large): toolkit.py
        must implement 6 independent, equally-weighted pure functions
        (is_prime, reverse_words, flatten, run_length_encode,
        most_common_word, caesar_cipher); fixtures/job-4-toolkit/
        test_toolkit.py (protected, 17 assertions across the 6) requires
        ALL 6 to pass at once — a completeness-across-parts bar sized so
        decomposition/systematic checklisting should matter, not a task a
        single free-write reliably nails end to end. t_working is
        strictly all-or-nothing (unittest's own exit code); per-function
        pass/fail is visible in the audit trail's acceptance stdout for
        richer post-hoc completeness analysis even when t_working is
        False.

      Fabrication resistance, closing the exact gap QA WP-76 named as the
      only prior guard (the rubric's error_help floor, human-judged only):
      every non-control job's check.py now MECHANICALLY verifies its
      discriminating property (job-2: banned/required term sets; job-3:
      service-by-service ground-truth match; job-4: full 17-assertion
      pass), not merely a well-formed shape.
    source: "tools/cse-bench/benches/ladder/job_pack.py"

  ladder-job-pack-v1-could-not-discriminate:
    description: >-
      Finding, not a defect fix: v1's null t_working result (12/12 tie
      across all 4 rungs, first live run 20260714T135253Z) cannot be read
      as "no framework advantage exists" because the instrument had no
      power to detect one on that axis — job-1/job-2 required zero org
      knowledge or live integration data to solve from ANY rung, and
      job-3's own check.py docstring stated outright it "never asks did
      it reach real service data." A null result from an instrument that
      cannot detect a positive is not evidence of absence. Recorded here,
      per this program's own "null and negative results are findings"
      convention (phase-4-outcome-program-prd.md par.5.4), as a finding
      about the FIRST INSTRUMENT, separate from ladder_job_pack_v2 (the
      fix) and from whatever v2's own scored run finds (a separate,
      later fact).
    source: "QA WP-76 (tc wp get 76), .copilot/wp/76.md Q4"

  ladder_o4_residual_ablation:
    description: >-
      TASK-148 (W-3c, parent TASK-125), closing ladder-o4-scaffold-
      attribution-wp79-closed's own named next step. Registered BEFORE any
      of the three new rungs was run against a real job (V-2). WP-79/WP-81
      isolated CLAUDE.md (40.9% of the mean 3003-token turn-1 cache_creation
      premium) and the 13-agent roster (35.7%) in situ, at the SAME model
      (sonnet) and SAME real job pack as the scored ladder cells — combined
      76.5% attributed, 23.5% (~704 tokens/job, range 14.5%-29.9% across the
      4 jobs) left as an explicitly-named, not-rounded-away residual. That
      claim's own evidence text named the untested remainder: ".claude/
      commands/, templates/skills/, .mcp.json as their own isolated rungs
      -- not done here."

      DESIGN (verbatim method match, no confound reintroduced): three new
      rungs, each identical to `+framework` minus exactly ONE component,
      via `configs.py`'s `_copy_framework_files(include_commands=,
      include_skills=, include_mcp=)`:
      - `framework_minus_commands` — omits `.claude/commands/` (7 project
        slash commands from claude-copilot's VERSION.json projectCommands).
      - `framework_minus_skills` — omits `.claude/skills/` (the full
        templates/skills/ tree, 5 skills, ~25.6KB of SKILL.md content).
      - `framework_minus_mcp` — omits `.mcp.json` entirely (note:
        `+framework`'s own `.mcp.json` is itself a no-op placeholder,
        `{"mcpServers":{}}`, zero servers configured — this rung's
        pre-registered null hypothesis is that its own in-situ cost is ~0
        tokens; a confirmed null is itself a real, informative result that
        RULES .mcp.json OUT of the residual, not a wasted rung).
      Verified before writing these three rungs, not assumed: re-reading
      `_copy_framework_files()` line by line confirms it places exactly
      five things total (agents, commands, skills, CLAUDE.md, .mcp.json) —
      no settings.json, no hooks output, no other file. These three rungs
      plus the two WP-79 rungs (`framework_minus_claudemd`,
      `framework_minus_agents`) are therefore JOINTLY EXHAUSTIVE of every
      component `materialize_framework()` places — if a residual still
      survives after all five are measured, it cannot be attributed to
      "an untested scaffold piece" and must be named as something else
      (most plausibly, per WP-79's own reconciliation of the prior
      haiku/trivial-prompt confound, something intrinsic to how the real
      model processes a real multi-turn coding session's first turn — e.g.
      tool-schema serialization, the model's own system-prompt scaffolding,
      or a genuine cache-boundary/rounding effect — not silently rounded
      away either way).

      METHOD PARITY WITH WP-79/WP-81 (the explicit instruction this
      pre-registration exists to satisfy): same model (sonnet, recorded
      per-cell via `record["model"]`), same job pack (`ladder_job_pack_v2`,
      all 4 jobs — job-1-bugfix, job-2-house-voice, job-3-integration-
      report, job-4-toolkit), same instrument (`run.py`'s
      `extract_turn_breakdown()`, turn-1 cache_creation isolated from later
      turns via the real session transcript, message.id-deduped), same
      isolation levers (per-run HOME override, `--setting-sources project`,
      per-config PATH — `ladder_config_materialization`). NOT switching
      model or prompt type — that exact confound (haiku/trivial-prompt vs
      sonnet/real-task) is what produced WP-79's own disagreement with the
      ladder in the first place and must not recur.

      REP COUNT AND BUDGET (stated before running, per this program's cost-
      discipline convention): 3 reps x 4 jobs x 3 new rungs = 36 cells —
      the SAME rep count (3) and SAME job set (4) the WP-79/WP-81 ablation
      used for `framework_minus_claudemd`/`framework_minus_agents` (24
      cells total there), chosen for direct comparability, not picked
      fresh; that prior 3-rep design already produced deltas (1228 and 1071
      tokens against a bare's own turn-1 noise floor visibly smaller than
      either delta — see WP-79's own reconciliation table) large enough to
      read as signal, not noise, at n=3, so 3 reps is the minimum this
      program has already shown works for a scaffold-component ablation of
      this kind; going lower would break comparability with the two
      existing rungs without a demonstrated need. Cost ceiling: this
      machine runs under the owner's Claude Code SUBSCRIPTION (`_seed_home_
      for_auth()`), never a metered key — any dollar figure this run
      produces is Claude Code's own computed LIST-PRICE-AT-METERED-RATES
      EQUIVALENT, not a charge (`ladder_config_materialization.
      cost_accounting_convention`); based on the WP-79/81 ablation's own
      observed rate (~$0.148-$0.157/cell, 24 cells / $3.657), this run's
      36 cells are budgeted at approximately $5.3-$5.7 list-price
      equivalent, well inside `run.py`'s existing native per-call ceilings
      (`--timeout` 900s, `--max-budget-usd` $3.00/cell).

      WHAT "FULL ATTRIBUTION" WOULD MEAN, pre-committed before seeing a
      single number: the five ablated components' own in-situ shares
      (CLAUDE.md 40.9%, agents 35.7%, plus this run's three new shares)
      summing to a total attributed percentage. If that sum reaches
      approximately 100% (within measurement noise) of the mean turn-1
      premium, the token story is FULLY PROVEN and closeable as such. If a
      residual still survives after all five components are measured, this
      claim's status must record that residual's exact size and state
      plainly what it is NOT (not an untested scaffold piece, since none
      remain) rather than asserting what it IS without evidence — matching
      WP-79's own discipline of naming what a gap is NOT before speculating
      on what it might be.
    source: "tools/cse-bench/benches/ladder/configs.py (framework_minus_{commands,skills,mcp})"

  ladder_mlp_rubric:
    description: >-
      TASK-125 (W-3): the written MLP expectation rubric that scores
      t_loveable, per phase-4-outcome-program-prd.md par.3 W-3
      ("guided experience, sensible defaults, error help, polish — judged
      blind, exemplar-anchored, deterministic checks where possible").
      Registered BEFORE any deliverable was scored (V-2). Each of the 4
      dimensions is scored 0-3 against a written exemplar anchor per
      level (not a bare good/bad scale); t_loveable = the first cell
      scoring >=2 on ALL 4 dimensions, not an averaged total (mirrors "MLP
      not MVP" literally). One hard floor set mechanically rather than
      left to judgment: job-3's error-help dimension scores 0 outright if
      the deliverable fabricates service data instead of honestly
      reporting integrations-unavailable. Blind judging protocol: the
      judge (human or, once ratified, a model) sees the brief, the
      deliverable, and the rubric — never the config name, ladder rung,
      elapsed time, or token count; enforced by construction
      (build_blind_judge_prompt() has no config-name parameter at all,
      not merely an instruction not to reveal one).
    source: "tools/cse-bench/benches/ladder/rubric.md"
    note: >-
      STATUS: DRAFT, NOT RATIFIED. Per phase-4-handoff.md §6 row 6 ("the
      MLP expectation rubric needs owner sign-off before first scoring —
      it operationalizes his bar"), this rubric requires owner ratification
      before ANY live t_loveable scoring — see
      docs/40-initiatives/01-cse-auditability/decisions/DEC-6-mlp-rubric-signoff.md.
      This is enforced MECHANICALLY, not just by convention: run.py's
      check_signoff() requires DEC-6's header to contain EXACTLY ONE
      "Status:" field whose value starts with "**ratified**", and refuses
      any non-dry-run invocation otherwise.
    corrections: >-
      TASK-125, same-day, QA WP-23 finding 2 (fixed): an earlier version
      of check_signoff() substring-searched DEC-6's whole header block for
      "Status: **ratified**" and could false-positive two ways — (a) an
      unrelated second "Status:" line in the header, (b) the marker hidden
      inside an HTML comment. Both
      closed by construction: HTML comments are stripped before matching,
      matching is per single physical line (never spanning a line break —
      the original regex's `\s*` could match a literal newline), and the
      gate fails CLOSED (not ratified) whenever it finds zero or more than
      one "Status:" field rather than accepting any match anywhere in the
      block. Regression tests for both bypasses (plus the original
      not-ratified/ratified cases) added:
      tools/cse-bench/benches/ladder/test_signoff_gate.py, 7/7 passing.

  value_density:
    description: >-
      TASK-128 (W-6): operationalizes the removal rule (phase-4-outcome-
      program-prd.md §0.5 / §2, "surface that does not move an outcome
      bar within its review window is a removal candidate... nominations
      are mechanical; deletions are the owner's"). Per CSE surface
      (agent, cli_service_group, knowledge_area, skill), density is
      NOT a continuous ratio for this first review -- several evidence
      channels are genuinely unavailable this early (no CLI usage
      ledger enabled anywhere; no skill-invocation event ledger; C-3's
      hook rollout still staged to claude-copilot only), so a real
      per-unit-time rate is not honestly computable yet. Instead this
      first review computes, per surface, two binary facts: whether
      usage_evidence is a MEASURED value (and what it is) or genuinely
      unmeasured (null), and whether outcome_trace is a MEASURED value
      or unmeasured (null). Registered BEFORE the collector that
      computes these numbers was written (V-2) -- collectors/value_density.py
      implements exactly this definition, joining already-computed
      collector output rather than re-deriving raw evidence a second
      way. A future review, once the CLI usage ledger and a broader
      hook rollout are both live, should upgrade this to a real
      per-unit-time density and register that change here rather than
      silently reinterpreting this entry.
    review_window: >-
      The full corpus available on this machine as of the first review
      (2026-07-13): the entire archive-UNION-live session transcript
      corpus (collectors/transcripts.py's DEFAULT_ARCHIVE_ROOT/
      DEFAULT_LIVE_ROOT merge) for agent usage signals, and the full
      knowledge-copilot corpus for the knowledge cross-reference check.
      No periodic (e.g. rolling-90-day) cadence has been ratified yet --
      there is one author and one corpus to date, so "the whole history"
      and "the current review window" are the same thing. The NEXT
      review (once W-4's external pilots and/or a second review cycle
      exist) should register a real rolling window here instead of
      reusing "all time" by default.
    usage_evidence_by_surface:
      agent: >-
        Count of subagent invocations attributed to that agent
        (attributionAgent field) across the review-window transcript
        corpus, exactly as collectors/framework_soul.py's
        agent_frugality.by_agent_type already computes (median_iqr's `n`
        field per agent) -- reused via output/framework_soul-latest.json,
        never recomputed a second way.
      cli_service_group: >-
        NULL for all 22 registered CLI service groups. CLI Copilot ships
        an opt-in usage ledger (COPILOT_USAGE_LOG,
        copilot_cli/shared/usage_ledger.py) that has never been enabled
        on this machine (~/.copilot-cli/usage.jsonl does not exist --
        verified directly, matching DEC-5's own finding). The only
        corpus-wide signal (collectors/transcripts.py's cli_invocation
        metric) is not broken out per service. This is an honest null,
        not a computed zero -- absence of instrumentation, not evidence
        of non-use.
      knowledge_area: >-
        % of a top-level knowledge-copilot/ directory's files that are
        referenced (by full relative path or, failing that, bare
        basename) anywhere else in the knowledge corpus or its manifest
        -- collectors/knowledge_soul.py's orphan_rate metric (metric 5),
        re-grouped by top-level directory rather than recomputed. This
        is DELIBERATELY the "referenced by other knowledge content"
        signal, not "read by an agent in a live session" -- the latter
        (knowledge_never_read_denominator, above) is only computed as an
        ecosystem-wide aggregate today, not sliceable per top-level
        directory without re-deriving the corpus scan a second way (the
        exact drift risk tools/cse-bench/README.md's "no metric ... may
        be reported without a claims.yaml entry" rule warns against). Per
        knowledge_soul.py's own orphan_rate docstring this is a FLOOR on
        true orphan rate (a permissive basename fallback), not a point
        measurement -- carried through unchanged here.
      skill: >-
        NULL for all 37 .claude/skills/**/SKILL.md leaf skills. Skill
        invocation is not tracked by any event ledger anywhere in the
        ecosystem yet (the same C-3 hook rollout that would carry this
        signal is staged to claude-copilot only, per phase-4-handoff.md
        TASK-103). Honest null, not a computed zero.
    outcome_trace_by_surface:
      agent: >-
        Whether the agent has a golden-set eval AND that eval currently
        passes (output/evals-latest.json's per_agent[<agent>].overall_pass).
        An agent with NO eval at all (15 of 16 today, per claim
        agent-eval-coverage) is trace=null (unmeasured), never
        trace=false (measured-and-failing) -- never scored is a
        different finding than scored-and-found-wanting.
      cli_service_group: >-
        Whether the service passes cli-copilot's own SOUL §6 conformance
        scorecard (collectors/cli_soul.py) with zero gaps. A
        conformance/quality-bar proxy, not a literal outcome-bar (O-1..
        O-9) trace -- no outcome bar is wired to any individual CLI
        service yet; labeled as a proxy everywhere it is reported.
      knowledge_area: >-
        NULL for every area -- no outcome bar is wired to any specific
        knowledge area yet (the knowledge_qa bench's +98pp accuracy
        result is corpus-wide across 2 product dossiers, not a per-area
        outcome trace).
      skill: >-
        NULL for every skill -- no outcome bar or eval is wired to any
        individual skill yet.
    nomination_rule: >-
      A surface is a MECHANICAL removal nomination this review iff its
      usage_evidence is a MEASURED zero (not null/unavailable) AND its
      outcome_trace is anything other than a measured true (i.e. a
      measured false, or unmeasured/null). A surface whose usage_evidence
      is null is NEVER nominated on that basis alone: absence of
      instrumentation is not evidence of non-use, and nominating on
      missing data would violate this program's own honesty rule
      (phase-4-handoff.md §5.4). This is deliberately a HIGHER bar than
      "no evidence of use" -- it is "measured evidence of no use."
    threshold: >-
      Binary (measured-zero-usage AND not-measured-true-outcome) for
      agent and knowledge_area, the only two surfaces with a real
      measured usage_evidence channel today -- see the description field
      above for why a continuous per-unit-time cutoff is not yet honestly
      computable. knowledge_area additionally requires >=10 scope files
      (MIN_KNOWLEDGE_AREA_FILES; the orphan-rate proxy is too noisy on a
      handful of files) and an orphan rate >=50% (a literal majority of
      the area's files unreferenced anywhere else) -- a natural,
      non-arbitrary bright line chosen independently of any specific
      area's number, not fitted post-hoc to produce a particular result.
      cli_service_group and skill usage_evidence is null ecosystem-wide
      (see usage_evidence_by_surface above), so NO cli_service_group or
      skill surface is mechanically nominated this review on usage
      grounds -- the CLI services with an actual STRUCTURAL-ABSENCE
      finding (fireflies, reddit, metabase, method) are already covered
      by DEC-5 and this review defers to that memo rather than
      re-deriving the same finding.
    source: "tools/cse-bench/collectors/value_density.py"

  outcome_transfer_tolerance:
    description: >-
      O-8 (Transfer Coefficient)'s pre-registered pass/fail tolerance: what
      "within a stated tolerance of the owner's numbers" (outcome_bars'
      O-8 definition) means precisely, for at least 2 non-author pilots
      each attempting O-1..O-5 unassisted. Registered 2026-07-14 BEFORE any
      pilot has been recruited and before any pilot data exists (V-2) —
      this is the only reason picking a number is defensible right now:
      nobody has seen a result this number could be bent toward. Full
      spec drafted in
      docs/40-initiatives/01-cse-auditability/phases/phase-4-w4-external-pilot-kit.md
      §2 ("O-8 tolerance — PROPOSED, owner ratification pending").
    status: "proposed — owner ratification pending"
    ratio_bars: >-
      O-1 (TTFLS), O-3 (Speed), O-4 (Token efficiency), and O-2's
      sessions-to-done all use the SAME single ratio: pilot's figure <=
      2.0x the author's size-matched comparable solution (lower/faster/
      fewer-tokens always clears). Rationale for 2.0x: the loosest
      widely-defensible "same order of magnitude" bound — tight enough to
      fail a visibly-struggling pilot (3x+), loose enough not to fail
      ordinary first-time-tool ramp-up variance trivially at a 1.0x
      (exact-match) bar, which would tell us nothing. One consistent
      multiplier across all four ratio bars, deliberately, rather than
      four separately-tuned numbers with no data to justify the
      differences.
    flat_band_bars: >-
      O-2's post-ship fix-vs-feature ratio uses a flat 20-percentage-point
      band (pilot's fix-fraction must not exceed the author's fix-fraction
      by more than 20pp, absolute) instead of a ratio — a multiplicative
      bound is degenerate near a fix-fraction close to zero (e.g. an
      author fix-fraction of 0.05 would force a pilot ceiling of 0.10
      under a 2.0x rule, far tighter than intended).
    binary_bars: >-
      O-5 (Survival) is binary, not a ratio: small-N pilot data (2-3
      people) makes a percentage meaningless. O-5 clears for a pilot iff
      their solution both shipped AND was confirmed still in active use
      at the SAME N-weeks checkpoint used for the author's own O-5
      measurement. No partial credit.
    matching_rule: >-
      "Author's own most comparable solution" is matched by tokens_total
      order of magnitude (same decade band, e.g. both in the 10k-100k
      token range) — the one sizing dimension every tc solution record is
      guaranteed to carry via the ledger. If no author solution in a
      comparable size band exists yet when a pilot's data is ready to
      score, that bar is not-yet-measurable for that pilot (mirrors O-7's
      own not-yet-measured convention) — never a fabricated ratio against
      a mismatched solution.
    aggregate_rule: >-
      O-8 requires ALL FIVE of O-1..O-5 to clear their own tolerance, for
      at least 2 of the >=2 required pilots. Per-pilot, per-bar pass/fail
      is reported in full in each pilot's own report regardless of the
      aggregate outcome — a pilot clearing 4 of 5 bars is a real,
      informative partial result, not noise to discard.
    caveat: >-
      V-2-legitimate ONLY because zero pilot data exists on this machine
      or anywhere in this program as of registration — the moment any
      pilot's numbers are looked at, this tolerance can no longer be
      chosen or revised without breaking pre-registration. Marked
      owner-overridable before the first pilot: the owner may accept this
      proposal as-is, edit it, or replace it outright before W-4's first
      pilot's data is scored; once scored, changing it becomes a
      post-hoc adjustment, not a pre-registration.
    source: "docs/40-initiatives/01-cse-auditability/phases/phase-4-w4-external-pilot-kit.md §2"

  claim_sweep:
    description: >-
      TASK-137 (t2-no-claim-outlives-its-check): the CSE-wide claim sweep
      the README's Phase-0 vision named and this register's own SCOPE NOTE
      said was "not yet" built. Registered BEFORE the sweep was run for a
      number (V-2) — this entry defines what the sweep counts, how it
      decides BACKED vs UNBACKED, and states its precision honestly, so the
      mechanism cannot be tuned after seeing the result.
    verifiable_assertion: >-
      A "verifiable assertion" is a quantified or mechanism-guarantee claim
      matched by one of seven regex categories over a curated set of each
      product's self-description docs (SCAN_TARGETS in claim_sweep.py —
      README.md, SOUL.md, PURPOSE.md/ECOSYSTEM.md, and a small number of
      F-18-cited architecture docs; NOT knowledge-copilot's ~900-file
      content corpus, and NOT CLAUDE.md files — see caveat below):
      PERCENT (`\d+%`), N_OF_M (`\d+ of \d+`), COUNT_UNIT (`\d+ agents/
      services/files/...`), FRACTION (`\d+/\d+`), VERSION (`v?\d+\.\d+`,
      excluding the SOUL.md template's own document-changelog lines —
      "Revised to vX.Y", "STATUS: RATIFIED", the Changelog table — which
      describe the DOCUMENT's version, not a product claim), RATIO_X
      (`\d+x`), and MECHANISM_CLAIM (automatically/ensures/guarantees).
      Text inside fenced code blocks and inline code spans is excluded
      (overwhelmingly commands/paths, not prose).
    backing_convention: >-
      An assertion is BACKED if an `<!-- claim-check: <id> -->` HTML
      comment appears on the same line, the line before, or the line
      after, AND <id> resolves to a real entry under this file's `claims:`
      list. An annotation whose id does NOT resolve is DANGLING (reported
      separately, never silently treated as backed). Chosen over trying to
      parse English more cleverly: the annotation makes backing explicit
      and cheap for a doc author to add, and cheap for the sweep to check,
      rather than the tool guessing which registered claim a sentence
      means. This is the same shape as knowledge-copilot's
      scripts/check-crosslinks.py baseline/regression convention, applied
      to prose assertions instead of markdown links.
    baseline: >-
      tools/cse-bench/claim-sweep-baseline.json — a regression gate, not a
      zero-unbacked gate (mirrors crosslinks-baseline.json exactly): every
      UNBACKED/DANGLING assertion found at baseline-authoring time is
      recorded (repo, file, category, matched text — a sha256 key, no line
      number, so the baseline survives unrelated line-shift edits, same
      tradeoff crosslinks-baseline.json makes). `claim_sweep.py --check`
      fails ONLY on a NEW unbacked assertion not already in the baseline —
      the ratchet only tightens. `--update-baseline` is the explicit,
      reviewed "accept this backlog" action, never implicit.
    precision_caveat: >-
      Stated plainly, not buried: this is a regex/heuristic scanner over a
      CURATED doc list, not a general claim-extraction engine. KNOWN FALSE
      POSITIVES: a genuinely non-claim decimal or count noun in ordinary
      prose (e.g. a Python version requirement, a section number) matches
      a category and is reported UNBACKED even though it isn't really a
      product claim needing a mechanism — these get baselined, not
      specially suppressed, so the baseline is an honest (if slightly
      noisy) upper bound. KNOWN FALSE NEGATIVES: any assertion outside
      SCAN_TARGETS (the ~900 knowledge-copilot content files, CLAUDE.md
      files, and every doc not explicitly listed) is invisible to this
      tool; any assertion phrased without a matched pattern (e.g. spelled-
      out numbers, comparative claims with no digit) is invisible; text
      inside inline code spans is never scanned. First real run
      (2026-07-14, see claim t2-no-claim-outlives-its-check for the full
      before/after numbers): 92 verifiable assertions
      across 4 of 5 scanned repos (codex-copilot's curated docs had zero
      after the changelog exclusion), 0 backed (the annotation convention
      is new — nothing in any product doc used it before this task), 92
      unbacked, 0 dangling. This is the honest starting backlog this
      register's V-2 discipline requires being stated, not hidden.
    source: "tools/cse-bench/claim_sweep.py"

  upkeep_tax:
    description: >-
      O-9 (Upkeep Tax, outcome_bars): the share of ecosystem effort spent
      MAINTAINING the CSE itself -- registry, links, freshness, parity
      sweeps, claim upkeep, framework/knowledge/CLI hygiene -- rather
      than producing solutions, netted against the value delivered.
      "What counts as maintenance" is an editorial judgment call, made
      explicitly per task or per PRD via `tc upkeep tag-task` / `tc
      upkeep tag-prd` (claude-copilot tools/tc/, tc.services.upkeep) --
      NEVER inferred automatically from task text, title keywords, or
      any heuristic this register does not name. Registered BEFORE any
      `tc upkeep tag-*` command had been run anywhere (V-2) -- this
      methodology was written from the SHAPE of tc's existing task/PRD
      schema and collectors/economy.py's existing token formulas, not
      from looking at what any repo's number would be. Two independent
      methods are registered, NEVER conflated into one number:
    methods:
      task_count_heuristic: >-
        RETROSPECTIVE. upkeep_tasks / total_tasks in a repo's Task
        Copilot store (`tasks` table), where upkeep_tasks is every task
        with a row in the additive `upkeep_tags` table (claude-copilot
        tools/tc/src/tc/db/schema.py UPKEEP_SCHEMA_SQL). Populated two
        ways: `tc upkeep tag-task <id>` (one task, explicit,
        method='explicit') or `tc upkeep tag-prd <id>` (bulk-tags EVERY
        task already filed under that PRD in one call,
        method='prd-heuristic', and never overwrites an explicit tag --
        tc.services.upkeep.tag_prd). The PRD-level flag is what makes
        this method retrospective: flagging a PRD today reclassifies
        tasks that were created -- and completed -- before this feature
        existed, so the tax is computable from task/PRD data that
        ALREADY EXISTS, not only from sessions tagged from now on.
        Honest limitation, stated plainly: this is a share of TASK
        COUNT, not of time or tokens (the PRD's literal unit) -- a
        proxy, not an exact accounting, because tasks predating this
        feature carry no session-id or token linkage a collector could
        reconstruct retroactively. Denominator is ALL tasks regardless
        of status (pending/in_progress/completed/blocked/cancelled):
        completed-only would undercount genuine upkeep effort spent on
        work that was blocked, superseded, or abandoned -- still real
        effort.
      session_token_exact: >-
        PROSPECTIVE (from the moment this feature exists onward) and
        token-exact. `tc upkeep tag-task`, when run inside a live Claude
        Code session (CLAUDE_CODE_SESSION_ID set), appends a row to the
        additive `upkeep_sessions` table -- the same session-touch
        mechanism solution_token_accounting's `ledger` method uses
        (tc.services.solutions._record_session_touch), mirrored verbatim
        for upkeep by tc.services.upkeep._record_upkeep_session_touch.
        cse-bench's upkeep collector (tools/cse-bench/collectors/
        upkeep.py) joins every DISTINCT tagged session_id to that
        session's own transcript (main + subagent files) and sums
        tokens using the EXACT SAME formulas solution_token_accounting
        registers (methods.transcripts_marginal_spend /
        .transcripts_billed_volume, reused directly from
        collectors/economy.py's _billed_volume/_marginal_spend, not
        re-implemented): marginal_spend (input + cache_creation +
        output, cache_read EXCLUDED) is PRIMARY, billed_volume is
        secondary/transparency-only -- the same F-8-class conflation
        correction this register already applied to W-2 (cumulative-
        summing cache_read misattributes a turn's full cache re-read as
        new work). UNWINDOWED, unlike W-2's per-solution join: one `tc
        upkeep tag-task` call is a single whole-session judgment ("this
        session was upkeep"), not a shared/intermittent touch across
        several ledger entries, so there is no shared-session ambiguity
        to window away -- the collector sums each tagged session's FULL
        transcript.
    netting_rule: >-
      task_count_heuristic nets against ALL tracked task effort in the
      same store (upkeep_tasks / total_tasks) -- it does not reference
      solutions at all, since most stores have none yet (see
      solution_token_accounting; W-1 adoption is early). session_token_exact
      nets against the Outcome Ledger directly: upkeep_tax_ratio_marginal_spend
      = upkeep_tokens_marginal_spend / (upkeep_tokens_marginal_spend +
      outcome_tokens_marginal_spend), where outcome_tokens_marginal_spend
      is the SAME whole-session marginal-spend sum, computed identically,
      over solution_sessions' own distinct session ids (the Outcome
      Ledger's W-2 session touches) -- symmetric, apples-to-apples, never
      comparing a windowed figure (W-2's economy collector) against an
      unwindowed one (this collector) on the same side of a ratio. A
      session_id present in BOTH upkeep_sessions and solution_sessions
      (tagged upkeep AND touched a solution) is ambiguous and is
      EXCLUDED from both sides, reported separately as
      overlap_sessions_excluded -- never silently assigned to either.
    threshold: >-
      None registered. Unlike O-4 (Token Efficiency), which the PRD
      gives an explicit 60/90% band, the PRD's O-9 text names no target
      number -- O-9 is a measurement bar, not a pass/fail bound. A high
      upkeep tax is a finding to act on (via the removal rule, W-6), not
      a defined failure of this claim.
    caveat: >-
      Editorial judgment calls this register does NOT make on anyone's
      behalf: which PRDs/tasks in any given repo count as "maintenance"
      is left to whoever runs `tc upkeep tag-task` / `tag-prd` in that
      repo, and is disclosed per-repo in metrics.per_repo[].by_kind /
      .prds_flagged / .by_method, never hidden inside a single
      ecosystem-wide number. A repo where `tc upkeep` has never run
      reports task_count_share: null (upkeep_instrumentation_present:
      false) -- the honest pre-adoption state, not a fabricated 0%.
    source: >-
      tools/cse-bench/collectors/upkeep.py; claude-copilot
      tools/tc/src/tc/services/upkeep.py; claude-copilot
      tools/tc/src/tc/db/schema.py (UPKEEP_SCHEMA_SQL)

  delegation_capable_harness_mode:
    description: >-
      A ladder rung/mode (`tools/cse-bench/benches/ladder/
      delegation_harness.py`) in which the job brief handed to `claude -p`
      is prefixed with the fixed, job-agnostic string `/protocol ` -- the
      project slash command `configs.py`'s `_copy_framework_files()`/
      `materialize_framework()` already copies into every framework-rung
      workdir from claude-copilot's own `VERSION.json` roster (the
      framework's own real routing entry point, not a benchmark-specific
      instruction). Delegation is counted by structurally parsing the main
      session transcript's `message.content[]` for `type=="tool_use"`
      blocks whose `name` is in `{"Agent", "Task"}` (the tool is named
      "Agent" in this machine's installed Claude Code CLI -- verified
      live, not assumed; "Task" is kept for portability to other CLI
      versions/configurations, matching `tools/cse-audit/
      session_metrics.py`'s own `AGENT_TOOL_NAMES` set). Subagent token
      spend is read from each delegation's sibling `<sessionId>/
      subagents/agent-*.jsonl` file(s), summed and reported SEPARATELY
      from main-session spend, never conflated into one figure.
    source: "tools/cse-bench/benches/ladder/delegation_harness.py; docs/40-initiatives/01-cse-auditability/phases/phase-4-delegation-capable-harness.md"
    caveat: >-
      Job complexity/turn-count alone, without the `/protocol` prefix, was
      separately verified NOT to induce delegation (a 12-turn, 3-domain
      brief with no prefix produced zero delegations) -- this mode's
      mechanism is specifically the routing entry point, not merely "a
      harder job" or "more turns." A generic/fallback `subagent_type`
      (`"claude"`) can still be invoked even when `.claude/agents/` is
      absent (the `framework_minus_agents` rung) -- delegation firing is
      therefore NOT itself proof that named custom agents were available;
      each cell's own `delegated_agent_types` list must be read, not just
      `n_agent_delegations > 0` (observed live: `framework_minus_agents`
      delegated once on job-4-toolkit, to `subagent_type: "claude"`, a
      built-in fallback identity, not a project-defined agent).

