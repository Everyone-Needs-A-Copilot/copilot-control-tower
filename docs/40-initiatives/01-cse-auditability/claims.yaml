      dollars only as a labeled equivalent). Most likely explanation for
      the ~$1.39/~11% (list-price-equivalent) gap, per QA: the 6 throwaway
      pipeline-verification cells the 4dbfd44 pre-registration commit
      message itself describes ("only 6 throwaway pipeline-verification
      cells... never written to output/, were used to confirm the
