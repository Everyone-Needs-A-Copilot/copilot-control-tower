  - id: agent-layer-marginal-value-underpowered
    statement: "On job_pack.py v2's 4-job discriminating pack, run under the delegation-capable mode (both framework and framework_minus_agents rungs, /protocol-prefixed briefs, reps=1), mechanical t_working outcome is IDENTICAL between the two rungs on every job (4/4 no_effect) -- including the 2 jobs where framework genuinely delegated -- but n=4 paired job-cells with 0 discordant pairs is statistically underpowered to establish OR rule out a real effect; this is a suggestive null, not an established one. Delegation carries a real, quantified token/cost premium on the one clean delegate-vs-not comparison available (job-3: $0.4472 delegated vs $0.2693 not delegated, identical outcome, +66%)."
    definition_refs: [delegation_capable_harness_mode]
    check: "cd tools/cse-bench/benches/ladder && python3 delegation_harness.py  # reruns the SAME 4-job pack under the same delegation-capable mode; reps=1 in this run -- reps>1 and/or a larger job pack would strengthen n, per this claim's own explicit power caveat below"
    status: passing
    evidence: >-
      Registered 2026-07-14 (TASK-150), V-2 (see
      delegation-capable-harness-mode-built for the pre-registration
      commit/timestamp this run followed). Per-job result (framework
      t_working / framework_minus_agents t_working / agent_layer_effect):
      job-1-bugfix control True/True no_effect (0 delegations either
      side -- a trivial 1-line fix, the model judged decomposition not
      worth it); job-2-house-voice knowledge False/False no_effect
      (EXPECTED, not evidence against agents -- CC_KNOWLEDGE_REPO is an
      empty tree at this rung on both sides, per
      phase-4-cross-harness-behavior.md's own precedent for the same
      job, so this cell is knowledge-gated, not agent-gated); job-3-
      integration-report integrations True/True no_effect (framework
      delegated to "me", framework_minus_agents did not -- the one clean
      delegate-vs-not pair in this run); job-4-toolkit framework True/True
      no_effect (BOTH rungs delegated, framework to "me",
      framework_minus_agents to the generic fallback "claude" -- not a
      clean delegate-vs-not pair, reported separately from job-3's
      figure, not averaged into it).

      PACK-LEVEL: 4/4 no_effect, 0 "helps", 0 "hurts", 0 discordant pairs
      (McNemar b=c=0).

      COST PREMIUM (job-3, the one clean pair): framework (delegated)
      total cost $0.4472 vs framework_minus_agents (not delegated)
      $0.2693 for an IDENTICAL mechanical outcome -- +66%. Mechanism: a
      subagent opens a fresh context that cannot reuse the main session's
      already-warmed prompt cache (framework's subagent turn alone spent
      14,364 cache-creation + 48,141 cache-read + 937 output tokens on
      top of a SMALLER main-session spend than the non-delegating
      alternative). job-4 shows the opposite direction ($0.3618 framework
      vs $0.4572 framework_minus_agents) but is confounded (both
      delegated, to different subagent identities, with
      framework_minus_agents needing an extra main-session turn) and is
      NOT used to compute "the" delegation premium.

      STATISTICAL POWER, STATED HONESTLY (per this task's own explicit
      instruction not to overstate a small-n result, and this register's
      own precedent at outcome-token-efficiency's n=3/Fisher's-exact
      p=0.10 disclosure): n=4 paired job-cells, 0 discordant pairs cannot
      distinguish "the agent layer truly has no effect on mechanical
      acceptance for jobs like these" from "the agent layer has a real
      but small/rare effect that 4 paired trials were not enough to
      catch" -- both readings are equally consistent with this data. Per
      standard paired-proportion (McNemar) sample-size guidance,
      detecting even a moderate discordance rate at conventional (80%)
      power typically requires several dozen discordant pairs; given the
      true discordance rate here is unknown and could plausibly be well
      under 50% of jobs, an honest ballpark is an ESTIMATED several dozen
      to 100+ paired job-cells (more reps per job and/or a larger/more
      varied job pack) before any "agents help/hurt/do nothing" verdict
      can be asserted with confidence. This claim reports a suggestive
      null on THIS 4-job pack -- the first real, mechanically-verified
      data point this program has had on the question (vs zero before
      it) -- not a settled verdict.

      COST: 8-cell run $2.664 real (list-price-equivalent, Claude Code
      subscription usage -- never separately billed, per
      phase-4-cross-harness-behavior.md Sec 6's standing convention);
      combined with delegation-capable-harness-mode-built's 3 feasibility
      probes ($1.617), grand total this investigation $4.28, against a
      pre-registered $33 worst case (13% of ceiling).
