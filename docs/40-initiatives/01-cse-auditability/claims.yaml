      already baked into the "1228 token" CLAUDE.md figure above, not a
      separate before/after delta (no reliable pre-trim same-model
      baseline exists: the one pre-trim live run, TASK-125's first run,
      never captured turn-level data and its ephemeral run_root cannot be
      unambiguously re-identified among several later runs' leftover temp
      directories on this machine -- marked, not guessed, same as the
      contaminated-artifact finding above). A capability-control result,
      found while building this ablation, not asked for but too material
      to omit: on ALL 3 discriminating jobs, t_working was IDENTICAL with
      CLAUDE.md removed and IDENTICAL with the entire 13-agent roster
      removed (job-2 0/3=0/3=0/3=0/3, job-3 3/3 all four, job-4 3/3 all
      four) -- neither ablation caused a single regression on this job
      pack, at this task difficulty, with Sonnet, while both cost real,
      measured average tokens (1228 and 1071 respectively). Scoped
      finding, not a general claim that these components are worthless --
      stated plainly per this program's own honesty convention.

      CORRECTION (QA WP-83, 2026-07-14, adversarial verification of this
      task's own WP-81): the capability-control paragraph above is true on
      the data but was stated more broadly than the evidence supports, and
      is corrected here rather than silently reworded. QA structurally
      parsed every one of this run's 72 transcripts (48 main + 24 ablation
      cells, reading real `tool_use` content blocks, not a text grep) and
      found ZERO Task-tool invocations anywhere -- including in the 3
      rungs (framework/knowledge/integrations) where the full 13-agent
      roster WAS present and available (13 real .claude/agents/*.md files
      materialized on disk, verified). INDEPENDENTLY RE-VERIFIED by this
      correction, same day, against the same 72 transcript files (still on
      disk under /var/folders/.../T/cse-bench-ladder-*/, a fresh
      structural parse of every message.content[].type=="tool_use" block,
      not a re-run of QA's own script): the only tool names any of the 72
      cells ever invoke, across all 6 rungs, are {Bash, Edit, Read, Write}
      -- "Task" never appears once. This changes the correct reading of
      "neither ablation caused a single regression" from the STRONG claim
      ("the agent layer adds nothing") to the WEAK one this program's own
      honesty convention requires: we could not construct a job on which
      the agent layer was even invoked, let alone shown to help. The
      ladder (headless `claude -p`, single-shot cells) is structurally
      incapable of evaluating the framework/agent delegation layer at all
      in this run, because delegation never fired in its harness mode --
      see the new first-class claim
      ladder-cannot-measure-framework-agent-layer for the full
      instrument-limitation finding and the open question this raises
      against delegation-rate-baseline's real-session ~40% tool-share
      figure. "Removing agents caused zero regressions" must not be
      requoted on its own as evidence the agent layer is unnecessary; it
      is evidence this specific instrument never exercised it.

      COST CORRECTION (QA WP-83, same pass) + UNITS CORRECTION (same task
      as this claim's other 2026-07-14 edits, a truth defect not a
      formatting nit): WP-81's own headline "RESULTS (72 live cells total,
      $13.74)" does not reconcile with its own stated components, AND that
      whole framing quoted a dollar figure as if it were money spent when
      it never was. Summing `usage.total_tokens` / `envelope.modelUsage.
      *.costUSD` directly from every cell JSON across the 3 relevant run
      directories (independently re-verified by this correction, same
      method as QA, tokens added here for the first time): 8,772,115
      tokens / $8.6978 (20260714T144205Z, 48-cell main run) + 1,740,000
      tokens / $1.7777 (20260714T150155Z, framework_minus_claudemd, 12
      cells) + 1,839,073 tokens / $1.8793 (20260714T150358Z,
      framework_minus_agents, 12 cells) = 12,351,188 tokens / $12.3549,
      i.e. ~12.35M tokens / a $12.35 LIST-PRICE EQUIVALENT -- the verified
      figure, ~11% (~$1.39 list-price-equivalent) below WP-81's quoted
      $13.74. NEITHER figure was ever billed: this machine runs the ladder
      under the owner's Claude Code SUBSCRIPTION auth (configs.py's
      `_seed_home_for_auth()` seeds each isolated HOME with his real
      credentials), not a metered API key -- `costUSD` is Claude Code's own
