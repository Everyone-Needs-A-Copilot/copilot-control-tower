    statement: "PRE-REGISTERED (V-2), committed BEFORE any confirmation cell runs: a Fisher's-exact-powered confirmation of ladder-v2-o6-discriminating-verdict's n=3 split, at n=10 reps per (job, rung) cell, on job-2-house-voice and job-3-integration-report across all 4 original ladder rungs {bare, framework, knowledge, integrations} (NOT the O-4 residual-ablation rungs framework_minus_*) -- 80 cells total, same model (sonnet) as the v2 run this confirms, fixed n, no optional stopping."
