      correctly, and all 13 surviving agents' Output Format/Never sections
      were rewritten so "no task ID" is no longer framed as a valid reason
      to skip storage. This closes the MECHANISM gap; it does not by
      itself close the ceiling breach above, since bucket (c)'s 75.2%
      silent-non-attempt rate was never actually blocked by the task-ID
      requirement (most of bucket (c) never called `tc wp store` at all,
      successfully or not) -- whether this fix moves the needle is a
      question for the next re-measurement, not this evidence.
