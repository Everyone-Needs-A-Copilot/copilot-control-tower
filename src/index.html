<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Popover-only surface: the window is hidden by default (see src-tauri/tauri.conf.json)
         and is shown by clicking the tray item. There is no dock/taskbar presence. -->
    <title>Copilot Control Tower</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/popover.css" />
  </head>
  <body>
    <!-- Dev-only fixture switcher (see main.ts) mounts above #app when running
         under `vite dev` outside a Tauri host; it is dead code in a release
         build (`import.meta.env.DEV` is statically stripped by Vite). -->
    <div id="ct-dev-harness"></div>
    <div id="app" aria-label="Copilot Control Tower"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
