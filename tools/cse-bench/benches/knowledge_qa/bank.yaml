# bank.yaml — B-9 private-fact question bank (TASK-92).
#
# Authored by hand against the product dossiers under
# /Volumes/Dev/Sites/CSE/knowledge-copilot-internal/02-products/04-applications/
# (convoco/, insights-copilot/). This is the LLM-judgment step the task
# calls out: every question below was chosen because its answer is a
# PRIVATE fact — a version number, internal module name, canonical config
# value, former name, internal domain, or count — that base Claude cannot
# plausibly know without the reference document, not something a language
# model could produce from public knowledge or plausible-sounding
# improvisation. See README.md "What makes a question private" for the
# selection rule and the questions that were drafted and dropped.
#
# Schema (one entry per question):
#   id       — stable slug, "<dossier>-NN"
#   dossier  — "convoco" | "insights-copilot" (matches the directory name
#              under knowledge-copilot's product-dossier tree)
#   question — the literal prompt tail asked in both arms
#   answer   — canonical answer string (objectively checkable, not prose)
#   accept   — list of additional normalized-equivalent strings that count
#              as correct (phrasing/punctuation/unit variants); may be empty
#   source   — "<dossier>/<file>:<line>" pointing at the dossier line the
#              answer was read from, for auditability
#
# run.py resolves `source` to the actual dossier file on disk (read-only,
# from knowledge-copilot) to build the "with-knowledge" arm's prompt; the
# "without" arm never sees this file's content or path.

