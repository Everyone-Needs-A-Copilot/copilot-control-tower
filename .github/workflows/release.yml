name: release

# Build, sign, notarize, verify, and publish the native macOS User app.
#
# Owner-gated: needs the Developer ID Application cert and notarization
# credentials; the real signed `cc` artifact is pinned in this repository.
# Triggered only by pushing
# a `v*` tag, which is itself an owner action, never a normal PR/push.
#
# Every credential below is read from a repo/environment secret — never
# hardcoded in this file (invariant #4).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-sign-notarize:
    # The repository currently has no release environment or Apple credential
    # secrets. Keep tag pushes honest (skipped, not guaranteed-red) until the
    # owner configures custody and explicitly enables this job.
    if: ${{ vars.RELEASE_CI_ENABLED == 'true' }}
    runs-on: macos-14
    # Owner-gated: this job requires repo secrets that do not exist in this
    # session (APPLE_SIGNING_IDENTITY, APPLE_CERTIFICATE, etc.) and is only
    # ever triggered by an owner-pushed release tag.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: cargo test (fitness functions + unit tests, ~247+ tests)
        working-directory: src-tauri
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check

      - name: Verify vendored cc (checksum + verify-not-resign, ADR-M4-005)
        run: ./scripts/verify-vendored-cc.sh --release packaging/cc/cc

      - name: Verify packaged cross-version schema compatibility
        run: ./scripts/tests/test_schema_compatibility_release_gate.sh

      - name: plutil -lint watchdog plist
        run: plutil -lint packaging/launchd/com.everyoneneedsacopilot.controltower.plist

      - name: Verify native User app scenarios
        run: |
          ./scripts/tests/test_user_app_bundle.sh
          ./scripts/tests/smoke-scenarios.sh

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/control-tower-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::${keychain_password}"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

      - name: Materialize notarization API key
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          notary_key_path="${RUNNER_TEMP}/AuthKey_${{ secrets.APPLE_NOTARY_KEY_ID }}.p8"
          printf '%s' "${APPLE_NOTARY_KEY}" > "${notary_key_path}"
          chmod 600 "${notary_key_path}"
          echo "CT_NOTARY_KEY_PATH=${notary_key_path}" >> "${GITHUB_ENV}"

      - name: Package native User release from pushed tag
        env:
          CT_RELEASE_CHECKOUT: "1"
          CT_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CT_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          CT_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
        run: ./scripts/package-user-release.sh

      - name: Sign the update manifest (minisign, custody separate from Developer ID cert)
        env:
          CT_MINISIGN_SECRET_KEY: ${{ secrets.CT_MINISIGN_SECRET_KEY }}
        run: |
          echo "owner-gated: minisign two-of-N custody (ADR-M4-003) is not yet" \
               "assigned — release-and-versioning.md §2 step 3 blocks stable" \
               "promotion in CI until it is. This step is a documented no-op" \
               "placeholder, not a real signing call, until that custody" \
               "decision is made."

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copilot-control-tower-${{ github.ref_name }}
          path: |
            dist/user-release/*.app
            dist/user-release/*.dmg
            dist/user-release/*.sha256
            dist/user-release/controltower.compat.json
            dist/user-release/cc-notarization.json
            dist/user-release/release-metadata.json
