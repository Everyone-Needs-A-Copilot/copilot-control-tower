name: native-invariants

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shipping-swift-fitness:
    # The committed release launcher was built with this arm64 macOS 26
    # toolchain; its unchanged byte-identity gate requires the same inputs.
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v4
      - name: Install native gate prerequisites
        timeout-minutes: 3
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install ripgrep
          rg --version
          swiftc --version
          swiftc --version | grep -F 'swiftlang-6.3.3.1.3'
          test "$(xcrun --sdk macosx --show-sdk-version)" = '26.5'
      - name: Enforce native witness and plain-language boundaries
        run: ./scripts/tests/test_native_invariants.sh
      - name: Build shipping native User app
        run: ./scripts/build-user.command --build-only
      - name: Exercise crash-only launchd lifecycle
        run: ./scripts/tests/test_native_watchdog.sh
      - name: Enforce immutable release-source provenance
        run: |
          ./scripts/verify-release-launcher.sh
          ./scripts/tests/test_release_source_integrity.sh
