# A valid four-tier `copilot.layers.yml` — highest precedence first, rank
# ascending, list order agreeing with rank (four-tier-topology.md §4).
#
# The `dept-engineering` layer carries a `notes:` field this app doesn't
# model — that's deliberate: it exercises the never-destroy round-trip
# (settings::manifest's `round_trip_preserves_unknown_field` test), proving
# a hand-authored field the UI never showed survives parse -> emit.
version: 1
layers:
  - id: personal-pablo
    role: personal
    product: claude
    rank: 10
    source:
      repo: git@github-personal:pablitoalejo/claude-copilot-private.git
      ref: main
    auth: ssh-personal
    activation: always

  - id: dept-engineering
    role: department
    product: claude
    unit: engineering
    rank: 20
    source:
      repo: git@github-work:acme-corp/copilot-dept-engineering.git
      ref: v3.x
    auth: ssh-work
    activation: always
    notes: hand-added by Pablo — do not remove without asking eng-platform

  - id: org-acme
    role: org
    product: claude
    rank: 30
    source:
      repo: git@github-work:acme-corp/copilot-org.git
      ref: v3.x
    auth: ssh-work
    activation: always

  - id: foundation
    role: foundation
    product: claude
    rank: 40
    source:
      repo: https://github.com/Everyone-Needs-A-Copilot/claude-copilot.git
      ref: ^5.13.0
    auth: anon
    activation: always
