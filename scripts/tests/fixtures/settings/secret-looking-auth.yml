# Structurally VALID per `manifest.py::validate_layers` (auth is required
# to be a non-empty string; its CONTENT is never scanned there) — but the
# `auth` value below is shaped like a leaked GitHub personal access token.
#
# D-4 (`.copilot/wp/5.md`): `auth` must always be a REFERENCE (an alias
# name, `anon`, or `gh-device`), never a credential value. Catching THIS
# fixture is S3's job (the fail-closed secret-refusal write-time guard,
# `.copilot/wp/5.md` S3, `Depends: S1`) — not S1's. This fixture exists so
# S3's tests have a ready-made secret-shaped value to refuse; S1's own test
# (`settings::validate::secret_looking_auth_is_structurally_valid_s3_refuses_it_not_s1`)
# asserts S1 does NOT reject it, so the two layers' responsibilities stay
# distinct.
version: 1
layers:
  - id: personal-pablo
    role: personal
    product: claude
    rank: 10
    source:
      repo: git@github-personal:pablitoalejo/claude-copilot-private.git
    auth: ghp_1234567890ABCDEFabcdef1234567890AB
    activation: always
