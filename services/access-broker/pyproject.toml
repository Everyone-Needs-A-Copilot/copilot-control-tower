[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "control-tower-access-broker"
version = "0.1.0"
description = "GitHub-authorized OIDC assertion broker for Copilot Control Tower"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/control_tower_access_broker"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
